<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運転日報</title>
<style>
  :root{
    --ink:#2d3b35;--ink-soft:#5c7066;--line:#c8d8cc;--bg:#f5f8f4;--card:#ffffff;
    --brand:#6b9e7e;--brand-dark:#4d7a5e;--brand-tint:#e4f0e8;
    --amber:#9a5f12;--amber-tint:#fbf0db;--danger:#a82d24;--ok:#2e7d52;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);font-size:19px;line-height:1.7;
    display:flex;flex-direction:column;min-height:100dvh;-webkit-text-size-adjust:100%;overflow-x:hidden;}
  .pbar-wrap{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:10;}
  .pbar-title{font-size:18px;font-weight:800;color:var(--brand-dark);}
  .pbar-sub{font-size:14px;color:var(--ink-soft);margin-top:2px;}
  main{flex:1;padding:16px 16px 24px;max-width:640px;margin:0 auto;width:100%;}
  .pagehead{font-size:23px;font-weight:800;color:var(--brand-dark);margin:2px 0 2px;}
  .pagesub{font-size:15px;color:var(--ink-soft);margin:0 0 16px;line-height:1.6;}
  .sec-h{font-size:16px;font-weight:800;color:#fff;background:var(--brand);border-radius:10px;
    padding:9px 14px;margin:22px 0 12px;}
  .card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
  .card .ttl{font-size:19px;font-weight:800;color:var(--ink);}
  .card .sub{font-size:14px;color:var(--ink-soft);margin-top:2px;}
  .fld{margin:14px 0 0;}
  .flabel{font-size:15px;font-weight:700;color:var(--ink-soft);margin:0 0 6px;}
  .fhint{font-size:13px;color:#8a9a92;margin:5px 0 0;}
  .byline{font-size:13px;color:var(--brand-dark);background:var(--brand-tint);border-radius:8px;padding:4px 9px;display:inline-block;margin-top:6px;}
  input[type=text],input[type=number],input[type=time],input[type=datetime-local],textarea,select{
    width:100%;max-width:100%;font-size:21px;font-family:inherit;color:var(--ink);
    border:2px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;line-height:1.4;
    -webkit-appearance:none;appearance:none;}
  textarea{min-height:90px;resize:vertical;font-size:17px;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint);}
  .row2{display:flex;gap:10px;}
  .row2 > *{flex:1;min-width:0;}
  .meter-disp{background:var(--brand-tint);border-radius:12px;padding:12px 15px;font-size:20px;font-weight:800;color:var(--ink);}
  .meter-disp .arw{color:var(--ink-soft);font-weight:400;margin:0 8px;}
  .meter-disp .km{float:right;color:var(--brand-dark);}
  .src{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .tglbtn{margin-top:12px;font-family:inherit;font-size:14px;font-weight:700;background:#fff;border:2px solid var(--brand);
    color:var(--brand-dark);border-radius:10px;padding:9px 14px;cursor:pointer;}
  .tglbtn.open{background:var(--brand);color:#fff;}
  .fixbox{display:none;border-top:1px dashed var(--line);margin-top:12px;padding-top:12px;}
  .fixbox.show{display:block;}
  .chk{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;margin-top:14px;cursor:pointer;}
  .chk input{width:24px;height:24px;flex:0 0 auto;}
  .legrow{border:1px solid #cfe3d6;border-radius:10px;padding:10px;margin-top:10px;background:#f7fbf8;}
  .legrow .row2{margin-top:8px;}
  .legrow .del{margin-top:8px;font-family:inherit;font-size:13px;font-weight:700;background:#fbe9e7;color:#a82d24;
    border:none;border-radius:8px;padding:7px 11px;cursor:pointer;}
  .addbtn{width:100%;font-family:inherit;font-size:16px;font-weight:700;background:#fff;border:2px dashed var(--brand);
    color:var(--brand-dark);border-radius:12px;padding:13px;cursor:pointer;margin-top:6px;}
  .rmtrip{float:right;font-family:inherit;font-size:13px;font-weight:700;background:#fbe9e7;color:#a82d24;
    border:none;border-radius:8px;padding:6px 11px;cursor:pointer;}
  .err{display:none;background:#fbe9e7;border:2px solid #eebab4;color:var(--danger);
    font-size:16px;font-weight:700;border-radius:12px;padding:12px 15px;margin-top:14px;}
  .err.show{display:block;}
  .nav{position:sticky;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);
    border-top:1px solid var(--line);padding:14px 16px;box-shadow:0 -6px 20px rgba(20,40,50,.07);}
  .nav .inner{max-width:640px;margin:0 auto;width:100%;}
  button.nav-btn{width:100%;border:none;border-radius:14px;font-family:inherit;font-weight:800;
    cursor:pointer;min-height:62px;font-size:21px;letter-spacing:.03em;background:var(--ok);color:#fff;}
  button.nav-btn:disabled{opacity:.5;}
  .done{text-align:center;padding-top:36px;}
  .done .ico{width:88px;height:88px;border-radius:50%;background:var(--brand-tint);color:var(--ok);
    display:grid;place-items:center;font-size:50px;margin:0 auto 16px;}
  .done h2{font-size:27px;margin:0 0 8px;color:var(--brand-dark);}
  .done p{font-size:18px;color:var(--ink-soft);margin:0 0 28px;}
  .tokerr{padding:60px 24px;text-align:center;}
  .tokerr h2{font-size:22px;color:var(--danger);margin:0 0 12px;}
  .tokerr p{font-size:16px;color:var(--ink-soft);line-height:1.8;}
  .previewbar{background:var(--amber-tint);color:var(--amber);font-weight:800;text-align:center;padding:8px;font-size:14px;}
  @media (max-width:768px){ body{font-size:17px;} .pagehead{font-size:20px;} input,textarea,select{font-size:18px;} button.nav-btn{min-height:56px;font-size:18px;} }
</style>
</head>
<body>

<main id="screen"></main>

<div class="nav" id="nav" style="display:none;">

    <div class="err" id="sendErr">送信に失敗しました。時間をおいて、もう一度お試しください。</div>
  </div>
</div>

<script>

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

const screen = document.getElementById('screen');
const nav = document.getElementById('nav');
const submitBtn = document.getElementById('submitBtn');

const previewMode = (location.hash === '#preview') || (new URLSearchParams(location.search).get('preview') === '1');

let accessToken = null;
(function readToken(){
  const h = location.hash;
  if (h && h.startsWith('#t=')) { accessToken = h.slice(3); history.replaceState(null,'',location.pathname+location.search); }
  else { const p=new URLSearchParams(location.search); if(p.get('t')){ accessToken=p.get('t'); p.delete('t'); const qs=p.toString(); history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')); } }
})();

function showTokenError(title, msg){
  document.getElementById('phead').textContent = '';
  screen.innerHTML = `<div class="tokerr"><h2>${esc(title)}</h2><p>${msg}</p></div>`;
}

/* 表示用の時刻整形（「2026-08-19T05:00:00+09:00」→「05:00」） */
function hm(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function toLocalInput(iso){   // datetime-local用（分単位）
  if(!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fromLocalInput(v){   // datetime-local → ISO（日本時間として送る）
  if(!v) return null;
  return v.length===16 ? v+':00+09:00' : v+'+09:00';
}
const SEG_LABEL = s => ({'登校':'登校便','下校①':'下校便①','下校②':'下校便②','下校③':'下校便③'}[s] || s);

/* ---- 状態 ---- */
let INFO = null;
let newTripSeq = 0;
const newTrips = [];   // 手入力で追加した運行（表示中のカード情報）

function courseLabel(d){ return (d.school_name||'') + ' ' + (d.course_name||''); }

function render(){
  document.getElementById('phead').textContent = `${INFO.staff_name || ''}さん　${INFO.work_date || ''}`;
  let h = `<div class="pagehead">今日の乗務を確認してください</div>
    <div class="pagesub">数字とメーターが正しいかご確認のうえ、間違っていれば直してから送信してください。<br>
    正しければ、そのまま送信していただいて構いません。</div>`;

  if (INFO.duties && INFO.duties.length){
    h += `<div class="sec-h">乗った便の人数</div>`;
    INFO.duties.forEach(d=>{
      const byNote = d.passengers_by_name ? `<div class="byline">${esc(d.passengers_by_name)}さんの入力</div>` : '';
      h += `<div class="card" data-duty="${d.id}">
        <div class="ttl">${esc(courseLabel(d))}</div>
        <div class="sub">${esc(SEG_LABEL(d.segment))}　${d.start_time?esc(d.start_time)+'発':''}</div>
        <div class="fld">
          <div class="flabel">乗車人数</div>
          <input type="number" inputmode="numeric" class="in-pax" min="0" max="99"
            value="${d.passengers!=null?d.passengers:''}" placeholder="人数を入力">
        </div>
        ${byNote}
      </div>`;
    });
  }

  h += `<div class="sec-h">その日の運行</div>`;
  if (INFO.trips && INFO.trips.length){
    INFO.trips.forEach(t=>{
      const startShow = t.conf_start_at || t.tenko_start_at || t.start_at;
      const endShow   = t.conf_end_at   || t.tenko_end_at   || t.end_at;
      const srcLabel  = t.source === 'digitacho' ? 'デジタコの記録' : (t.source==='manual' ? '手入力' : 'Excel取込');
      h += `<div class="card" data-trip="${t.id}">
        <div class="ttl">${esc(t.vehicle_label||'（車両不明）')}</div>
        <div class="sub">${hm(startShow)} 〜 ${hm(endShow)}　<span class="src">${srcLabel}</span></div>
        <div class="fld">
          <div class="meter-disp">${t.odo_start!=null?Number(t.odo_start).toLocaleString('ja-JP',{minimumFractionDigits:1}):'—'}
            <span class="arw">→</span>${t.odo_end!=null?Number(t.odo_end).toLocaleString('ja-JP',{minimumFractionDigits:1}):'—'}
            <span class="km">${t.km_total!=null?Number(t.conf_km_total??t.km_total).toLocaleString('ja-JP',{minimumFractionDigits:1})+' km':''}</span></div>
        </div>
        <button type="button" class="tglbtn" data-fixtoggle>メーター・時刻が違う場合はこちら</button>
        <div class="fixbox">
          <div class="row2">
            <div class="fld" style="margin-top:0;"><div class="flabel">実際の始業</div>
              <input type="datetime-local" class="in-conf-start" value="${toLocalInput(startShow)}"></div>
            <div class="fld" style="margin-top:0;"><div class="flabel">実際の終業</div>
              <input type="datetime-local" class="in-conf-end" value="${toLocalInput(endShow)}"></div>
          </div>
          <div class="fld"><div class="flabel">実際の走行距離（km）</div>
            <input type="number" inputmode="decimal" class="in-conf-km" step="0.1"
              value="${t.conf_km_total!=null?t.conf_km_total:''}" placeholder="${t.km_total!=null?Number(t.km_total).toFixed(1):''}"></div>
          <div class="fld"><div class="flabel">訂正した理由</div>
            <textarea class="in-note" placeholder="例：デジタコの操作を忘れていた／実測と食い違う など">${esc(t.correction_note||'')}</textarea></div>
        </div>
        <label class="chk"><input type="checkbox" class="in-accident" ${t.accident_flag?'checked':''}> 事故・ヒヤリハットがあった</label>
        <div class="fixbox accbox ${t.accident_flag?'show':''}">
          <div class="fld" style="margin-top:8px;"><textarea class="in-accnote" placeholder="いつ・どこで・何があったか">${esc((t.note||'').replace(/^事故・ヒヤリハット：/,''))}</textarea></div>
        </div>
      </div>`;
    });
  } else if (!newTrips.length) {
    h += `<div class="pagesub">この日の運行はまだ入っていません。デジタコの取り込み待ちか、対象外の車両かもしれません。下から追加できます。</div>`;
  }

  newTrips.forEach(nt => { h += renderNewTripCard(nt); });

  h += `<button type="button" class="addbtn" id="addTripBtn">＋ 別の運行を手入力で追加する（貸切・霊柩・デジタコの無い車両など）</button>`;

  screen.innerHTML = h;
  wireEvents();
}

function renderNewTripCard(nt){
  const legs = nt.legs.map((l,i)=>`
    <div class="legrow" data-legidx="${i}">
      <div class="row2">
        <select class="in-leg-kind">
          ${['乗車','降車','積込','積卸','休憩','待機','給油','その他'].map(k=>`<option ${l.kind===k?'selected':''}>${k}</option>`).join('')}
        </select>
        <input type="text" class="in-leg-place" placeholder="場所" value="${escA(l.place||'')}">
      </div>
      <div class="row2">
        <input type="time" class="in-leg-time" value="${l.time||''}">
        <input type="number" inputmode="numeric" class="in-leg-count" placeholder="人数" value="${l.count!=null?l.count:''}">
      </div>
      <button type="button" class="del" data-dellegof="${nt.id}" data-delleg="${i}">この行程を消す</button>
    </div>`).join('');
  return `<div class="card" data-newtrip="${nt.id}">
    <button type="button" class="rmtrip" data-rmtrip="${nt.id}">削除</button>
    <div class="ttl">手入力の運行</div>
    <div class="fld" style="margin-top:8px;"><div class="flabel">車両番号</div>
      <input type="text" class="in-nv-label" placeholder="例：横浜200あ1234" value="${escA(nt.vehicle_label||'')}"></div>
    <div class="row2">
      <div class="fld"><div class="flabel">出庫メーター</div><input type="number" inputmode="decimal" class="in-nv-start" value="${nt.odo_start||''}"></div>
      <div class="fld"><div class="flabel">帰庫メーター</div><input type="number" inputmode="decimal" class="in-nv-end" value="${nt.odo_end||''}"></div>
    </div>
    <div class="row2">
      <div class="fld"><div class="flabel">団体名・業者名（任意）</div><input type="text" class="in-nv-client" value="${escA(nt.client_name||'')}"></div>
      <div class="fld"><div class="flabel">目的地（任意）</div><input type="text" class="in-nv-dest" value="${escA(nt.destination||'')}"></div>
    </div>
    <div class="flabel" style="margin-top:16px;">行程（発着地・時刻・人数）</div>
    ${legs}
    <button type="button" class="tglbtn" data-addlegof="${nt.id}">＋ 行程を1行足す</button>
  </div>`;
}

function wireEvents(){
  screen.querySelectorAll('[data-fixtoggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const box = btn.nextElementSibling;
      box.classList.toggle('show');
      btn.classList.toggle('open', box.classList.contains('show'));
    });
  });
  screen.querySelectorAll('.in-accident').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      cb.closest('.card').querySelector('.accbox').classList.toggle('show', cb.checked);
    });
  });
  const addTripBtn = document.getElementById('addTripBtn');
  if (addTripBtn) addTripBtn.addEventListener('click', ()=>{
    newTrips.push({ id: 'n'+(newTripSeq++), vehicle_label:'', odo_start:'', odo_end:'', client_name:'', destination:'', legs:[] });
    render();
  });
  screen.querySelectorAll('[data-rmtrip]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.rmtrip;
      const i = newTrips.findIndex(x=>x.id===id);
      if(i>=0) newTrips.splice(i,1);
      render();
    });
  });
  screen.querySelectorAll('[data-addlegof]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const nt = newTrips.find(x=>x.id===btn.dataset.addlegof);
      if(nt){ syncNewTripInputs(); nt.legs.push({kind:'乗車',place:'',time:'',count:null}); render(); }
    });
  });
  screen.querySelectorAll('[data-dellegof]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const nt = newTrips.find(x=>x.id===btn.dataset.dellegof);
      if(nt){ syncNewTripInputs(); nt.legs.splice(Number(btn.dataset.delleg),1); render(); }
    });
  });
}

/* 画面に入力中の手入力運行の値を、再描画前にnewTripsへ拾っておく（行程の追加/削除で消えないように） */
function syncNewTripInputs(){
  screen.querySelectorAll('[data-newtrip]').forEach(card=>{
    const nt = newTrips.find(x=>x.id===card.dataset.newtrip);
    if(!nt) return;
    nt.vehicle_label = card.querySelector('.in-nv-label').value;
    nt.odo_start = card.querySelector('.in-nv-start').value;
    nt.odo_end = card.querySelector('.in-nv-end').value;
    nt.client_name = card.querySelector('.in-nv-client').value;
    nt.destination = card.querySelector('.in-nv-dest').value;
    card.querySelectorAll('.legrow').forEach((row,i)=>{
      nt.legs[i] = {
        kind: row.querySelector('.in-leg-kind').value,
        place: row.querySelector('.in-leg-place').value,
        time: row.querySelector('.in-leg-time').value,
        count: row.querySelector('.in-leg-count').value || null,
      };
    });
  });
}

function buildPayload(){
  syncNewTripInputs();
  const duties = [];
  screen.querySelectorAll('[data-duty]').forEach(card=>{
    const v = card.querySelector('.in-pax').value;
    duties.push({ id: Number(card.dataset.duty), passengers: v===''?null:Number(v) });
  });

  const trips = [];
  screen.querySelectorAll('[data-trip]').forEach(card=>{
    const id = Number(card.dataset.trip);
    const orig = (INFO.trips || []).find(t=>t.id===id) || {};
    // 表示していた元の値（画面を開いた時点の既定値）と比べ、実際に変えたものだけ送る。
    // 「訂正する」欄を開いただけで中身を変えていない場合、訂正扱いにしないため
    const origStart = toLocalInput(orig.conf_start_at || orig.tenko_start_at || orig.start_at);
    const origEnd   = toLocalInput(orig.conf_end_at   || orig.tenko_end_at   || orig.end_at);
    const origKm    = orig.conf_km_total!=null ? String(orig.conf_km_total)
                     : (orig.km_total!=null ? Number(orig.km_total).toFixed(1) : '');
    const confStart = card.querySelector('.in-conf-start').value;
    const confEnd = card.querySelector('.in-conf-end').value;
    const confKm = card.querySelector('.in-conf-km').value;
    const note = card.querySelector('.in-note').value;
    const accident = card.querySelector('.in-accident').checked;
    const accNote = card.querySelector('.in-accnote').value;
    trips.push({
      id,
      conf_start_at: (confStart && confStart !== origStart) ? fromLocalInput(confStart) : null,
      conf_end_at:   (confEnd   && confEnd   !== origEnd)   ? fromLocalInput(confEnd)   : null,
      conf_km_total: (confKm !== '' && Number(confKm).toFixed(1) !== Number(origKm||0).toFixed(1)) ? Number(confKm) : null,
      correction_note: note || null,
      accident_flag: accident,
      note: (accident && accNote) ? ('事故・ヒヤリハット：' + accNote) : null,
    });
  });
  newTrips.forEach(nt=>{
    if(!nt.vehicle_label) return;
    trips.push({
      vehicle_label: nt.vehicle_label,
      odo_start: nt.odo_start || null, odo_end: nt.odo_end || null,
      client_name: nt.client_name || null, destination: nt.destination || null,
      legs: nt.legs.filter(l=>l.place || l.count).map((l,i)=>({
        seq: i+1, kind: l.kind, place: l.place || null,
        arrive_at: l.time ? fromLocalInput(INFO.work_date+'T'+l.time) : null,
        count: l.count!=null && l.count!=='' ? Number(l.count) : null, count_unit: '人',
      })),
    });
  });
  return { duties, trips };
}

submitBtn.addEventListener('click', async ()=>{
  if (previewMode){ alert('これは見本表示です。実際の送信はできません。'); return; }
  document.getElementById('sendErr').classList.remove('show');
  submitBtn.disabled = true; submitBtn.textContent = '送信しています…';
  try{
    const payload = buildPayload();
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/unten_submit`, { method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({ p_token: accessToken, p_payload: payload }) });
    if(!res.ok) throw new Error(await res.text());
    nav.style.display='none';
    screen.innerHTML = `<div class="done"><div class="ico">✓</div><h2>送信しました</h2>
      <p>ご確認いただき、ありがとうございました。<br>内容の変更が必要な場合は、同じリンクからもう一度開いて送り直してください。</p></div>`;
    window.scrollTo(0,0);
  }catch(e){
    console.error(e);
    document.getElementById('sendErr').classList.add('show');
    submitBtn.disabled = false; submitBtn.textContent = 'この内容で送信する';
  }
});

/* ---- 起動 ---- */
(async function init(){
  if (previewMode) document.getElementById('previewbar').style.display = 'block';

  if (previewMode && !accessToken){
    INFO = {
      staff_name: '（見本）高尾 太郎', work_date: '2026-08-19',
      duties: [
        { id:1, school_name:'八王子特別支援学校', course_name:'小宮コース', segment:'登校', start_time:'06:30', passengers:8, passengers_by_name:'山田花子' },
        { id:2, school_name:'八王子特別支援学校', course_name:'小宮コース', segment:'下校①', start_time:'14:00', passengers:null, passengers_by_name:null },
      ],
      trips: [
        { id:1, vehicle_label:'八王子200あ327', odo_start:12000.5, odo_end:12050.2, km_total:49.7,
          start_at:'2026-08-19T06:00:00+09:00', end_at:'2026-08-19T15:00:00+09:00',
          source:'digitacho', conf_start_at:null, conf_end_at:null, conf_km_total:null, accident_flag:false, note:null, correction_note:null },
      ],
    };
    nav.style.display='block';
    render();
    return;
  }

  if (!accessToken){
    showTokenError('このページは直接開けません', '運転日報の入力は、会社から届いた本人専用リンクからのみ行えます。<br>リンクが見当たらない場合は管理者にお問い合わせください。<br><br><span style="font-size:13px;color:#8a9a92;">管理者の方へ：確認は <a href="untenn.html#preview" style="color:#4d7a5e;font-weight:700;">見本</a> をご利用ください。</span>');
    return;
  }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/unten_open`, { method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({ p_token: accessToken }) });
    if(!res.ok){
      const t = await res.text();
      if (t.includes('expired')) showTokenError('リンクの有効期限が切れています', 'このリンクは使用できなくなりました。<br>管理者に新しいリンクの発行を依頼してください。');
      else if (t.includes('too many')) showTokenError('アクセスが一時制限されています', 'しばらく時間をおいてから、もう一度リンクを開いてください。');
      else showTokenError('リンクが無効です', 'メールに記載されたリンクをそのまま開いてください。');
      return;
    }
    INFO = await res.json();
    nav.style.display = 'block';
    render();
  }catch(e){
    console.error(e);
    showTokenError('通信エラー', 'ネットワークの状態を確認して、もう一度リンクを開いてください。');
  }
})();
</script>
