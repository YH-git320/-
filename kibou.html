<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<title>シフト希望表</title>
<style>
  :root{
    --ink:#2d3b35;--ink-soft:#5c7066;--line:#c8d8cc;--bg:#f5f8f4;
    --brand:#6b9e7e;--brand-dark:#4d7a5e;--brand-tint:#e4f0e8;
    --sat:#e6f1fb;--sat-ink:#0c447c;--sun:#fceaea;--sun-ink:#8f2222;
    --on:#1f6fb5;--on-tint:#dcecfa;--danger:#a82d24;--ok:#2e7d52;--amber:#9a5f12;--amber-tint:#fbf0db;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);font-size:18px;line-height:1.6;
    -webkit-text-size-adjust:100%;overflow-x:hidden;}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px 8px;position:sticky;top:0;z-index:20;}
  .top .ttl{font-size:14px;color:var(--ink-soft);}
  .top .trow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .top .nm{font-size:22px;font-weight:800;color:var(--brand-dark);line-height:1.3;}
  .intro{padding:0 14px;}
  .top .dl{font-size:15px;font-weight:700;color:var(--danger);}
  .guide{background:var(--brand-tint);border-radius:10px;padding:9px 12px;margin:10px 0 0;font-size:15px;line-height:1.6;}
  .bar{display:flex;gap:8px;margin-top:10px;}
  .bar button{flex:1;font-family:inherit;font-size:15px;font-weight:700;padding:10px 6px;border-radius:10px;
    border:2px solid var(--brand);background:#fff;color:var(--brand-dark);cursor:pointer;}
  .bar button:active{background:var(--brand-tint);}
  .status{margin:12px 14px 0;padding:10px 12px;border-radius:10px;font-size:15px;line-height:1.6;}
  .status.ok{background:#eaf6ee;border:1px solid #bfe3c8;color:#1f5e3a;}
  .status.warn{background:var(--amber-tint);border:1px solid #ecd3a0;color:var(--amber);}
  .list{margin-top:12px;background:#fff;border-top:1px solid var(--line);}
  .gh,.r{display:grid;grid-template-columns:104px 1fr 1fr;}
  .gh{position:sticky;top:var(--topH,150px);z-index:10;background:#eef4ef;border-bottom:1px solid var(--line);
    font-size:15px;font-weight:700;color:var(--ink-soft);}
  .gh div{padding:6px 0;text-align:center;}
  .r{border-bottom:1px solid var(--line);min-height:60px;}
  .r.sat{background:var(--sat);} .r.sun{background:var(--sun);}
  .dt{display:flex;flex-direction:column;justify-content:center;padding:0 10px;line-height:1.25;}
  .dt b{font-size:21px;font-weight:800;}
  .dt small{font-size:15px;font-weight:700;}
  .sat .dt small{color:var(--sat-ink);} .sun .dt small{color:var(--sun-ink);}
  .c{font-family:inherit;border:none;border-left:1px solid var(--line);background:transparent;border-radius:0;
    font-size:34px;font-weight:800;color:transparent;cursor:pointer;padding:0;min-height:60px;}
  .c.o{background:var(--on-tint);color:var(--on);}
  .c:disabled{cursor:default;}
  .note{padding:16px 14px;background:#fff;border-top:1px solid var(--line);}
  .note label{display:block;font-size:16px;font-weight:700;margin-bottom:6px;}
  .note textarea{width:100%;height:84px;font-family:inherit;font-size:17px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;}
  .note textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint);}
  .foot{background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    position:sticky;bottom:0;z-index:20;}
  .send{width:100%;font-family:inherit;font-size:20px;font-weight:800;padding:15px;border:none;border-radius:14px;
    background:var(--brand-dark);color:#fff;cursor:pointer;}
  .send:active{background:#3d6349;}
  .foot .sm{font-size:13px;color:var(--ink-soft);text-align:center;margin-top:6px;}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:18px;}
  .ov.show{display:flex;}
  .dlg{background:#fff;border-radius:16px;padding:20px 18px;width:100%;max-width:420px;max-height:88vh;overflow:auto;}
  .dlg h2{margin:0 0 8px;font-size:21px;color:var(--brand-dark);}
  .dlg .sum{font-size:19px;font-weight:700;margin:8px 0;}
  .dlg .lst{font-size:14px;color:var(--ink-soft);line-height:1.7;margin:8px 0 14px;}
  .dlg .btns{display:flex;gap:10px;margin-top:14px;}
  .dlg .btns button{flex:1;font-family:inherit;font-size:18px;font-weight:800;padding:13px 6px;border-radius:12px;cursor:pointer;}
  .b-ok{background:var(--brand-dark);color:#fff;border:none;}
  .b-ng{background:#fff;color:var(--brand-dark);border:2px solid var(--brand);}
  .done{padding:28px 18px;text-align:center;}
  .done .big{font-size:56px;line-height:1;}
  .done h2{font-size:24px;color:var(--brand-dark);margin:10px 0 6px;}
  .done p{font-size:16px;color:var(--ink-soft);margin:6px 0;}
  .done button{margin-top:16px;font-family:inherit;font-size:17px;font-weight:700;padding:12px 22px;border-radius:12px;
    border:2px solid var(--brand);background:#fff;color:var(--brand-dark);cursor:pointer;}
  .tokerr{padding:40px 22px;text-align:center;}
  .tokerr h2{font-size:22px;color:var(--danger);margin:0 0 10px;}
  .tokerr p{font-size:16px;color:var(--ink-soft);}
  .pv{background:#fff8e8;border-bottom:1px solid #e8d9b0;color:#8a6d1a;font-size:13px;padding:6px 12px;text-align:center;}
</style>
</head>
<body>
<div id="pv" class="pv" style="display:none;">管理者用の見本です（送信はできません）</div>
<div id="root"></div>

<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>

<script>
const SUPABASE_URL = "https://wxdyqkyqtizhtkwtpvru.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4ZHlxa3lxdGl6aHRrd3RwdnJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NzYxODEsImV4cCI6MjA5OTQ1MjE4MX0.yVbClXBk2JVeglevsBLY5sH2_m2ybCf71u4i_YYWyHE";

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const root = document.getElementById('root');
const DOW = ['日','月','火','水','木','金','土'];

const previewMode = (location.hash === '#preview');
let accessToken = null;
(function(){
  const h = location.hash;
  if (h && h.startsWith('#t=')) { accessToken = h.slice(3); history.replaceState(null,'',location.pathname+location.search); }
})();

let INFO = null;        // サーバーから受け取った内容
let ON = {};            // { 'YYYY-MM-DD|g': true, 'YYYY-MM-DD|b': true }
let CLOSED = false;
let DRAFT_KEY = null;

function md(d){ const p=d.split('-'); return Number(p[1])+'/'+Number(p[2]); }
function jpDate(d){ const p=d.split('-'); return Number(p[0])+'年'+Number(p[1])+'月'+Number(p[2])+'日'; }
function isOff(day){ return day.dow===0 || day.dow===6 || !!day.hol; }
function isSunLike(day){ return day.dow===0 || !!day.hol; }

function showErr(title, msg){
  root.innerHTML = `<div class="tokerr"><h2>${esc(title)}</h2><p>${msg}</p></div>`;
}

/* ---- 下書き（この端末の中だけ。途中で閉じても続きから） ---- */
function draftLoad(){
  try{ const v = localStorage.getItem(DRAFT_KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
function draftSave(){
  if(previewMode) return;
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({ on: ON, note: (document.getElementById('note')||{}).value || '' })); }catch(e){}
}
function draftClear(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

function counts(){
  let g=0,b=0;
  for(const k in ON){ if(!ON[k]) continue; if(k.endsWith('|g')) g++; else b++; }
  return {g,b};
}

function fmtDT(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function render(){
  const P = INFO.period;
  let h = `<div class="top" id="top">
    <div class="ttl">シフト希望表　${jpDate(P.start)}〜${jpDate(P.end)}</div>
    <div class="trow"><div class="nm">${esc(INFO.staff_name)} さん</div>
    <div class="dl">${CLOSED ? '〆切を過ぎました' : '〆切 ' + md(P.deadline)}</div></div></div>`;
  if(!CLOSED){
    h += `<div class="intro"><div class="guide">出勤できる便をタップして <b>○</b> をつけてください。<br>○のない便は、出勤できない日として扱います。</div>
    <div class="bar"><button type="button" id="bAll">平日をすべて○</button><button type="button" id="bClr">すべて消す</button></div></div>`;
  }

  if(CLOSED){
    h += `<div class="status warn">〆切を過ぎたため、内容は変えられません。${INFO.submitted?'送信済みの内容が表示されています。':'変更が必要な場合は、事務所へご連絡ください。'}</div>`;
  } else if(INFO.submitted){
    h += `<div class="status ok">${esc(fmtDT(INFO.last_submitted_at))} に送信済みです。直すときは、直してからもう一度送信してください。</div>`;
  }

  h += `<div class="list"><div class="gh" id="gh"><div>日付</div><div>登校</div><div>下校</div></div>`;
  for(const day of INFO.days){
    const cls = isSunLike(day) ? 'sun' : (day.dow===6 ? 'sat' : '');
    const lab = day.hol ? '祝・'+esc(day.hol) : DOW[day.dow];
    h += `<div class="r ${cls}"><div class="dt"><b>${md(day.d)}</b><small>${lab}</small></div>`;
    for(const s of ['g','b']){
      const k = day.d+'|'+s, on = !!ON[k];
      h += `<button type="button" class="c${on?' o':''}" data-k="${k}" aria-pressed="${on}" aria-label="${md(day.d)} ${s==='g'?'登校':'下校'}" ${CLOSED?'disabled':''}>○</button>`;
    }
    h += `</div>`;
  }
  h += `</div>
  <div class="note"><label for="note">連絡事項（あれば）</label>
    <textarea id="note" maxlength="500" placeholder="例：10/28は午前だけなら出勤できます" ${CLOSED?'disabled':''}></textarea></div>`;
  if(!CLOSED){
    h += `<div class="foot"><button type="button" class="send" id="bSend">この内容で送信する</button>
      <div class="sm">送信したあとも、〆切までは直して送り直せます</div></div>`;
  }
  root.innerHTML = h;

  const note = document.getElementById('note');
  note.value = INFO._note || '';
  note.addEventListener('input', draftSave);
  syncTop();

  root.querySelectorAll('.c').forEach(b => b.addEventListener('click', () => {
    if(CLOSED) return;
    const k = b.dataset.k; ON[k] = !ON[k];
    b.classList.toggle('o', !!ON[k]); b.setAttribute('aria-pressed', String(!!ON[k]));
    draftSave();
  }));
  const bAll = document.getElementById('bAll');
  if(bAll){
    bAll.addEventListener('click', () => {
      for(const day of INFO.days){ if(isOff(day)) continue; ON[day.d+'|g']=true; ON[day.d+'|b']=true; }
      paintAll(); draftSave();
    });
    document.getElementById('bClr').addEventListener('click', () => {
      if(!Object.values(ON).some(Boolean)) return;
      if(!confirm('つけた○をすべて消します。よろしいですか？')) return;
      ON = {}; paintAll(); draftSave();
    });
    document.getElementById('bSend').addEventListener('click', confirmSend);
  }
}

function paintAll(){
  root.querySelectorAll('.c').forEach(b => {
    const on = !!ON[b.dataset.k];
    b.classList.toggle('o', on); b.setAttribute('aria-pressed', String(on));
  });
}
function syncTop(){
  const t = document.getElementById('top'); if(!t) return;
  document.documentElement.style.setProperty('--topH', t.offsetHeight + 'px');
}
window.addEventListener('resize', syncTop);

/* ---- 送信 ---- */
function confirmSend(){
  const c = counts();
  const ov = document.getElementById('ov'), dlg = document.getElementById('dlg');
  const dates = (s) => INFO.days.filter(d => ON[d.d+'|'+s]).map(d => md(d.d)).join('、') || 'なし';
  dlg.innerHTML = `<h2>送信の確認</h2>
    <div class="sum">登校 ○ ${c.g}日　／　下校 ○ ${c.b}日</div>
    <div class="lst"><b>登校：</b>${esc(dates('g'))}<br><b>下校：</b>${esc(dates('b'))}</div>
    ${(c.g+c.b)===0 ? '<div class="status warn" style="margin:0 0 8px;">○が1つもありません。「出勤できる日がない」として送ります。</div>' : ''}
    <div class="btns"><button type="button" class="b-ng" id="dNo">戻る</button><button type="button" class="b-ok" id="dYes">送信する</button></div>`;
  ov.classList.add('show');
  document.getElementById('dNo').onclick = () => ov.classList.remove('show');
  document.getElementById('dYes').onclick = doSend;
}

async function doSend(){
  const ov = document.getElementById('ov'), dlg = document.getElementById('dlg');
  if(previewMode){
    dlg.innerHTML = `<h2>見本です</h2><p>管理者用の見本のため、送信はされません。</p><div class="btns"><button type="button" class="b-ok" id="dOk">閉じる</button></div>`;
    document.getElementById('dOk').onclick = () => ov.classList.remove('show');
    return;
  }
  const yes = document.getElementById('dYes'); yes.disabled = true; yes.textContent = '送信中…';
  const days = INFO.days.map(d => ({ d: d.d, go: !!ON[d.d+'|g'], back: !!ON[d.d+'|b'] }));
  const note = document.getElementById('note').value;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/shift_submit`, { method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({ p_token: accessToken, p_days: days, p_note: note }) });
    if(!res.ok){
      const t = await res.text();
      const msg = t.includes('〆切') ? '〆切を過ぎているため送信できませんでした。前に送った内容は残っています。'
                : t.includes('too many') ? 'アクセスが一時的に制限されています。しばらくしてからもう一度お試しください。'
                : '送信できませんでした。通信の状態を確認して、もう一度お試しください。（入力した内容はこの端末に残っています）';
      dlg.innerHTML = `<h2 style="color:var(--danger)">送信できませんでした</h2><p>${esc(msg)}</p><div class="btns"><button type="button" class="b-ok" id="dOk">閉じる</button></div>`;
      document.getElementById('dOk').onclick = () => ov.classList.remove('show');
      return;
    }
    const r = await res.json();
    draftClear();
    ov.classList.remove('show');
    INFO.submitted = true; INFO.last_submitted_at = new Date().toISOString(); INFO._note = note;
    showDone(r.go, r.back);
  }catch(e){
    dlg.innerHTML = `<h2 style="color:var(--danger)">通信エラー</h2><p>送信できませんでした。電波の良いところで、もう一度お試しください。（入力した内容はこの端末に残っています）</p><div class="btns"><button type="button" class="b-ok" id="dOk">閉じる</button></div>`;
    document.getElementById('dOk').onclick = () => ov.classList.remove('show');
  }
}

function showDone(g,b){
  window.scrollTo(0,0);
  root.innerHTML = `<div class="done"><div class="big">✅</div><h2>送信しました</h2>
    <p>${esc(INFO.staff_name)} さん<br>登校 ○ ${g}日　／　下校 ○ ${b}日</p>
    <p>直したいときは、下のボタンを押して直し、もう一度送信してください。<br>〆切（${jpDate(INFO.period.deadline)}）まで、何度でも送り直せます。</p>
    <button type="button" id="bBack">内容を見る・直す</button></div>`;
  document.getElementById('bBack').onclick = () => render();
}

/* ---- 起動 ---- */
function previewInfo(){
  const t = new Date(); let y = t.getFullYear(), m = t.getMonth();
  if(t.getDate() > 20) m++;                       // 次の「21日〜翌20日」
  const s = new Date(y, m, 21), e = new Date(y, m+1, 20), dl = new Date(y, m, 15);
  const f = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const days=[]; for(let d=new Date(s); d<=e; d.setDate(d.getDate()+1)) days.push({ d:f(d), dow:d.getDay(), hol:null });
  return { staff_name:'見本 太郎', period:{id:0,start:f(s),end:f(e),deadline:f(dl),closed:false}, days, answers:[], submitted:false, note:null };
}

(async function start(){
  if(previewMode){
    document.getElementById('pv').style.display='block';
    INFO = previewInfo(); DRAFT_KEY = 'kibou_preview'; CLOSED = false; render(); return;
  }
  if(!accessToken){
    showErr('このページは直接開けません', 'シフト希望の入力は、会社から届いた本人専用リンクからのみ行えます。<br>リンクが見当たらない場合は、事務所へお問い合わせください。');
    return;
  }
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/shift_open`, { method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({ p_token: accessToken }) });
    if(!res.ok){
      const t = await res.text();
      if(t.includes('too many')) showErr('アクセスが一時制限されています', 'しばらく時間をおいてから、もう一度リンクを開いてください。');
      else showErr('リンクが無効です', 'メールに書かれたリンクを、そのまま開いてください。<br>それでも開けないときは、事務所へお問い合わせください。');
      return;
    }
    INFO = await res.json();
    CLOSED = !!INFO.period.closed;
    DRAFT_KEY = 'kibou_' + INFO.period.id + '_' + accessToken.slice(-12);
    for(const a of INFO.answers){ if(a.go) ON[a.d+'|g']=true; if(a.back) ON[a.d+'|b']=true; }
    INFO._note = INFO.note || '';
    if(!CLOSED){                                  // 送信前の途中経過があれば、そちらを優先
      const dr = draftLoad();
      if(dr && dr.on){ ON = dr.on; INFO._note = dr.note || INFO._note; }
    }
    render();
  }catch(e){
    console.error(e);
    showErr('通信エラー', '電波の状態を確認して、もう一度リンクを開いてください。');
  }
})();
</script>
</body>
</html>
