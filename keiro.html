<script>
// ===== 高尾輸送サービス 管理システム 共通認証モジュール =====
// initAuth(['admin', 'staff'])  → 管理者・事務員どちらも可
// initAuth(['admin'])           → 管理者のみ

const AUTH_URL  = 'https://wxdyqkyqtizhtkwtpvru.supabase.co/auth/v1';
const REST_URL  = 'https://wxdyqkyqtizhtkwtpvru.supabase.co/rest/v1';

/* 🔴 権限の案内（2026-08-27 八重樫さん）。正本：業務管理システム_マスタ連動の原則

   > 権限では「指示のもとで編集する」と「自分で判断して編集する」を区別できません。
   > 区別できるのは「書けるか」「記録が残るか」「戻せるか」の3つだけです。（2026-08-27）

   ⚠️ ここは案内だけ。守っているのはデータベース側（RLS と RPC）。
      画面の判定だけに頼らない（画面は書き換えられる）。
   ⚠️ 権限が分からないときは止めない。止めるのはサーバーの役目。
      ここで止めると「通信できないだけ」で仕事が止まる。 */
const PAGE_PERM = { key: 'w_commute', what: '通勤経路' };
let MYPERM = null;
async function permLoad(){
  if (MYPERM) return MYPERM;
  try {
    const r = await fetch(`${REST_URL}/rpc/my_permissions`, { method:'POST', headers:getH(), body:'{}' });
    MYPERM = r.ok ? (await r.json() || []) : [];
  } catch(e){ MYPERM = []; }
  return MYPERM;
}
function permHas(key){
  if (!MYPERM || !MYPERM.length) return true;   // 分からないときは止めない
  const p = MYPERM.find(x => x.key === key);
  return p ? !!p.allowed : true;
}
function permLabel(key){
  const p = (MYPERM||[]).find(x => x.key === key);
  return p ? p.label : key;
}
/** 変更できないときに、画面の上に帯を出す（押す前に分かるように） */
async function permGuard(){
  if (!PAGE_PERM.key) return true;
  await permLoad();
  const keys = Array.isArray(PAGE_PERM.key) ? PAGE_PERM.key : [PAGE_PERM.key];
  if (keys.some(permHas)) return true;
  const names = keys.map(permLabel).join('・');
  const d = document.createElement('div');
  d.style.cssText = 'position:sticky;top:0;z-index:9999;background:#fdf2f2;border-bottom:2px solid #e0a9a2;'
    + 'color:#8c3b30;padding:10px 16px;font-size:13.5px;line-height:1.85;';
  d.innerHTML = '⚠️ <b>' + PAGE_PERM.what + 'を変更する権限がありません。</b>'
    + '見ることはできますが、保存・追加・削除はできません。<br>'
    + '<span style="font-size:12.5px;">必要でしたら、権限をお持ちの方に「' + names + '」を付けてもらってください。</span>';
  document.body.insertBefore(d, document.body.firstChild);
  return false;
}
/** サーバーから返る英語のエラーを、何の権限が足りないかに言い換える */
const _PERM_TBL = {
  course_schedule_calendar:'月間予定', permits:'営業許可', vehicles:'車両台帳',
  vehicle_assignments:'車両の割り当て', commute_routes:'通勤経路', courses:'コース',
  job_types:'業務マスタ', employee_job_types:'業務マスタ', offices:'営業所',

  course_scenarios:'運行時程マスタ'
};
function permMsg(t){
  const s = String(t == null ? '' : t);
  const m = /row-level security policy for table "([a-z_]+)"/.exec(s);
  if (!m) return t;
  const n = _PERM_TBL[m[1]] || m[1];
  return '「' + n + '」を変更する権限がありません。権限をお持ちの方にご相談ください。';
}
window.addEventListener('DOMContentLoaded', function(){ permGuard(); });

const ANON_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4ZHlxa3lxdGl6aHRrd3RwdnJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NzYxODEsImV4cCI6MjA5OTQ1MjE4MX0.yVbClXBk2JVeglevsBLY5sH2_m2ybCf71u4i_YYWyHE';

const ROLE_LABEL = { super_admin: '権限付与者', admin: 'システム管理者', operator: '担当者', staff: '事務員' };

/* ===================== セッション管理 ===================== */

function _saveSession(data) {
  const session = {
    access_token:  data.access_token,
    refresh_token: data.refresh_token,
    expires_at:    data.expires_at || (Math.floor(Date.now() / 1000) + (data.expires_in || 3600)),
    user_id:       data.user?.id || data.user_id,
    email:         data.user?.email || data.email,
  };
  sessionStorage.setItem('takao_session', JSON.stringify(session));
  return session;
}

function _getSession() {
  try { return JSON.parse(sessionStorage.getItem('takao_session')); }
  catch { return null; }
}

function _clearSession() {
  sessionStorage.removeItem('takao_session');
  sessionStorage.removeItem('takao_role');
  sessionStorage.removeItem('takao_name');
  sessionStorage.removeItem('takao_permissions');
  sessionStorage.removeItem('takao_mfa_enforced');
}

// refresh_token でアクセストークンを更新する（成功=true）。長時間開いても保存が切れないように使う
async function refreshSession() {
  const s = _getSession();
  if (!s || !s.refresh_token) return false;
  try {
    const res = await fetch(`${AUTH_URL}/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    });
    if (!res.ok) return false;
    const data = await res.json();
    if (!data || !data.access_token) return false;
    _saveSession(data);
    return true;
  } catch { return false; }
}
// 期限が近い/切れていれば先に更新
async function ensureFreshToken() {
  const s = _getSession();
  if (s && s.expires_at && (s.expires_at - 60) < Math.floor(Date.now() / 1000)) {
    await refreshSession();
  }
}

function getPermissions() {
  try { return JSON.parse(sessionStorage.getItem('takao_permissions')) || {}; }
  catch { return {}; }
}

function isMfaEnforced() {
  return sessionStorage.getItem('takao_mfa_enforced') === 'true';
}

function _isExpired(session) {
  if (!session?.expires_at) return true;
  return Math.floor(Date.now() / 1000) > session.expires_at - 60;
}

function _authHeaders(token) {
  return {
    'Content-Type': 'application/json',
    'apikey': ANON_KEY,
    'Authorization': `Bearer ${token || ANON_KEY}`
  };
}

/* ===================== Supabase Auth API ===================== */

async function _refresh(session) {
  try {
    const res = await fetch(`${AUTH_URL}/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    if (!res.ok) return null;
    return _saveSession(await res.json());
  } catch { return null; }
}

async function _getRole(accessToken) {
  const cached = sessionStorage.getItem('takao_role');
  if (cached) return cached;
  try {
    const res = await fetch(`${REST_URL}/user_roles?select=role,display_name,permissions,mfa_enforced`, {
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${accessToken}` },
    });
    if (!res.ok) return null;
    const data = await res.json();
    const row = data[0];
    if (!row) return null;
    sessionStorage.setItem('takao_role', row.role);
    if (row.display_name) sessionStorage.setItem('takao_name', row.display_name);
    if (row.permissions) sessionStorage.setItem('takao_permissions', JSON.stringify(row.permissions));
    if (row.mfa_enforced != null) sessionStorage.setItem('takao_mfa_enforced', String(row.mfa_enforced));
    return row.role;
  } catch { return null; }
}

/* ===================== 公開 API ===================== */

/**
 * ログアウト
 */
async function signOut() {
  const session = _getSession();
  if (session?.access_token) {
    fetch(`${AUTH_URL}/logout`, {
      method: 'POST',
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${session.access_token}` },
    }).catch(() => {});
  }
  _clearSession();
  window.location.href = 'login.html';
}

/**
 * パスワード変更（ログイン中のユーザー自身）
 */
async function changePassword(newPassword) {
  const session = _getSession();
  if (!session?.access_token) return { ok: false, error: 'セッションが無効です' };
  try {
    const res = await fetch(`${AUTH_URL}/user`, {
      method: 'PUT',
      headers: _authHeaders(session.access_token),
      body: JSON.stringify({ password: newPassword })
    });
    if (res.ok) return { ok: true };
    const d = await res.json();
    return { ok: false, error: d.msg || d.message || 'パスワード変更に失敗しました' };
  } catch (e) {
    return { ok: false, error: 'ネットワークエラー: ' + e.message };
  }
}

/**
 * TOTP登録開始（QRコードURIを返す）
 */
async function enrollTotp() {
  let session = _getSession();
  if (!session?.access_token) return { ok: false, error: 'セッションが無効です' };

  // セッションの有効期限が近い場合はリフレッシュ
  if (_isExpired(session)) {
    session = await _refresh(session);
    if (!session) return { ok: false, error: 'セッションの更新に失敗しました。再ログインしてください。' };
  }

  try {
    // 未確認（unverified）のTOTPファクターのみ削除（確認済みのものは絶対に削除しない）
    const listRes = await fetch(`${AUTH_URL}/factors`, {
      headers: _authHeaders(session.access_token)
    });
    if (listRes.ok) {
      const factors = await listRes.json();
      if (Array.isArray(factors)) {
        // 確認済みファクターが既にある場合はエラーを返す
        const verified = factors.find(f => f.factor_type === 'totp' && f.status === 'verified');
        if (verified) {
          return { ok: false, error: '二段階認証はすでに設定済みです。一度「解除する」してから再設定してください。' };
        }
        // 未確認ファクターのみ削除
        for (const f of factors) {
          if (f.factor_type === 'totp' && f.status === 'unverified') {
            await fetch(`${AUTH_URL}/factors/${f.id}`, {
              method: 'DELETE',
              headers: _authHeaders(session.access_token)
            });
          }
        }
      }
    }

    const res = await fetch(`${AUTH_URL}/factors`, {
      method: 'POST',
      headers: _authHeaders(session.access_token),
      body: JSON.stringify({ factor_type: 'totp', friendly_name: '高尾輸送サービス', issuer: '高尾輸送サービス' })
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      const msg = errData.msg || errData.message || errData.error_description || errData.code || `エラー(${res.status})`;
      return { ok: false, error: 'QRコードの生成に失敗しました: ' + msg };
    }
    const d = await res.json();
    return { ok: true, factorId: d.id, totpUri: d.totp?.uri, secret: d.totp?.secret };
  } catch (e) {
    return { ok: false, error: 'ネットワークエラー: ' + e.message };
  }
}

/**
 * TOTP登録確認（初回コード検証）
 */
async function verifyTotpEnrollment(factorId, code) {
  const session = _getSession();
  if (!session?.access_token) return { ok: false, error: 'セッションが無効です' };
  try {
    const chRes = await fetch(`${AUTH_URL}/factors/${factorId}/challenge`, {
      method: 'POST', headers: _authHeaders(session.access_token), body: JSON.stringify({})
    });
    if (!chRes.ok) return { ok: false, error: 'チャレンジ作成に失敗しました' };
    const { id: challengeId } = await chRes.json();

    const vRes = await fetch(`${AUTH_URL}/factors/${factorId}/verify`, {
      method: 'POST',
      headers: _authHeaders(session.access_token),
      body: JSON.stringify({ challenge_id: challengeId, code })
    });
    if (!vRes.ok) return { ok: false, error: 'コードが正しくありません。もう一度お試しください。' };
    _saveSession(await vRes.json());
    return { ok: true };
  } catch (e) {
    return { ok: false, error: 'ネットワークエラー: ' + e.message };
  }
}

/**
 * 登録済みTOTPファクター一覧
 */
async function getEnrolledFactors() {
  const session = _getSession();
  if (!session?.access_token) return [];
  try {
    const res = await fetch(`${AUTH_URL}/factors`, {
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${session.access_token}` }
    });
    if (!res.ok) return [];
    const factors = await res.json();
    return Array.isArray(factors) ? factors.filter(f => f.factor_type === 'totp' && f.status === 'verified') : [];
  } catch { return []; }
}

/**
 * TOTP解除
 */
async function unenrollTotp(factorId) {
  const session = _getSession();
  if (!session?.access_token) return { ok: false };
  try {
    const res = await fetch(`${AUTH_URL}/factors/${factorId}`, {
      method: 'DELETE',
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${session.access_token}` }
    });
    return { ok: res.ok };
  } catch { return { ok: false }; }
}

/**
 * 認証チェック（各ページのDOMContentLoaded前に呼ぶ）
 */
async function initAuth(allowedRoles) {
  document.documentElement.style.visibility = 'hidden';
  try {
    let session = _getSession();
    if (!session) { _redirectLogin(); return false; }
    if (_isExpired(session)) {
      session = await _refresh(session);
      if (!session) { _clearSession(); _redirectLogin(); return false; }
    }
    const role = await _getRole(session.access_token);
    if (!role || !allowedRoles.includes(role)) {
      _showDenied(role);
      document.documentElement.style.visibility = 'visible';
      return false;
    }
    _injectUserInfo(session.email, role);
    _injectModals();
    document.documentElement.style.visibility = 'visible';
    return true;
  } catch (err) {
    console.error('[auth.js] initAuth error:', err);
    document.documentElement.style.visibility = 'visible';
    return false;
  }
}

/* ===================== 内部ヘルパー ===================== */

  document.documentElement.style.visibility = 'visible';

}

          <button onclick="signOut()" style="background:#eef7f1;color:#4d7a5e;border:1px solid #b4d4c0;

function _injectUserInfo(email, role) {
  const header = document.querySelector('header');
  if (!header) return;

  const name = sessionStorage.getItem('takao_name') || email;
  const label = (function(){var p={};try{p=JSON.parse(sessionStorage.getItem('takao_permissions')||'{}')}catch(e){}if(p.title)return p.title;if(role==='super_admin')return '権限付与者';if(role==='admin')return 'システム管理者';if(role==='staff')return '事務員';if(role==='operator'){if(p.staff_edit&&p.export)return '情報取扱責任者';if(p.staff_edit)return '情報取扱者';return '操作担当者';}return role;})();
  const badgeColor = role === 'super_admin' ? '#c0392b'
    : role === 'admin'    ? '#9b7eb8'

/* ===================== パスワード変更 ===================== */

function showPasswordChangeModal() {
  _injectModals();
  document.getElementById('_tm_pw_new').value = '';
  document.getElementById('_tm_pw_conf').value = '';
  document.getElementById('_tm_pw_err').style.display = 'none';
  document.getElementById('_tm_pw_ok').style.display = 'none';
  document.getElementById('_tm_pw').classList.add('open');
  setTimeout(() => document.getElementById('_tm_pw_new').focus(), 100);
}

function closePasswordChangeModal() {
  document.getElementById('_tm_pw').classList.remove('open');
}

async function _doChangePassword() {
  const np   = document.getElementById('_tm_pw_new').value;
  const conf = document.getElementById('_tm_pw_conf').value;
  const err  = document.getElementById('_tm_pw_err');
  const ok   = document.getElementById('_tm_pw_ok');
  const btn  = document.getElementById('_tm_pw_btn');
  err.style.display = 'none';
  ok.style.display = 'none';
  if (np.length < 8) { err.textContent = 'パスワードは8文字以上で設定してください'; err.style.display = 'block'; return; }
  if (np !== conf)   { err.textContent = 'パスワードが一致しません'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = '変更中…';
  const result = await changePassword(np);
  btn.disabled = false; btn.textContent = '変更する';
  if (result.ok) {
    ok.style.display = 'block';
    document.getElementById('_tm_pw_new').value = '';
    document.getElementById('_tm_pw_conf').value = '';
    setTimeout(() => closePasswordChangeModal(), 2000);
  } else {
    err.textContent = result.error; err.style.display = 'block';
  }
}

/* ===================== 二段階認証設定 ===================== */

let _totpFactorId = null;

async function showTotpSetupModal() {
  _injectModals();
  _showTotpStep0();
  document.getElementById('_tm_totp_err').style.display = 'none';
  document.getElementById('_tm_totp_ok').style.display = 'none';
  document.getElementById('_tm_totp').classList.add('open');

  const status = document.getElementById('_tm_totp_status');
  const startBtn  = document.getElementById('_tm_totp_start_btn');
  const disableBtn = document.getElementById('_tm_totp_disable_btn');
  status.textContent = '状態を確認中...';
  startBtn.style.display = 'none';
  disableBtn.style.display = 'none';

  const factors = await getEnrolledFactors();
  const role = sessionStorage.getItem('takao_role');
  const canDisable = !isMfaEnforced() || role === 'super_admin';
  if (factors.length > 0) {
    _totpFactorId = factors[0].id;
    if (canDisable) {
      status.textContent = '✅ 二段階認証は有効です。認証アプリが設定されています。';
      disableBtn.style.display = 'block';
    } else {
      status.textContent = '✅ 二段階認証は有効です（組織の設定により解除できません）。';
      disableBtn.style.display = 'none';
      const lockNote = document.getElementById('_tm_totp_lock_note');
      if (lockNote) lockNote.style.display = 'block';
    }
  } else {
    status.textContent = '二段階認証は現在無効です。設定するとログイン時にアプリのコード入力が必要になります。';
    startBtn.style.display = 'block';
  }
}

function closeTotpSetupModal() {
  document.getElementById('_tm_totp').classList.remove('open');
}

function _showTotpStep0() {
  ['_tm_totp_s0','_tm_totp_s1','_tm_totp_s2'].forEach((id, i) => {
    document.getElementById(id).classList.toggle('active', i === 0);
  });
}
function _showTotpStep1() {
  ['_tm_totp_s0','_tm_totp_s1','_tm_totp_s2'].forEach((id, i) => {
    document.getElementById(id).classList.toggle('active', i === 1);
  });
}
function _showTotpStep2() {
  document.getElementById('_tm_totp_code').value = '';
  ['_tm_totp_s0','_tm_totp_s1','_tm_totp_s2'].forEach((id, i) => {
    document.getElementById(id).classList.toggle('active', i === 2);
  });
  setTimeout(() => document.getElementById('_tm_totp_code').focus(), 100);
}

async function _startTotpSetup() {
  const startBtn = document.getElementById('_tm_totp_start_btn');
  const err = document.getElementById('_tm_totp_err');
  err.style.display = 'none';
  startBtn.disabled = true; startBtn.textContent = 'QRコード生成中…';

  const result = await enrollTotp();
  startBtn.disabled = false; startBtn.textContent = 'QRコードを表示して設定開始';
  if (!result.ok) { err.textContent = result.error; err.style.display = 'block'; return; }

  _totpFactorId = result.factorId;
  document.getElementById('_tm_totp_secret').textContent = result.secret || '';

  // QRコード描画
  const canvas = document.getElementById('_tm_qr_canvas');
  canvas.innerHTML = '';
  _loadQRLib(() => {
    new QRCode(canvas, { text: result.totpUri, width: 200, height: 200,
      colorDark: '#2d4a36', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  });

  _showTotpStep1();
}

async function _verifyTotpSetup() {
  const code = document.getElementById('_tm_totp_code').value.replace(/\D/g, '');
  const err  = document.getElementById('_tm_totp_err');
  const ok   = document.getElementById('_tm_totp_ok');
  const btn  = document.getElementById('_tm_totp_verify_btn');
  err.style.display = 'none';
  if (code.length !== 6) { err.textContent = '6桁のコードを入力してください'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = '確認中…';
  const result = await verifyTotpEnrollment(_totpFactorId, code);
  btn.disabled = false; btn.textContent = '設定を完了する';
  if (result.ok) {
    ok.textContent = '✅ 二段階認証の設定が完了しました！次回ログインからコード入力が必要になります。';
    ok.style.display = 'block';
    _showTotpStep0();
    document.getElementById('_tm_totp_status').textContent = '✅ 二段階認証は有効です。認証アプリが設定されています。';
    document.getElementById('_tm_totp_start_btn').style.display = 'none';
    document.getElementById('_tm_totp_disable_btn').style.display = 'block';
  } else {
    err.textContent = result.error; err.style.display = 'block';
  }
}

async function _disableTotp() {
  const role = sessionStorage.getItem('takao_role');
  if (isMfaEnforced() && role !== 'super_admin') {
    alert('組織のポリシーにより二段階認証は解除できません。');
    return;
  }
  if (!confirm('二段階認証を解除しますか？\nログイン時のコード入力が不要になります。')) return;
  const result = await unenrollTotp(_totpFactorId);
  const err = document.getElementById('_tm_totp_err');
  const ok  = document.getElementById('_tm_totp_ok');
  if (result.ok) {
    ok.textContent = '二段階認証を解除しました。';
    ok.style.display = 'block';
    document.getElementById('_tm_totp_status').textContent = '二段階認証は現在無効です。';
    document.getElementById('_tm_totp_start_btn').style.display = 'block';
    document.getElementById('_tm_totp_disable_btn').style.display = 'none';
  } else {
    err.textContent = '解除に失敗しました。'; err.style.display = 'block';
  }
}

function _loadQRLib(cb) {
  if (window.QRCode) { cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload = cb;
  document.head.appendChild(s);
}

<script>
/* ===== 通勤経路マスタ ページロジック ===== */
const MODES = ['電車','バス','タクシー','徒歩','自転車','自家用車'];
const LEGS = ['登校','下校'];
const DIRS = ['出勤','帰宅'];
let STAFF = [];
let COURSES = [];
let model = { staffId: null, courses: [] };
let COURSE_LOCS = {};   // course_id(String) → [{id,name,address}]
let STAFF_ADDR = {};    // staff_id(String) → 住所（権限スコープに応じた値）

// 全角→半角（数字・各種ハイフン・空白）
function toHalf(s){
  return String(s==null?'':s)
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[‐‑‒–—―ー－]/g, '-')
    .replace(/　/g, ' ');
}
// 住所を「住居表示まで」に丸める（建物名・号室を落とす）。取れなければ元の住所を返す
function jushoHyoji(addr){
  let s = toHalf(addr).trim();
  if (!s) return '';
  s = s.split(' ')[0].trim();                    // 建物名がスペース区切りなら除去
  const m = s.match(/^[^\d]*[\d\-丁目番地号]+/);   // 都道府県〜番地の数字ブロックまで
  return (m ? m[0] : s).trim();
}

function getH(){
  const s = _getSession();
  const tok = (s && s.access_token) || ANON_KEY;
  return { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };
}

function status(msg, ok){ msg = permMsg(msg);
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = ok ? 'ok' : 'err';
  if (ok) setTimeout(() => { if (el.textContent === msg) el.className = ''; }, 4000);
}

function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function emptySlot(){ return { '場所':'', '手段':'', '区間':[], '交通費':0, '移動時間':'' }; }
function emptyRoutes(){ const r={}; LEGS.forEach(l=>{ r[l]={}; DIRS.forEach(d=>{ r[l][d]=emptySlot(); }); }); return r; }
function normRoutes(routes){
  const r = emptyRoutes();
  if (routes && typeof routes === 'object'){
    LEGS.forEach(l => DIRS.forEach(d => {
      const s = routes[l] && routes[l][d];
      if (s){
        r[l][d]['場所'] = s['場所'] || '';
        /* ⚠️ ここに書き足さないと、読み直しのたびに黙って消える（2026-09-01） */
        if (s['場所id'] != null && s['場所id'] !== '') r[l][d]['場所id'] = Number(s['場所id']);
        if (s['バス停id'] != null && s['バス停id'] !== '') r[l][d]['バス停id'] = Number(s['バス停id']);
        r[l][d]['手段'] = s['手段'] || '';
        r[l][d]['交通費'] = Number(s['交通費']) || 0;
        r[l][d]['移動時間'] = s['移動時間'] || '';
        r[l][d]['区間'] = Array.isArray(s['区間']) ? s['区間'].map(x => ({
          '手段': x['手段'] || '電車', '乗車': x['乗車'] || '', '下車': x['下車'] || '', '運賃': Number(x['運賃']) || 0
        })) : [];
      }
    }));
  }
  return r;
}

/* 🔴 読めなかったときに「空の一覧」を出さない（2026-09-01 八重樫さん）
   「不具合が生じた際に一覧ごとなくなるというのは困る」

   ⚠️ 空の一覧は「誰も居ません」と見分けが付かない。気づけないまま作業が進む。
   ① まず staff_now（退職日まで見た判断）
   ② 駄目なら staff（在籍の印だけ）に落として、画面に断りを出す ← 一覧ごとは消さない
   ③ どちらも駄目なら例外。呼び元が「読み取れませんでした」と出す（空では出さない） */
let STAFF_FALLBACK = false;

async function fetchStaffRows(){
  const sel = 'select=id,name,employee_code,name_kana';
  const ord = 'order=name_kana.asc.nullslast,name.asc';
  let r = await fetch(`${REST_URL}/staff_now?${sel}&is_active_now=eq.true&${ord}`, { headers: getH() });
  if (r.ok){ STAFF_FALLBACK = false; return await r.json(); }
  const first = r.status;
  r = await fetch(`${REST_URL}/staff?${sel}&active=eq.true&${ord}`, { headers: getH() });
  if (r.ok){ STAFF_FALLBACK = true; return await r.json(); }
  throw new Error('従業員の一覧を読み取れませんでした（' + first + ' / ' + r.status + '）');
}

async function loadStaff(){
  /* 🔴 五十音順・在籍者だけ（2026-09-01 八重樫さん）
     ⚠️ 漢字の順は五十音順にならない。ふりがな（半角カナ）で並べる。
     ⚠️ ふりがなが無い人は最後に回し、消さない。 */
  const sel = document.getElementById('staffSelect');
  let rows;
  try {
    rows = await fetchStaffRows();
  } catch (e) {
    /* ⚠️ ここで空の一覧を出さない。選ぶ欄そのものに理由を出す */
    sel.innerHTML = '<option value="">⚠️ 一覧を読み取れませんでした</option>';
    sel.disabled = true;
    status('⚠️ 従業員の一覧を読み取れませんでした。画面を開き直してください。'
         + 'それでも直らないときは八重樫さんにお知らせください。（' + e.message + '）', false);
    throw e;
  }
  sel.disabled = false;
  STAFF = rows;
  if (!STAFF.length){
    /* ⚠️ 本当に0名ということは実務上ありえない。読めていない可能性を疑う */
    sel.innerHTML = '<option value="">⚠️ 従業員が1人も出てきません</option>';
    status('⚠️ 従業員が1人も出てきません。読み取りに失敗しているかもしれません。'
         + '画面を開き直してください。', false);
    return;
  }
  sel.innerHTML = '<option value="">— 選択してください —</option>';
  let gyo = null, box = null;
  STAFF.forEach(s => {
    const g = kanaGyo(s.name_kana);
    if (g !== gyo){ gyo = g; box = document.createElement('optgroup'); box.label = g; sel.appendChild(box); }
    const o = document.createElement('option');
    o.value = s.id;
    o.textContent = s.name + (s.employee_code ? ` (${s.employee_code})` : '');
    box.appendChild(o);
  });
  if (STAFF_FALLBACK){
    status('⚠️ 退職日まで見た判断で読めなかったため、在籍の印だけで出しています。'
         + '退職日が過ぎている方が混ざっている可能性があります。八重樫さんにお知らせください。', false);
  }
}

/** ふりがなの1文字目から「あ行」などを返す。⚠️ 半角カナ。 */
function kanaGyo(kana){
  const c = (kana || '').trim().charAt(0);
  if (!c) return 'ふりがな未登録';
  const GYO = [
    ['あ行','ｱｲｳｴｵｧｨｩｪｫ'], ['か行','ｶｷｸｹｺ'], ['さ行','ｻｼｽｾｿ'], ['た行','ﾀﾁﾂﾃﾄｯ'],
    ['な行','ﾅﾆﾇﾈﾉ'],       ['は行','ﾊﾋﾌﾍﾎ'], ['ま行','ﾏﾐﾑﾒﾓ'], ['や行','ﾔﾕﾖｬｭｮ'],
    ['ら行','ﾗﾘﾙﾚﾛ'],       ['わ行','ﾜｦﾝ']
  ];
  for (const [name, chars] of GYO) if (chars.indexOf(c) >= 0) return name;
  return 'その他';
}

/* 🔴 到着地・出発地の選択肢を「場面ごと」に絞る（2026-09-02 八重樫さん）

   > ①学校への通勤の可能性は登校業務前、登校業務後、下校業務前、下校業務後の全てでありえます。
   > ②登校便第１ポイントがリストに出るのは登校便業務前、
   > 　下校の最終ポイントがリストに出るのは下校便業務後にしてほしいです。
   > 場合によっては第１ポイントや最終ポイントから数十メートル動いてから
   > 添乗員が乗降することもありますのでその時は添乗員送迎に加えますが、
   > それ以外でしたら新たに入力する手間をなくしたいです。

   ⚠️ 途中のバス停は出さない。添乗員が乗り降りしうる所だけを出す。
   ⚠️ ③添乗員送迎の地点も、場面（登校前・登校後・下校前・下校後）で絞る。
   ⚠️ 学校は「登校の最後のバス停＝下校の最初のバス停」で見分ける（64コース全部で一致・確認済み）。 */
let COURSE_KEYPT = {};   // course_id(String) -> {first,last,school}  それぞれ course_locations の行

/** バス停は「いま効いている版」のものだけ読む。
    ⚠️ 以前は版を問わず全部読んでいて、古い版のバス停も選べてしまっていた（2026-09-02 判明）。 */
async function loadCourseLocations(){
  const keep = COURSE_LOCS, keepK = COURSE_KEYPT;
  try{
    const rv = await fetch(`${REST_URL}/course_timetable_versions?select=id,course_id,valid_from&order=valid_from.desc,id.desc`, { headers: getH() });
    if(!rv.ok) return;
    const today = todayISO();
    const cur = {};                                   // course_id -> version_id（今日効いている版）
    (await rv.json() || []).forEach(v => {
      const k = String(v.course_id);
      if(cur[k] != null) return;                      // 並びが新しい順なので最初に来たものが最新
      if(String(v.valid_from) <= today) cur[k] = v.id;
    });
    // 先の日付の版しかないコースは、いちばん古い版を使う（版が1つも無い状態を作らない）
    const rv2 = await fetch(`${REST_URL}/course_timetable_versions?select=id,course_id,valid_from&order=valid_from.asc,id.asc`, { headers: getH() });
    if(rv2.ok){
      (await rv2.json() || []).forEach(v => {
        const k = String(v.course_id);
        if(cur[k] == null) cur[k] = v.id;
      });
    }
    const ids = Object.keys(cur).map(k => cur[k]);
    if(!ids.length){ COURSE_LOCS = {}; COURSE_KEYPT = {}; return; }
    const rl = await fetch(`${REST_URL}/course_locations?version_id=in.(${ids.join(',')})`
      + `&select=id,course_id,version_id,name,address,gekou_only,toukou_time,seq,gekou_seq&order=name`, { headers: getH() });
    if(!rl.ok) return;
    const buf = {}, kbuf = {};
    (await rl.json() || []).forEach(r => {
      const k = String(r.course_id);
      (buf[k] = buf[k] || []).push({ id:r.id, name:r.name, address:r.address||'',
        gekou_only:!!r.gekou_only, toukou_time:r.toukou_time||'',
        seq:(r.seq==null?null:r.seq), gekou_seq:(r.gekou_seq==null?null:r.gekou_seq) });
    });
    Object.keys(buf).forEach(k => {
      const a = buf[k];
      const tk = a.filter(x => x.seq != null).sort((p,q)=>p.seq-q.seq);
      const gk = a.filter(x => x.gekou_seq != null).sort((p,q)=>p.gekou_seq-q.gekou_seq);
      kbuf[k] = {
        first : tk.length ? tk[0] : null,                       // 登校の第1ポイント
        school: tk.length ? tk[tk.length-1] : null,             // 学校（登校の最後＝下校の最初）
        last  : gk.length ? gk[gk.length-1] : null              // 下校の最終ポイント
      };
    });
    COURSE_LOCS = buf; COURSE_KEYPT = kbuf;
  }catch(e){ COURSE_LOCS = keep; COURSE_KEYPT = keepK; }   // 読めないときは前の内容を保つ
}
function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/** 場面（leg・dir）を、③添乗員送迎の「局面」に直す */
function phaseOf(leg, dir){
  return (leg === '登校') ? (dir === '出勤' ? '登校前' : '登校後')
                          : (dir === '出勤' ? '下校前' : '下校後');
}

/** 到着地・出発地の選択肢。場面ごとに出すものを変える */
function arriveOpts(courseId, cur, leg, dir){
  const k  = String(courseId);
  const ph = phaseOf(leg, dir);
  const kp = COURSE_KEYPT[k] || {};
  const gr = COURSE_GARAGE[k];
  const ps = (COURSE_PLACES[k] || []).filter(p => (p.uses||[]).some(u => u.phase === ph));
  let h = '<option value="">選んでください…</option>';

  if(gr){
    h += '<optgroup label="🏢 このコースの車庫">';
    h += `<option value="p:${gr.id}"${cur==='p:'+gr.id?' selected':''}>${escHtml(gr.name)}</option>`;
    h += '</optgroup>';
  }
  /* 登校便の第1ポイントは「登校業務前」だけ、下校の最終ポイントは「下校業務後」だけ */
  const pt = (ph === '登校前') ? kp.first : (ph === '下校後') ? kp.last : null;
  if(pt){
    h += `<optgroup label="🚏 ${ph==='登校前'?'登校便の第1ポイント':'下校便の最終ポイント'}">`;
    h += `<option value="l:${pt.id}"${cur==='l:'+pt.id?' selected':''}>${escHtml(pt.name)}`
       + `${pt.toukou_time?` ${escHtml(pt.toukou_time)}`:''}</option>`;
    h += '</optgroup>';
  }
  /* 学校は4つの場面すべてに出す */
  if(kp.school && (!pt || kp.school.id !== pt.id)){
    h += '<optgroup label="🏫 学校">';
    h += `<option value="l:${kp.school.id}"${cur==='l:'+kp.school.id?' selected':''}>${escHtml(kp.school.name)}</option>`;
    h += '</optgroup>';
  }
  if(ps.length){
    h += `<optgroup label="📍 ③添乗員送迎の場所（${escHtml(ph)}）">`;
    h += ps.map(p => {
      const u = (p.uses||[]).filter(x => x.phase === ph).map(x => x.kind);
      return `<option value="p:${p.id}"${cur==='p:'+p.id?' selected':''}>`
        + `${escHtml(p.name)}${u.length?`（${escHtml(u.join('・'))}）`:''}</option>`;
    }).join('');
    h += '</optgroup>';
  }
  return h;
}

/** いま選ばれているものを、選択肢の値に直す */
function arriveCur(c, leg, dir){
  const s = (c.routes && c.routes[leg] && c.routes[leg][dir]) || {};
  if(s['場所id'] != null && PLACES[String(s['場所id'])]) return 'p:' + s['場所id'];
  const ls = COURSE_LOCS[String(c.course_id)] || [];
  if(s['バス停id'] != null && ls.some(l => String(l.id) === String(s['バス停id']))) return 'l:' + s['バス停id'];
  const nm = (s['場所']||'').trim();
  if(!nm) return '';
  const ph = phaseOf(leg, dir);
  const ps = (COURSE_PLACES[String(c.course_id)] || []).filter(p => (p.uses||[]).some(u => u.phase === ph));
  const hitP = ps.find(p => p.name === nm);
  if(hitP) return 'p:' + hitP.id;
  const gr = COURSE_GARAGE[String(c.course_id)];
  if(gr && gr.name === nm) return 'p:' + gr.id;
  const kp = COURSE_KEYPT[String(c.course_id)] || {};
  const cand = [ (ph==='登校前'?kp.first:null), (ph==='下校後'?kp.last:null), kp.school ].filter(Boolean);
  const hitL = cand.find(l => l.name === nm);
  if(hitL) return 'l:' + hitL.id;
  return '';                                    // どこにも無い＝付け替えが要る
}

/** 到着地を選んだとき。⚠️ 場所は番号で持つ */
function pickArrive(ci, val){
  const c = model.courses[ci]; const {leg, dir} = c._slot;
  const s = c.routes[leg][dir];
  const e = ends(c, leg, dir);
  if(!val){ s['場所'] = ''; delete s['場所id']; delete s['バス停id']; render(); return; }
  const kind = String(val).slice(0,1), id = String(val).slice(2);
  if(kind === 'p'){
    const p = PLACES[String(id)]; if(!p) return;
    s['場所']   = p.name;
    s['場所id'] = Number(id);                   // ← 改名しても外れない
    delete s['バス停id'];
    e.course.seg[e.course.key] = p.address || p.name;
  }else{
    const list = COURSE_LOCS[String(c.course_id)] || [];
    const l = list.find(x => String(x.id) === String(id)); if(!l) return;
    s['場所'] = l.name;
    s['バス停id'] = Number(id);                 /* ⚠️ バス停の番号は差分更新にしたので変わらなくなった（2026-09-02） */
    delete s['場所id'];
    e.course.seg[e.course.key] = l.address || l.name;
  }
  render();
}

// 経路の両端（自宅側・コース側）の参照。区間が無ければ1本作る
function ends(c, leg, dir){
  const s = c.routes[leg][dir];
  if (!s['区間'].length) s['区間'].push({ '手段':'電車', '乗車':'', '下車':'', '運賃':0 });
  const segs = s['区間'];
  const first = segs[0], last = segs[segs.length - 1];
  return (dir === '出勤')
    ? { home:{seg:first, key:'乗車'}, course:{seg:last, key:'下車'} }
    : { home:{seg:last,  key:'下車'}, course:{seg:first, key:'乗車'} };
}
function fillHome(ci){
  const c = model.courses[ci]; const {leg, dir} = c._slot;
  if (!model.homeAddr){ status('この添乗員の住所が取得できませんでした（従業員マスタで住所を登録してください）', false); return; }
  const e = ends(c, leg, dir);
  e.home.seg[e.home.key] = model.homeAddr;
  render();
}

/* 🔴 到着地に「添乗員送迎の場所」を出す（2026-09-01 八重樫さん）
   正本：業務管理システム_添乗員の出勤指示時刻と版管理

   いままではバス停しか選べなかった。⚠️ 添乗員が実際に乗るのは
   　車庫／途中のピックアップ地点／学校 の3通りで、人ごとに違う（過去のデータで確認済み）。

   ⚠️ 選んだ場所は**番号**で持つ（`場所id`）。名前だけだと改名で黙って外れる
   　　（2026-08-21 vehicles.office_name で実際に踏んだ）。
   ⚠️ 場所の番号は保存で変わらない（places は版を持たず、入れ直しもされない）。
   ⚠️ バス停の番号はいまも保存のたびに変わるので、バス停は名前のまま持つ。
   　　（差分更新を入れたら、そちらも番号に切り替える）

   ⚠️ 学校は63/64コースでバス停として登録されているので、別枠にはしない。 */
let PLACES = {};        // place_id -> {id,name,address,coord}
let COURSE_PLACES = {}; // course_id(String) -> [{id,name,address,coord,uses}]

async function loadPlaces(){
  PLACES = {}; COURSE_PLACES = {};
  try{
    const [rp, rt] = await Promise.all([
      fetch(`${REST_URL}/places?select=id,name,address,coord&active=eq.true&order=name`, { headers: getH() }),
      fetch(`${REST_URL}/course_transfer_points?select=course_id,place_id,phase,kind`, { headers: getH() })
    ]);
    if(!rp.ok || !rt.ok) return;                 // 読めないときは前の内容を保つ
    const places = await rp.json() || [];
    const uses   = await rt.json() || [];
    const buf = {}, cbuf = {};
    places.forEach(p => { buf[String(p.id)] = p; });
    uses.forEach(u => {
      if(u.place_id == null) return;
      const p = buf[String(u.place_id)]; if(!p) return;
      const k = String(u.course_id);
      cbuf[k] = cbuf[k] || {};
      const e = cbuf[k][String(p.id)] = cbuf[k][String(p.id)] || { ...p, uses: [] };
      /* 🔴 場面（局面）と種別を分けて持つ（2026-09-02）。
         ⚠️ 以前は '登校前 乗車' という1本の文字にしていたので、場面で絞れなかった。 */
      const ph = u.phase || '', kd = u.kind || '乗車';
      if(!e.uses.some(x => x.phase === ph && x.kind === kd)) e.uses.push({ phase: ph, kind: kd });
    });
    PLACES = buf;
    COURSE_PLACES = {};
    Object.keys(cbuf).forEach(k => {
      COURSE_PLACES[k] = Object.values(cbuf[k]).sort((a,b)=>a.name.localeCompare(b.name,'ja'));
    });
  }catch(e){ /* 読めないときは前の内容を保つ */ }
}

/** 到着地の選択肢。①添乗員送迎の場所 ②バス停（学校を含む） */
/* 🔴 到着地に「このコースの車庫」を出す（2026-09-02 八重樫さん）
   > 全部どの経路もリストに入るのではなく、運行する車両の車庫だけが
   > リストに出ることがミスをなくす方法だと思います

   ⚠️ 車庫は**そのコースを走る車両の車庫を1つだけ**出す。全営業所を並べない。
   ⚠️ 車庫は場所の一覧（places）にも入れてある。運行時程マスタの送迎の乗車地点も
      同じ「場所」で持っているので、別の持ち方にすると
      「到着地」と「乗車地点」が同じ場所か突き合わせられない。
   ⚠️ 車両の車庫は `vehicles.office_name`（名前）で持っている。改名すると外れるので、
      選んだあとは番号（場所id）で持つ。
   ⚠️ courses.vehicle_id から vehicles への外部キーが無いので、
      埋め込み（vehicles(office_name)）では取れない。別々に読んで突き合わせる。 */
let COURSE_GARAGE = {};   // course_id(String) -> {id,name,address,coord}
async function loadCourseGarages(){
  try{
    const [rc, rv] = await Promise.all([
      fetch(`${REST_URL}/courses?select=id,vehicle_id&active=eq.true`, { headers: getH() }),
      fetch(`${REST_URL}/vehicles?select=id,office_name`, { headers: getH() })
    ]);
    if(!rc.ok || !rv.ok) return;                   // 読めないときは前の内容を保つ
    const gar = {};
    (await rv.json() || []).forEach(v => { gar[String(v.id)] = (v.office_name||'').trim(); });
    const byName = {};
    Object.keys(PLACES).forEach(k => { byName[PLACES[k].name] = PLACES[k]; });
    const buf = {};
    (await rc.json() || []).forEach(c => {
      if(c.vehicle_id == null) return;
      const nm = gar[String(c.vehicle_id)];
      if(!nm) return;
      const p = byName[nm];
      if(p) buf[String(c.id)] = p;                 // 場所の一覧にある車庫だけ
    });
    COURSE_GARAGE = buf;
  }catch(e){ /* 読めないときは前の内容を保つ */ }
}

/** いま選ばれているものを、選択肢の値に直す */
/** つながっていないときの案内。⚠️ 黙って落とさず、必ず名指しで出す。
    3通りに分けて書く（どれも直し方が違うため）。 */
function arriveLostMsg(c, name){
  const cs = COURSES.find(x => String(x.id) === String(c.course_id));
  const school = cs ? (cs.school_name || '') : '';
  const ls = COURSE_LOCS[String(c.course_id)] || [];
  const schoolStop = ls.find(l => l.name === school) || ls.find(l => school && l.name.indexOf(school) >= 0);
  let hint;
  if (name === '学校' || name === '学校集合'){
    hint = schoolStop
      ? `このコースの学校は「<b>${escHtml(schoolStop.name)}</b>」です。<b>🏫 学校</b> の枠から選び直してください。`
      : 'このコースの学校がバス停に登録されていません。運行時程マスタで登録してください。';
  } else if (Object.values(PLACES).some(p => p.name === name)){
    hint = `「${escHtml(name)}」は場所としては登録されていますが、<b>この場面の添乗員送迎になっていません</b>。`
         + '運行時程マスタの「添乗員送迎」に足すか、上から選び直してください。';
  } else {
    hint = '上の 🏢 車庫 ／ 🚏 ポイント ／ 🏫 学校 ／ 📍 添乗員送迎 から選び直してください。'
         + '　どれにも当てはまらない場所なら、運行時程マスタの「③添乗員送迎」に足してください。';
  }
  return `<div style="margin-top:6px;font-size:12px;color:#94402f;line-height:1.75;">`
       + `⚠️ いま入っている「<b>${escHtml(name)}</b>」は、いまの選択肢の中にありません。<br>`
       + `<span style="color:#6f8078;">${hint}</span></div>`;
}

/** 到着地を選んだとき。⚠️ 場所は番号で持つ */
function pickLoc(ci, locId){
  if (!locId) return;
  const c = model.courses[ci]; const {leg, dir} = c._slot;
  const list = COURSE_LOCS[String(c.course_id)] || [];
  const loc = list.find(x => String(x.id) === String(locId));
  if (!loc) return;
  const e = ends(c, leg, dir);
  e.course.seg[e.course.key] = loc.address || loc.name;
  c.routes[leg][dir]['場所'] = loc.name;
  render();
}
function toggleLocMgr(ci){ const c = model.courses[ci]; c._editLocs = !c._editLocs; render(); }

// 名称欄の文字でGoogleマップ検索を開く（住所の確認用）
function mapSearch(inputId){
  const el = document.getElementById(inputId);
  const q = el ? (el.value || '').trim() : '';
  if (!q){ status('先に名称（目印）を入れてください', false); return; }
  window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q), '_blank');
}

async function addLocInline(ci){
  const c = model.courses[ci];
  const name = (document.getElementById('newlocname-'+ci).value || '').trim();
  const address = (document.getElementById('newlocaddr-'+ci).value || '').trim();
  if (!name && !address){ status('名称か住所を入れてください', false); return; }
  try {
    const res = await fetch(`${REST_URL}/course_locations`, {
      method:'POST', headers: getH(),
      body: JSON.stringify({ course_id: c.course_id, name: name || address, address })
    });
    if (!res.ok){ const t = await res.text(); status('追加に失敗：' + t.slice(0,120), false); return; }
    await loadCourseLocations();
    c._editLocs = true;
    status('乗車場所を追加しました', true);
    render();
  } catch(e){ status('追加エラー：' + e.message, false); }
}
async function saveLoc(ci, locId){
  const name = (document.getElementById('locname-'+locId).value || '').trim();
  const address = (document.getElementById('locaddr-'+locId).value || '').trim();
  if (!name){ status('名称を入れてください', false); return; }
  try {
    const res = await fetch(`${REST_URL}/course_locations?id=eq.${locId}`, {
      method:'PATCH', headers: getH(),
      body: JSON.stringify({ name, address })
    });
    if (!res.ok){ const t = await res.text(); status('保存に失敗：' + t.slice(0,120), false); return; }
    await loadCourseLocations();
    model.courses[ci]._editLocs = true;
    status('保存しました', true);
    render();
  } catch(e){ status('保存エラー：' + e.message, false); }
}
async function delLoc(ci, locId){
  if (!confirm('この乗車場所を削除します。よろしいですか？（すでに組んだ経路の文字はそのまま残ります）')) return;
  try {
    const res = await fetch(`${REST_URL}/course_locations?id=eq.${locId}`, { method:'DELETE', headers: getH() });
    if (!res.ok){ const t = await res.text(); status('削除に失敗：' + t.slice(0,120), false); return; }
    await loadCourseLocations();
    model.courses[ci]._editLocs = true;
    status('削除しました', true);
    render();
  } catch(e){ status('削除エラー：' + e.message, false); }
}

async function onStaffChange(){
  const id = document.getElementById('staffSelect').value;
  model = { staffId: id ? Number(id) : null, courses: [] };
  if (!id){ render(); return; }
  model.homeAddr = jushoHyoji(STAFF_ADDR[String(id)] || '');
  const res = await fetch(`${REST_URL}/commute_routes?staff_id=eq.${id}&select=*`, { headers: getH() });
  if (!res.ok){ status('経路の読み込みに失敗しました', false); render(); return; }
  const rows = await res.json();
  model.courses = rows.map(r => ({ id: r.id, course_id: r.course_id, active: r.active, routes: normRoutes(r.routes), _slot: { leg:'登校', dir:'出勤' } }));
  render();
}

function render(){
  const area = document.getElementById('coursesArea');
  const addArea = document.getElementById('addCourseArea');
  const saveBar = document.getElementById('saveBar');
  if (!model.staffId){ area.innerHTML=''; addArea.style.display='none'; saveBar.style.display='none'; return; }
  addArea.style.display='block'; saveBar.style.display='block';
  const used = new Set(model.courses.map(c => String(c.course_id)));
  const csel = document.getElementById('courseSelect'); csel.innerHTML='';
  COURSES.filter(c => !used.has(String(c.id))).forEach(c => {
    const o = document.createElement('option'); o.value = c.id; o.textContent = `${c.school_name} ／ ${c.course_name}`; csel.appendChild(o);
  });
  if (!model.courses.length){ area.innerHTML = '<p class="muted">担当コースがありません。下の「担当コースを追加」から登録してください。</p>'; return; }
  area.innerHTML = model.courses.map((c, ci) => courseCardHtml(c, ci)).join('');
}

function courseCardHtml(c, ci){
  const slot = c._slot; const s = c.routes[slot.leg][slot.dir];
  // 初回表示時、区間が空なら1本作って自宅側を既定入力（住居表示まで）
  if (!s._init){
    s._init = true;
    if (!s['区間'].length && model.homeAddr){
      const e0 = ends(c, slot.leg, slot.dir);
      if (!e0.home.seg[e0.home.key]) e0.home.seg[e0.home.key] = model.homeAddr;
    }
  }
  const tabs = [];
  LEGS.forEach(l => DIRS.forEach(d => {
    const on = (l === slot.leg && d === slot.dir);
    tabs.push(`<button class="tab${on?' active':''}" onclick="setSlot(${ci},'${l}','${d}')">${l}便 ${d}</button>`);
  }));
  const segs = s['区間'].map((seg, si) => segHtml(ci, slot.leg, slot.dir, seg, si)).join('');
  const total = s['区間'].reduce((a, x) => a + (Number(x['運賃'])||0), 0);
  const locs = COURSE_LOCS[String(c.course_id)] || [];
  /* 🔴 ①添乗員送迎の場所 ②バス停（学校を含む）の2段（2026-09-01 八重樫さん） */
  const _arrCur  = arriveCur(c, slot.leg, slot.dir);
  const locOpts  = arriveOpts(c.course_id, _arrCur, slot.leg, slot.dir);
  const _arrName = (s['場所'] || '').trim();
  const _arrLost = (_arrName && !_arrCur) ? arriveLostMsg(c, _arrName) : '';
  const homeLbl   = (slot.dir === '出勤') ? '出発地（自宅）'                : '到着地（自宅）';
  const courseLbl = (slot.dir === '出勤') ? '到着地（バスに乗る場所）' : '出発地（バスを降りる場所）';
  const locMgr = c._editLocs ? `
    <div style="border:1px dashed #cbd8d0;border-radius:8px;padding:10px;margin:0 0 12px;background:#fff;">
      <div style="font-size:13px;color:#4a5d52;margin-bottom:8px;">乗車場所の編集（このコース）— <b>名称</b>は人が分かる目印、<b>住所</b>は乗換案内の検索に使います</div>
      ${locs.map(l => `
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;align-items:center;">
          <input id="locname-${l.id}" value="${escAttr(l.name)}" placeholder="名称（例：みなみ野デニーズ前）" style="flex:1;min-width:150px;">
          <input id="locaddr-${l.id}" value="${escAttr(l.address)}" placeholder="住所（検索用）" style="flex:2;min-width:190px;">
          <button class="mini" onclick="mapSearch('locname-${l.id}')">🗺 地図</button>
          <button class="mini" onclick="saveLoc(${ci},${l.id})">保存</button>
          <button class="link" onclick="delLoc(${ci},${l.id})">削除</button>
        </div>`).join('') || '<p class="muted" style="margin:0 0 6px;">まだ登録がありません。下の欄から追加してください。</p>'}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;border-top:1px solid #eee;padding-top:8px;align-items:center;">
        <input id="newlocname-${ci}" placeholder="＋ 名称" style="flex:1;min-width:150px;">
        <input id="newlocaddr-${ci}" placeholder="＋ 住所（検索用）" style="flex:2;min-width:190px;">
        <button class="mini" onclick="mapSearch('newlocname-${ci}')">🗺 地図</button>
        <button class="mini" onclick="addLocInline(${ci})">追加</button>
      </div>
    </div>` : '';
  return `<div class="courseCard">
    <div class="courseHead">
      <div class="courseTitle">${escHtml(courseLabel(c.course_id))}</div>
      <button class="link" onclick="delCourse(${ci})">コース削除</button>
    </div>
    <div class="tabs">${tabs.join('')}</div>
    <div style="background:#f6faf7;border:1px solid #e2ede6;border-radius:10px;padding:12px;margin:6px 0 12px;">
      <div style="display:flex;flex-wrap:wrap;gap:14px;">
        <div style="flex:1;min-width:230px;">
          <div class="fld" style="margin:0 0 4px;">🏠 ${homeLbl}</div>
          <button class="mini" onclick="fillHome(${ci})">住所を入れる</button>
          <span class="muted" style="font-size:12px;margin-left:6px;">${model.homeAddr ? escHtml(model.homeAddr) : '住所未登録'}</span>
        </div>
        <div style="flex:1;min-width:230px;">
          <div class="fld" style="margin:0 0 4px;">📍 ${courseLbl}</div>
          <div style="display:flex;gap:6px;">
            <select onchange="pickArrive(${ci},this.value)" style="flex:1;">${locOpts}</select>
            <button class="mini" onclick="toggleLocMgr(${ci})">✏️ 編集・追加</button>
          </div>
          ${_arrLost}
        </div>
      </div>
    </div>
    ${locMgr}
    <label class="fld">集合場所の名称（表示用・任意／上で選ぶと自動で入ります）</label>
    <input type="text" value="${escAttr(s['場所'])}" placeholder="例：みなみ野デニーズ前 ／ 車庫" oninput="upd(${ci},'${slot.leg}','${slot.dir}','場所',null,this.value)">
    <div style="margin:12px 0 6px;font-size:13px;color:#6b7d72;">行程（区間）— 自宅↔乗車場所。乗りかえや「自転車→駅」があれば区間を足してください</div>
    ${segs || '<p class="muted" style="margin:0 0 8px;">区間がありません。上の「住所を入れる」「乗車場所を選ぶ」で自動作成、または「区間を追加」で足してください。</p>'}
    <button class="mini" onclick="addSeg(${ci},'${slot.leg}','${slot.dir}')">＋ 区間を追加（乗りかえ）</button>
    <div class="total"><span class="muted">この行程の運賃 合計</span><span class="amt" id="total-${ci}">¥${total}</span></div>
    <label class="fld" style="margin-top:10px;">⏱ 移動時間（<b>時:分</b>・公共交通機関のみ）— ${slot.dir==='出勤'?'最寄り駅→乗車場所':'乗車場所→最寄り駅'}の標準所要時間（乗換案内）。<b>自宅↔駅は含めない</b>（勤怠の${slot.dir==='出勤'?'出勤前':'退勤後'}移動時間）</label>
    <input type="text" inputmode="numeric" value="${escAttr(s['移動時間']||'')}" placeholder="例：1:10" oninput="updIdou(${ci},'${slot.leg}','${slot.dir}',this)">
  </div>`;
}

function segHtml(ci, leg, dir, seg, si){
  const opts = MODES.map(m => `<option ${seg['手段']===m?'selected':''}>${m}</option>`).join('');
  return `<div class="seg">
    <div class="line">
      <select class="mode" onchange="upd(${ci},'${leg}','${dir}','区間',${si},this.value,'手段')">${opts}</select>
      <input class="st" type="text" value="${escAttr(seg['乗車'])}" placeholder="乗車地" oninput="upd(${ci},'${leg}','${dir}','区間',${si},this.value,'乗車')">
      <span class="arrow">→</span>
      <input class="st" type="text" value="${escAttr(seg['下車'])}" placeholder="下車地" oninput="upd(${ci},'${leg}','${dir}','区間',${si},this.value,'下車')">
    </div>
    <div class="line">
      <span>運賃 ¥<input type="number" min="0" step="10" style="width:96px;" value="${Number(seg['運賃'])||0}" oninput="updFare(${ci},'${leg}','${dir}',${si},this.value)"></span>
      <button class="mini" onclick="yahoo(${ci},'${leg}','${dir}',${si})">乗換案内で調べる</button>
      <button class="link" onclick="delSeg(${ci},'${leg}','${dir}',${si})">× 削除</button>
    </div>
  </div>`;
}

function setSlot(ci, leg, dir){ model.courses[ci]._slot = { leg, dir }; render(); }
function upd(ci, leg, dir, field, si, val, subfield){
  const s = model.courses[ci].routes[leg][dir];
  if (field === '場所'){ s['場所'] = val; }
  else if (field === '移動時間'){ s['移動時間'] = val; }
  else if (field === '区間'){ s['区間'][si][subfield] = val; }
}
function updFare(ci, leg, dir, si, val){
  const s = model.courses[ci].routes[leg][dir];
  s['区間'][si]['運賃'] = Number(val) || 0;
  const total = s['区間'].reduce((a, x) => a + (Number(x['運賃'])||0), 0);
  const el = document.getElementById('total-' + ci); if (el) el.textContent = '¥' + total;
}
// 移動時間を「時:分」に統一。「1時間26分」等を貼っても 1:26 に変換し、数字とコロンだけに限定
function updIdou(ci, leg, dir, el){
  let v = (el.value || '')
    .replace(/時間|時/g, ':')   // 1時間26分 → 1:26分
    .replace(/分/g, '')          // 分 を除去
    .replace(/[^\d:]/g, '');     // 数字とコロン以外を除去
  const p = v.split(':');
  if (p.length > 2) v = p[0] + ':' + p.slice(1).join('');  // コロンは1つまで
  el.value = v;
  upd(ci, leg, dir, '移動時間', null, v);
}
function addSeg(ci, leg, dir){ model.courses[ci].routes[leg][dir]['区間'].push({ '手段':'電車', '乗車':'', '下車':'', '運賃':0 }); render(); }
function delSeg(ci, leg, dir, si){ model.courses[ci].routes[leg][dir]['区間'].splice(si, 1); render(); }
function addCourse(){
  const cid = Number(document.getElementById('courseSelect').value);
  if (!cid) return;
  model.courses.push({ course_id: cid, active: true, routes: emptyRoutes(), _slot: { leg:'登校', dir:'出勤' } });
  render();
}
async function delCourse(ci){
  const c = model.courses[ci];
  if (!confirm('このコースの経路を削除します。よろしいですか？')) return;
  if (c.id){
    const res = await fetch(`${REST_URL}/commute_routes?id=eq.${c.id}`, { method:'DELETE', headers: getH() });
    if (!res.ok){ status('削除に失敗しました', false); return; }
  }
  model.courses.splice(ci, 1); render(); status('コースを削除しました', true);
}
function yahoo(ci, leg, dir, si){
  const seg = model.courses[ci].routes[leg][dir]['区間'][si];
  if (!seg['乗車'] || !seg['下車']){ status('乗車地と下車地を入れてから調べてください', false); return; }
  const url = 'https://transit.yahoo.co.jp/search/result?from=' + encodeURIComponent(seg['乗車']) + '&to=' + encodeURIComponent(seg['下車']) + '&ticket=normal';
  window.open(url, '_blank');
}
function saveStatus(msg, ok){
  const el = document.getElementById('saveMsg');
  if (!el) return;
  el.textContent = msg;
  el.style.color = ok ? '#2e7d46' : '#c0392b';
  if (ok) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 5000);
}
async function saveAll(){
  if (!model.staffId) return;
  const rows = model.courses.map(c => {
    const routes = JSON.parse(JSON.stringify(c.routes));
    LEGS.forEach(l => DIRS.forEach(d => {
      const s = routes[l][d];
      delete s._init;
      s['交通費'] = s['区間'].reduce((a, x) => a + (Number(x['運賃'])||0), 0);
      s['手段'] = [...new Set(s['区間'].map(x => x['手段']).filter(Boolean))].join('・');
    }));
    const row = { staff_id: model.staffId, course_id: c.course_id, routes };
    if (c.id) row.id = c.id;
    return row;
  });
  if (!rows.length){ status('保存する経路がありません', false); saveStatus('保存する経路がありません', false); return; }
  try {
    const url = `${REST_URL}/commute_routes?on_conflict=staff_id,course_id`;
    const doPost = () => fetch(url, {
      method: 'POST',
      headers: { ...getH(), 'Prefer': 'resolution=merge-duplicates,return=representation' },
      body: JSON.stringify(rows)
    });
    await ensureFreshToken();          // 期限が近ければ先に更新
    let res = await doPost();
    if (res.status === 401){           // 期限切れ → 自動更新して1回だけ再試行（入力は保持）
      saveStatus('ログインを更新して再保存します…', true);
      if (await refreshSession()) res = await doPost();
    }
    if (!res.ok){
      const t = await res.text();
      if (res.status === 401 || t.includes('JWT')){
        status('ログインの有効期限が切れました。再読み込み→ログイン後にもう一度保存してください（入力はこのまま残っています）', false);
        saveStatus('ログイン切れ：再読み込み→ログインしてください', false);
      } else {
        status('保存に失敗しました：' + t.slice(0,140), false);
        saveStatus('保存に失敗しました', false);
      }
      return;
    }
    status('保存しました', true);
    saveStatus('✅ 保存しました', true);
    onStaffChange();
  } catch(e){ status('保存エラー：' + e.message, false); saveStatus('保存エラー：' + e.message, false); }
}

document.addEventListener('DOMContentLoaded', async () => {
  const ok = await initAuth(['super_admin','admin','operator','staff']);
  if (!ok) return;
  setInterval(() => { refreshSession(); }, 45 * 60 * 1000);  // 開いている間、定期的にトークンを更新して期限切れを防ぐ
  document.getElementById('staffSelect').addEventListener('change', onStaffChange);
  try {
    await loadStaff();
    await loadCourses();
    await loadCourseLocations();
    await loadPlaces();
    await loadCourseGarages();   // ⚠️ PLACES を使うので loadPlaces のあと
    await loadStaffAddr();
    status('準備ができました。添乗員をえらんでください。', true);
  } catch(e){ status('データ読み込みエラー：' + e.message, false); }
});
