}
function setRSeg(seg){
  rptSyncFromInputs();
  if(R_KAISOU_BASE.indexOf(seg) >= 0){ selRBase = seg; selRSeg = _kaiSeg(); }
  else { selRBase = ''; selRSeg = seg; }
  rptSelIdx=null; renderEditor();
}
/** 回送の道を「どの便の・どの送迎のとき」のものとして編集するか（値は「登校|42」の形） */
function setRWho(v){
  rptSyncFromInputs();
  const p = String(v||'登校|').split('|');
  selRGroup = p[0] || '登校';
  selRScen  = p[1] || '';
  selRSeg   = _kaiSeg();
  selRRoute = '';            // 組み合わせを変えたらメインに戻す
  rptSelIdx=null; renderEditor();
}
/** メイン／サブの切替 */
function setRRoute(v){ rptSyncFromInputs(); selRRoute = v || ''; rptSelIdx=null; renderEditor(); }
/** サブルートを増やす（渋滞・事故のときに運転手が選べる代替の道） */
function rptAddRoute(){
  const nm = (prompt('サブルートの名前を入れてください（例：環八経由）', '') || '').trim();
  if(!nm) return;
  if(nm.indexOf('|') >= 0){ _saveMsg('名前に「|」は使えません。', false); return; }
  rptSyncFromInputs(); selRRoute = nm; rptSelIdx = null; renderEditor();
  _saveMsg(`サブルート「${nm}」を作りました。地点を入れてください（空のままだと保存されません）。`, true);
}

/** 行を選ぶ。差し込み先の目印なので、再描画はせず色とボタンの文字だけ変える（入力中の値を消さないため） */
function rptSelect(i){
  rptSelIdx = (rptSelIdx===i) ? null : i;   // 同じ行をもう一度押すと選択解除
  document.querySelectorAll('#rptTable tbody tr.rp-row').forEach(function(tr,k){
    tr.style.background = (k===rptSelIdx) ? '#eef4ef' : '';
  });
  var b = document.getElementById('rptAddBtn');
  if(b) b.textContent = (rptSelIdx==null) ? '＋ 最後に地点を追加' : ('＋ '+(rptSelIdx+1)+'番の上に差し込む');
}

/** 指定位置に空欄の行を差し込む。at を省くと末尾に足す */
function rptAdd(at){
  rptSyncFromInputs();
  var pts=_rpts();
  if(at==null) at = (rptSelIdx==null) ? pts.length : rptSelIdx;
  if(at<0) at=0; if(at>pts.length) at=pts.length;
  pts.splice(at, 0, { name:'', lat:'', lng:'', is_stop:false, split_here:false, note:'' });
  // 差し込んだ位置より下の行は1つずつ下がる。選んでいた行もそれに合わせて動かす
  // （選んだ行の上に足した場合は選択がその行を追い続けるので、続けて足すと進行方向どおりに並ぶ）
  if(rptSelIdx!=null && rptSelIdx>=at) rptSelIdx++;
  renderEditor();
  // 差し込んだ行の緯度欄へすぐ入力できるようにする
  var tr = document.querySelectorAll('#rptTable tbody tr.rp-row')[at];
  if(tr){ var el=tr.querySelector('.rp-lat'); if(el){ el.focus(); } }
}
function rptMove(i,dir){
  rptSyncFromInputs();   // 先に画面の値を拾ってから入れ替える（順序を逆にすると入れ替えが打ち消される）
  const pts=_rpts(), j=i+dir;
  if(j<0||j>=pts.length) return;
  [pts[i],pts[j]]=[pts[j],pts[i]];
  if(rptSelIdx===i) rptSelIdx=j; else if(rptSelIdx===j) rptSelIdx=i;
  renderEditor();
}
function rptDel(i){
  rptSyncFromInputs();
  _rpts().splice(i,1);
  if(rptSelIdx===i) rptSelIdx=null; else if(rptSelIdx!=null && rptSelIdx>i) rptSelIdx--;
  renderEditor();
}
function rptRecalc(){ rptSyncFromInputs(); renderEditor(); }
/** 注意書きの欄を開く／閉じる（中身があるときは常に開いたまま） */
function rptNote(i){
  rptSyncFromInputs();
  const k=selRSeg+'|'+i;
  if(rptNoteOpen[k]) delete rptNoteOpen[k]; else rptNoteOpen[k]=true;
  renderEditor();
  const tr=document.querySelectorAll('#rptTable tbody tr.rp-row')[i];
  const el=tr && tr.nextElementSibling && tr.nextElementSibling.querySelector('.rp-note');
  if(el) el.focus();
}

/** 緯度・経度欄に「35.5442, 139.7043」や度分秒をそのまま貼っても、2つに分けて入れる */
function rptCoordIn(el){
  var tr = el.closest('tr');
  var c = dmsToDecimal(el.value);
  if(c && tr){
    var la=tr.querySelector('.rp-lat'), ln=tr.querySelector('.rp-lng');
    if(la) la.value = c.lat;
    if(ln) ln.value = c.lng;
  }
  rptRecalc();
}

/** ②のバス停一覧から下書きを作る。登校＝順路どおり、下校＝逆順の目安 */
function rptFillFromStops(){
  const stops=_stops();
  const src = (selRSeg==='登校')
    ? stops.filter(s=>!s.gekou_only)
    : (function(){ const a=[]; for(let i=stops.length-1;i>=0;i--){ if(!stops[i].gekou_only) a.push(stops[i]); } stops.forEach(s=>{ if(s.gekou_only) a.push(s); }); return a; })();
  const pts=[], skipped=[];
  src.forEach(s=>{
    const c=dmsToDecimal(s.coord);
    if(c) pts.push({ name:s.name||'', lat:String(c.lat), lng:String(c.lng), is_stop:true, split_here:false, note:'' });
    else if((s.name||'').trim()) skipped.push(s.name);
  });
  if(!pts.length){ _saveMsg('②のバス停に座標が入っていません。先にバス停の「座標」欄を埋めてください。', false); return; }
  RPTS[String(selCourseId)][_rkey()] = pts;
  rptSelIdx = null;
  renderEditor();
  _saveMsg(`バス停 ${pts.length}件から並びを作りました。${skipped.length?('（座標なしで飛ばした停：'+skipped.join('、')+'）'):''}曲がり角の目印を足して調整してください。`, true);
}

/** 回送の下書き。すでに分かっている地点を並べる：
 *  出庫＝ 車庫 →（その送迎の乗降地点）→ その便の最初のバス停
 *  帰庫＝ その便の最後の地点 →（乗降地点）→ 車庫
 *  あとは曲がり角の目印を間に差し込むだけにする（②のバス停から作る下書きと同じ考え方） */
function rptSeedKaisou(){
  if(!selRBase) return;
  const c   = COURSES.find(x=>x.id===selCourseId) || {};
  const off = OFFICES[c.office_id];
  const gc  = off && dmsToDecimal(off.coord);
  if(!gc){ _saveMsg('このコースの車庫に座標が入っていません。営業所マスタ（master.html）で座標を入れてください。', false); return; }

  // その便の本線から、最初のバス停と最後の地点を取る
  const mainSeg = (selRGroup === '登校') ? '登校' : '下校①';
  const line = ((RPTS[String(selCourseId)]||{})[mainSeg]||[])
    .filter(p=>String(p.lat).trim()!=='' && String(p.lng).trim()!=='');
  if(!line.length){ _saveMsg(`${R_SEG_LABEL[mainSeg]}にまだ地点がありません。先にそちらを作ってください。`, false); return; }
  const firstStop = line.find(p=>p.is_stop) || line[0];
  const lastPt    = line[line.length-1];

  // その送迎の乗降地点（「登校前」「登校後」のように前後で分かれている）
  const sc   = _scenList().find(s=>String(s.dbId)===String(selRScen));
  const want = (selRBase==='出庫回送') ? '前' : '後';
  const tps  = !sc ? [] : (sc.pts||[])
    .filter(p=>String(p.phase||'').endsWith(want))
    .map(p=>{ const d=dmsToDecimal(p.coord); return d ? {
        name:(p.name||'送迎地点')+'（'+(p.kind||'乗降')+'）',
        lat:String(d.lat), lng:String(d.lng), is_stop:true, split_here:false, note:'' } : null; })
    .filter(Boolean);

  const mk = (name,lat,lng) => ({ name:name||'', lat:String(lat), lng:String(lng), is_stop:true, split_here:false, note:'' });
  const gar = mk(off.name||'車庫', gc.lat, gc.lng);
  const pts = (selRBase==='出庫回送')
    ? [gar].concat(tps, [mk(firstStop.name||'最初のバス停', firstStop.lat, firstStop.lng)])
    : [mk(lastPt.name||'最後の地点', lastPt.lat, lastPt.lng)].concat(tps, [gar]);

  rptSyncFromInputs();
  const cur = _rpts();
  if(cur.length && !confirm(`いまの${cur.length}地点を、下書き${pts.length}地点で置き換えます。よろしいですか。`)) return;
  RPTS[String(selCourseId)][_rkey()] = pts;
  rptSelIdx = null;
  renderEditor();
  _saveMsg(`${pts.length}地点の下書きを作りました。曲がり角の目印を間に差し込んでください。`, true);
}

/** 他の便の並びを、いま開いている便へ丸ごとコピーする（下校は原則どの便も同じ道のため） */
function rptCopyFrom(srcSeg){
  const box = RPTS[String(selCourseId)] = RPTS[String(selCourseId)] || _emptyRpts();
  const src = box[srcSeg] || [];
  if(!src.length){ _saveMsg(`${R_SEG_LABEL[srcSeg]}にはまだ地点がありません。先にそちらを作ってください。`, false); return; }
  rptSyncFromInputs();
  const cur = box[selRSeg] || [];
  if(cur.length && !confirm(`いま開いている${R_SEG_LABEL[selRSeg]}の${cur.length}地点を、${R_SEG_LABEL[srcSeg]}の${src.length}地点で置き換えます。よろしいですか。`)) return;
  box[selRSeg] = src.map(p=>({ name:p.name, lat:p.lat, lng:p.lng, is_stop:p.is_stop, split_here:p.split_here, note:p.note }));
  rptSelIdx = null;
  renderEditor();
  _saveMsg(`${R_SEG_LABEL[srcSeg]}から ${src.length}地点をコピーしました。違うところだけ直してください。`, true);
}

/* ===== Googleマップの道案内リンク =====
   実際にGoogleマップへ渡して確かめたこと（2026-08-19）：
   ・`?api=1&waypoints=…` の形式は経由地9か所まで。10個以上渡すと超えた分は黙って捨てられる
   ・地点を「/」で並べる形式（/maps/dir/緯度,経度/緯度,経度/…）なら**44か所まで通った**。
     こちらを使う。狙った道を通らせるには地点を密に置くしかないため、9か所では足りない
   ・指定しないと首都高を使う（六郷→大塚ろう学校で34.0km・有料区間あり）。
     data=…!1b1!2b1… を付けると一般道だけの28.9kmになる */
const RPT_MAX_VIA = 44;   // 実測で通った数。これを超えるかは未確認なので目安として警告に使う

/** 区間に切り分ける。切り方は2通りあり、画面では両方出す。
 *  byStop=false（通し）… 「区切」だけで切る。区切が無ければ**全体を1本**で開く
 *  byStop=true （バス停ごと）… 「区切」に加えてバス停でも切る。運転手がバス停ごとに開く用
 *
 *  ・区切（切）  … その地点で終わり、**次の地点から**新しい区間（地点を共有しない）。
 *                  Uターンのように、地点と地点の間をナビに任せられないときに使う
 *  ・バス停（停）… その地点を前後の区間で**共有**する（停まって、そこから続ける）  */
function rptLegs(byStop){
  const pts=_rpts().filter(p=>String(p.lat).trim()!==''&&String(p.lng).trim()!=='');
  if(pts.length<2) return [];
  const mk=(a,b)=>({
    from: pts[a].name || `${a+1}番目`,
    to:   pts[b].name || `${b+1}番目`,
    cut:  !!pts[b].split_here,      // この区間が「切」で終わるか（画面の表示に使う）
    pts:  pts.slice(a, b+1)
  });
  const legs=[]; let start=0;
  for(let i=1;i<pts.length;i++){
    const last=(i===pts.length-1);
    if(pts[i].split_here){          // 切：ここで終わって、次から仕切り直す
      if(i>start) legs.push(mk(start,i));
      start=i+1;
    } else if(byStop && pts[i].is_stop && !last){   // バス停：ここで区切り、同じ地点から続ける
      if(i>start) legs.push(mk(start,i));
      start=i;
    } else if(last){
      if(i>start) legs.push(mk(start,i));
    }
  }
  return legs;
}
/** 隣り合う2地点の順番が逆になっていないか調べる。
 *  入れ替えたときに道のりが目に見えて短くなるなら、順番が逆の可能性が高い。
 *  （差し込む位置を1つ間違えると起きる。2026-08-19 実際に発生した）
 *  Uターンのように短い距離で折り返す場合は差が出ないので、誤検出しない。 */
const RPT_SWAP_KM = 0.5;   // これ以上短くなるなら知らせる
function rptOrderWarnings(){
  const pts=_rpts().map((p,i)=>({...p, idx:i}))
                   .filter(p=>String(p.lat).trim()!==''&&String(p.lng).trim()!=='');
  const D=(a,b)=>rptHaversine({lat:Number(a.lat),lng:Number(a.lng)},{lat:Number(b.lat),lng:Number(b.lng)});
  const out=[];
  // 両隣がある組だけを見る。先頭・末尾を入れ替えるのは「順番の誤り」ではなく
  // 出発地・目的地そのものの変更なので、判定に混ぜると誤って知らせてしまう
  // （学校の裏門へ回り込むために最後だけ south へ下がる、といった正しい動きが引っかかった）
  for(let i=1;i+2<pts.length;i++){
    // i と i+1 を入れ替えると、前後との繋がりだけが変わる（i↔i+1 の間は共通なので相殺される）
    const gain = (D(pts[i-1],pts[i]) + D(pts[i+1],pts[i+2]))
               - (D(pts[i-1],pts[i+1]) + D(pts[i],pts[i+2]));
    if(gain>RPT_SWAP_KM) out.push({ a:pts[i].idx+1, b:pts[i+1].idx+1, km:gain });
  }
  return out;
}

/* 地点を「/」で並べる形式のURLを組み立てる。
   末尾の data=!4m5!4m4!2m2!1b1!2b1!3e0 は、Googleマップの設定画面で
   「高速道路を利用しない」「有料道路を利用しない」にチェックを入れたときと同じ状態を表す
   （!1b1=高速を使わない ／ !2b1=有料を使わない ／ !3e0=車）。 */
function rptLegUrl(leg){
  const c=leg.pts.map(p=>`${Number(p.lat)},${Number(p.lng)}`);
  return 'https://www.google.com/maps/dir/' + c.join('/') + '/data=!4m5!4m4!2m2!1b1!2b1!3e0';
}
function rptOpenLeg(i, byStop){
  rptSyncFromInputs();
  const legs=rptLegs(byStop);
  if(!legs[i]){ _saveMsg('地点を2つ以上入れてください。', false); return; }
  window.open(rptLegUrl(legs[i]), '_blank');
}

function renderRoutePoints(){
  const pts=_rpts();
  const valid=pts.filter(p=>String(p.lat).trim()!==''&&String(p.lng).trim()!=='').length;
  const dist=rptDistances();
  const _box = RPTS[String(selCourseId)] || {};
  const _segBtn = (val,label,on,n) =>
    `<button onclick="setRSeg('${val}')" style="border:1px solid ${on?'#4d7a5e':'#cfe0d5'};background:${on?'#4d7a5e':'#fff'};color:${on?'#fff':'#2d4a38'};padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:${on?'700':'500'};font-family:inherit;">${label}${n?`（${n}）`:''}</button>`;
  const segBtns = R_MAIN.map(s=>_segBtn(s, R_SEG_LABEL[s], selRSeg===s, (_box[s]||[]).length))
    .concat(R_KAISOU_BASE.map(b=>{
      // 回送は便・送迎・ルートに分かれているので、その回送に入っている総数を出す
      let n=0; Object.keys(_box).forEach(kk=>{ if(kk.indexOf(b)===0) n+=(_box[kk]||[]).length; });
      return _segBtn(b, R_SEG_LABEL[b+'登校'], selRBase===b, n);
    })).join('');
  // 回送（車庫⇄バス停）は、添乗員の送迎パターンによって通る道が変わる。
  // どの送迎のときの道を編集しているかを、ここで選ぶ
  const scenRow = selRBase ? (function(){
    const all = _scenList();
    const unsaved = all.filter(s=>!s.dbId).length;
    // ① どの便の・どの送迎のときの道か
    const cur = selRGroup + '|' + (selRScen || '');
    const mk = (v,label) => `<option value="${escAttr(v)}"${v===cur?' selected':''}>${escHtml(label)}</option>`;
    let whoOpts = '';
    ['登校','下校'].forEach(g=>{
      whoOpts += mk(g+'|', '送迎なし（'+g+'便）');
      all.filter(s=>s.dbId && s.segment===g)
         .forEach(s=> whoOpts += mk(g+'|'+s.dbId, (s.label||('送迎'+s.dbId))+'（'+g+'便）'));
    });
    // ② メイン／サブ。いま地点が入っているルート名を拾って並べる
    const pre = _kaiSeg() + '|' + (selRScen||'') + '|';
    const names = {};  names[''] = true;  names[selRRoute||''] = true;
    Object.keys(_box).forEach(kk=>{ if(kk.indexOf(pre)===0) names[kk.slice(pre.length)] = true; });
    const rOpts = Object.keys(names).sort().map(nm=>{
      const n = (_box[pre+nm]||[]).length;
      return `<option value="${escAttr(nm)}"${nm===(selRRoute||'')?' selected':''}>${
        nm ? ('サブ：'+escHtml(nm)) : 'メイン'}${n?`（${n}）`:''}</option>`;
    }).join('');
    return `<div class="line" style="gap:8px;margin-bottom:6px;flex-wrap:wrap;align-items:center;">
      <span class="muted" style="font-size:13px;flex:0 0 auto;">どの送迎のときの道か</span>
      <select onchange="setRWho(this.value)" style="font-size:14px;padding:5px 8px;">${whoOpts}</select>
      <span class="muted" style="font-size:13px;flex:0 0 auto;">ルート</span>
      <select onchange="setRRoute(this.value)" style="font-size:14px;padding:5px 8px;">${rOpts}</select>
      <button class="mini" onclick="rptAddRoute()">＋ サブルートを追加</button>
      <button class="mini" onclick="rptSeedKaisou()">🅿 車庫・送迎地点・第1ポイントから下書き</button>
      ${unsaved?`<span style="font-size:12px;color:#c0392b;">※ まだ保存していない送迎が${unsaved}件あります。保存すると選べます。</span>`:''}
    </div>
    <div class="muted" style="font-size:12px;margin:-2px 0 8px;">
      便によって行き先が違います（登校の出庫＝車庫→最初のバス停／下校の出庫＝車庫→学校）。
      添乗員を乗せる日は通る道が変わるので、送迎ごとに別に持てます。
      <b>サブルート</b>は渋滞や事故のときの備えで、運転手がその場で選べます。
    </div>`;
  })() : '';
  // 下校便は原則どの便も同じ道なので、前の便からコピーできるようにする
  const copySrc = { '下校②':['下校①'], '下校③':['下校①','下校②'] }[selRSeg] || [];
  const copyBtns = copySrc.map(s=>{
    const n=((RPTS[String(selCourseId)]||{})[s]||[]).length;
    return `<button class="mini" onclick="rptCopyFrom('${s}')" ${n?'':'disabled'} title="${n?R_SEG_LABEL[s]+'の並びをここへ複製します':R_SEG_LABEL[s]+'にまだ地点がありません'}">📋 ${R_SEG_LABEL[s]}をコピー</button>`;
  }).join('');
  const copyRow = copyBtns ? `<div class="line" style="gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center;">
      ${copyBtns}<span class="muted" style="font-size:13px;">下校便は原則どの便も同じ道です。コピーしてから、違うところだけ直してください。</span>
    </div>` : '';
  // Googleマップの道案内は2通りの開き方を出す：通し（区切だけで切る）と、バス停ごと
  const legsWhole = rptLegs(false);
  const legsStop  = rptLegs(true);
  const legBtns = (arr, byStop) => arr.map((g,i)=>{
    const via=g.pts.length-2, over=via>RPT_MAX_VIA;
    return `<button class="mini" onclick="rptOpenLeg(${i},${byStop})" title="${escAttr(g.from)} から ${escAttr(g.to)} までをGoogleマップで開きます（目印${via}か所）"${over?' style="border-color:#c0392b;color:#c0392b;"':''}>${escHtml(g.from)} → ${escHtml(g.to)}${over?' ⚠':''}</button>`
         + (g.cut?`<span class="muted" style="font-size:11px;align-self:center;">✂ ここで案内を切る</span>`:'');
  }).join('');
  // バス停ごとが通しと同じ並びなら、2段に分けても意味がないので1段だけにする
  const sameAsWhole = (legsStop.length === legsWhole.length);
  const legRow = legsWhole.length ? `<div style="background:#f6faf7;border:1px solid #e2ede6;border-radius:8px;padding:9px 12px;margin-bottom:6px;">
      <div style="font-size:13px;color:#2d4a38;font-weight:700;margin-bottom:6px;">🗺 Googleマップで道を確かめる</div>
      <div style="font-size:12px;color:#6b7d72;margin-bottom:4px;">${legsWhole.length===1?'通し（全区間）':`通し（${legsWhole.length}区間・「区切」で分かれています）`}</div>
      <div class="line" style="gap:6px;flex-wrap:wrap;margin-bottom:${sameAsWhole?'0':'8px'};">${legBtns(legsWhole,false)}</div>
      ${sameAsWhole?'':`<div style="font-size:12px;color:#6b7d72;margin-bottom:4px;">バス停ごと（${legsStop.length}区間）</div>
      <div class="line" style="gap:6px;flex-wrap:wrap;">${legBtns(legsStop,true)}</div>`}
    </div>` : '';
  const legNote = legsWhole.length ? `<div class="muted" style="font-size:12px;margin:0 0 10px;">
        <b>有料道路・高速道路は使わない</b>設定で開きます。<b>「通し」は全体を1本で</b>、<b>「バス停ごと」は停留所で分けて</b>開きます（運転手がバス停ごとに開く想定）。<br>
        <b>「区切」は、Uターンなどナビが通してくれない場所で使います。</b>その地点で案内を終え、<b>次の地点から</b>新しい案内が始まります（間の動きは運転手が行います）。どちらの開き方でも区切は必ず効きます。<br>
        <b>狙った道を通らないときは、その手前に地点を足してください。</b>
        地点は<b>曲がった直後の道の上（曲がり角から50〜100m先）</b>に置くとよく効きます。交差点そのものに置くと、どの道に付くかGoogleが決めてしまい、手前で曲がることがあります。
        まっすぐな道には置かなくて構いません。${legsWhole.some(g=>g.pts.length-2>RPT_MAX_VIA)?'<br><span style="color:#c0392b;font-weight:700;">⚠ の区間は地点が多すぎるかもしれません（44か所までは通ることを確認済み）。反映されているかGoogleマップ側で確かめてください。</span>':''}
      </div>` : '';
  const orderWarn = rptOrderWarnings();
  const warnIdx = new Set(orderWarn.flatMap(w=>[w.a-1, w.b-1]));   // 0起点に直す
  const rows = pts.map((p,i)=>{
    const d=dist.byIdx[i];
    const on=(rptSelIdx===i);
    const warn=warnIdx.has(i);
    const ib='background:none;border:none;cursor:pointer;padding:3px 5px;font-size:16px;line-height:1;';
    const hasNote=!!(p.note||'').trim();
    const noteOpen=hasNote || rptNoteOpen[selRSeg+'|'+i];
    return `<tr class="rp-row" onclick="rptSelect(${i})" style="cursor:pointer;${on?'background:#eef4ef;':(warn?'background:#fff8e8;':'')}" title="${warn?'並び順が逆になっていないか確認してください':'この行を選ぶと、上に地点を差し込めます'}">
      <td class="muted" style="text-align:right;padding:5px 6px;font-size:14px;${warn?'color:#8a6d1a;font-weight:700;':''}">${warn?'⚠':''}${i+1}</td>
      <td style="padding:5px 6px;"><input type="text" class="rp-name" value="${escAttr(p.name||'')}" placeholder="例：○○交差点" style="width:100%;min-width:100px;font-size:15px;padding:7px 9px;"></td>
      <td style="padding:5px 6px;"><input type="text" class="rp-lat" value="${escAttr(p.lat)}" placeholder="35.xxxxxx" onchange="rptCoordIn(this)" title="「35.5442, 139.7043」のまま貼っても分けて入ります" style="width:112px;font-size:15px;padding:7px 9px;"></td>
      <td style="padding:5px 6px;"><input type="text" class="rp-lng" value="${escAttr(p.lng)}" placeholder="139.xxxxxx" onchange="rptCoordIn(this)" style="width:112px;font-size:15px;padding:7px 9px;"></td>
      <td style="text-align:center;padding:5px 6px;"><input type="checkbox" class="rp-stop" ${p.is_stop?'checked':''} onchange="rptRecalc()" title="実際に乗り降りするバス停ならチェック" style="width:18px;height:18px;"></td>
      <td style="text-align:center;padding:5px 6px;"><input type="checkbox" class="rp-cut" ${p.split_here?'checked':''} onchange="rptRecalc()" title="ここで道案内を切る（Uターンなど、次の地点まではナビに任せられない場所）" style="width:18px;height:18px;"></td>
      <td class="muted" style="white-space:nowrap;padding:5px 6px;font-size:14px;text-align:right;">${d&&d.seg!=null?d.seg.toFixed(2):''}</td>
      <td class="muted" style="white-space:nowrap;padding:5px 6px;font-size:14px;text-align:right;">${d?d.cum.toFixed(2):''}</td>
      <td style="white-space:nowrap;padding:5px 4px;text-align:right;">
        <button onclick="event.stopPropagation();rptNote(${i})" title="${hasNote?'注意書きあり':'注意書きを入れる'}" style="${ib}${hasNote?'color:#c0392b;':'color:#b9c7bd;'}">📝</button>
        <button onclick="event.stopPropagation();rptAdd(${i})" title="この行の上に地点を差し込む" style="${ib}color:var(--g);font-weight:700;">＋</button>
        <button onclick="event.stopPropagation();rptMove(${i},-1)" ${i===0?'disabled':''} title="上へ" style="${ib}color:var(--g);${i===0?'opacity:.3;cursor:default;':''}">▲</button>
        <button onclick="event.stopPropagation();rptMove(${i},1)" ${i===pts.length-1?'disabled':''} title="下へ" style="${ib}color:var(--g);${i===pts.length-1?'opacity:.3;cursor:default;':''}">▼</button>
        <button onclick="event.stopPropagation();rptDel(${i})" title="この地点を削除" style="${ib}color:#c0392b;">✕</button>
      </td>
    </tr>`
    + (noteOpen?`<tr><td></td><td colspan="8" style="padding:0 6px 8px;">
        <input type="text" class="rp-note" value="${escAttr(p.note||'')}" onchange="rptRecalc()"
          placeholder="この地点の注意書き（例：商店街は8:00過ぎ通行禁止／裏門チェーンキー No6022）"
          style="width:100%;font-size:14px;padding:7px 9px;border-color:#e8d9b0;background:#fffdf6;">
      </td></tr>`:'');
  }).join('');
  return `
    <div class="muted" style="font-size:13px;margin:2px 0 10px;line-height:1.8;">
      運転手のタブレットで<b>Googleマップの道案内</b>を開くための地点です。バスは道幅・長さの制約で通れる道が決まっているため、
      <b>曲がり角の手前に目印の地点を足す</b>ほど、狙った道を通らせやすくなります。<br>
      渋滞状況や到着予定時刻はGoogleマップ本体がその場で出すので、こちら側で経路の計算はしません（費用はかかりません）。
      この地点はこの<b>版</b>に属し、新版を作ると一緒に複製されます。
    </div>
    <div id="rptSticky" style="position:sticky;top:0;z-index:5;background:#fff;padding-top:6px;box-shadow:0 6px 8px -6px rgba(0,0,0,0.12);">
      <div class="line" style="gap:6px;margin-bottom:8px;flex-wrap:wrap;">${segBtns}</div>
      ${legRow}
    </div>
    ${scenRow}
    ${copyRow}
    ${legNote}
    <div class="line" style="gap:6px;margin-bottom:8px;flex-wrap:wrap;">
      ${_isKaisou(selRSeg) ? '' : '<button class="mini" onclick="rptFillFromStops()">②のバス停から並びを作る</button>'}
      <button class="mini" id="rptAddBtn" onclick="rptAdd()">${rptSelIdx==null?'＋ 最後に地点を追加':'＋ '+(rptSelIdx+1)+'番の上に差し込む'}</button>
    </div>
    <div class="muted" style="font-size:13px;margin:-4px 0 10px;line-height:1.8;">
      <b>間に差し込むには</b>：差し込みたい場所の<b>下の行をクリックして選ぶ</b>（薄い緑になります）→ 上の「◯番の上に差し込む」を押すと、その上に空欄の行が入ります。
      各行の <b>＋</b> でも同じことができます（その行の上に入ります）。<br>
      緯度・経度は、Googleマップで場所を右クリック→出てきた数字をコピーし、<b>緯度の欄にそのまま貼れば</b>2つに分かれて入ります。
    </div>
    ${valid>=2?`<div style="background:#f6faf7;border:1px solid #e2ede6;border-radius:8px;padding:9px 12px;margin-bottom:8px;">
      <span style="font-size:13px;color:#2d4a38;font-weight:700;">直線距離の積み上げ　${dist.total.toFixed(2)} km</span>
      <div class="muted" style="font-size:12px;margin-top:4px;">地点が疎らな区間があると、実際の道のりより短く出ます。曲がり角ごとに地点を足すほど実際に近づきます。</div>
    </div>`:''}
    ${orderWarn.length?`<div style="background:#fff8e8;border:1px solid #e8d9b0;border-radius:8px;padding:9px 12px;margin-bottom:8px;">
      <div style="font-size:13px;color:#8a6d1a;font-weight:700;margin-bottom:4px;">⚠️ 並び順が逆になっていませんか</div>
      <div style="font-size:12px;color:#8a6d1a;line-height:1.8;">
        ${orderWarn.map(w=>`<b>${w.a}番と${w.b}番</b>を入れ替えると <b>${w.km.toFixed(2)}km</b> 短くなります。`).join('<br>')}<br>
        <span class="muted" style="font-size:11px;">行き来する運行なら問題ありません。差し込む位置を1つ間違えたときにも出ます（「▲」で入れ替えられます）。</span>
      </div>
    </div>`:''}
    <div style="overflow-x:auto;"><table id="rptTable" style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead><tr style="background:#f6f9f7;">
        <th style="width:28px;"></th><th style="text-align:left;padding:7px 6px;font-size:13px;color:#6b7d72;">名前（任意）</th>
        <th style="text-align:left;padding:7px 6px;font-size:13px;color:#6b7d72;width:124px;">緯度</th>
        <th style="text-align:left;padding:7px 6px;font-size:13px;color:#6b7d72;width:124px;">経度</th>
        <th style="width:52px;padding:7px 6px;font-size:13px;color:#6b7d72;">バス停</th>
        <th style="width:52px;padding:7px 6px;font-size:13px;color:#6b7d72;" title="ここで道案内を切る（Uターンなど）">区切</th>
        <th style="width:64px;text-align:right;padding:7px 6px;font-size:13px;color:#6b7d72;">区間km</th>
        <th style="width:64px;text-align:right;padding:7px 6px;font-size:13px;color:#6b7d72;">累計km</th>
        <th style="width:124px;"></th>
      </tr></thead>
      <tbody>${rows||'<tr><td colspan="9" class="muted" style="padding:10px 6px;">まだ地点がありません。「②のバス停から並びを作る」で下書きを作れます。</td></tr>'}</tbody>
    </table></div>
    `;
}

/** うっかり全消しを防ぐ。保存は「消してから入れ直す」作りなので、
 *  入れ直す中身が空で、かつDBに中身があるときだけ確認をとる。
 *  （2026-08-19 六郷コースのバス停5件が、画面が空の状態の保存で消えた） */
async function _confirmWipe(path, newCount, label){
  if(newCount>0) return true;                       // 入れ直す中身があるなら従来どおり
  try{
    const r = await fetch(`${REST_URL}/${path}&select=id&limit=1`, { headers:getH() });
    if(!r.ok) return true;                          // 数えられないときは止めない
    const cur = await r.json();
    if(!Array.isArray(cur) || !cur.length) return true;   // もともと空なら確認不要
  }catch(e){ return true; }
  return confirm(`⚠️ ${label}が画面上で空になっています。\n\n`
    + `このまま保存すると、保存済みの${label}がすべて消えます。\n`
    + `画面がまだ読み込めていないだけの可能性があります。\n\n`
    + `本当に消してよろしいですか？`);
}

/* 保存が二重に走らないようにする鍵。
   2026-08-19：保存に反応が無いため何度も押され、1回目の「保存後の読み直し」が
   バッファを空にした瞬間に2回目がバス停を読み、空だと判断して削除してしまった。 */
let _saving = false;

async function saveCourse(){
  if(_saving){ _saveMsg('保存中です。そのままお待ちください。', false); return; }
  const c=_c(); if(!c) return;
  if(!selVerId){ _saveMsg('版がありません。まず版を作成してください。', false); return; }
  if(!isLatestVer()){ _saveMsg('過去版は保存できません。最新版を選ぶか、「新版を作成」してから編集してください。', false); return; }
  const key=String(c.id);
  // 押している間ずっと分かるようにする（無反応に見えて何度も押されるのを防ぐ）
  _saving = true;
  const _btn = document.getElementById('saveBtn');
  const _btnLabel = _btn ? _btn.textContent : '';
  if(_btn){ _btn.disabled = true; _btn.textContent = '⏳ 保存中… そのままお待ちください'; _btn.style.opacity = '0.7'; }
  _saveMsg('保存しています…', true);
  await ensureFreshToken();
  try{
    // 検証：時刻はあるのに日課名が空の行があれば中止（取りこぼし防止）
    if ((FORMS[key]||[]).some(f => !(f.form_name||'').trim() && (f.gekou_departures||[]).some(t=>t))){
      _saveMsg('日課名が空の行があります。A・B・C… の日課名を入れてから保存してください。', false); return;
    }
    // 1) 登校時刻・有効フラグ（courses）
    const r1 = await fetch(`${REST_URL}/courses?id=eq.${c.id}`, { method:'PATCH', headers:getH(), body:JSON.stringify({ toukou_shussha:c.toukou_shussha||null, toukou_shukko:c.toukou_shukko||null, active:c.active, after_toukou:c.after_toukou||'帰庫', after_toukou_place:(c.after_toukou==='他所移動'?(c.after_toukou_place||null):null), after_toukou_addr:(c.after_toukou==='他所移動'?(c.after_toukou_addr||null):null), after_toukou_coord:(c.after_toukou==='他所移動'?(c.after_toukou_coord||null):null), gekou_shukko_lead:(c.gekou_shukko_lead==null?null:c.gekou_shukko_lead), gekou_haisha_lead:(c.gekou_haisha_lead==null?null:c.gekou_haisha_lead) }) });
    if(!r1.ok){ const t=await r1.text(); _saveMsg('コース情報の保存に失敗：'+t.slice(0,100), false); return; }
    // 2) 下校フォーム（この年度・このコースを置き換え）
    const formsCount = (FORMS[key]||[]).filter(f=>(f.form_name||'').trim()).length;
    if(!(await _confirmWipe(`course_schedule_forms?version_id=eq.${selVerId}`, formsCount, '日課'))){ _saveMsg('保存を中止しました。', false); return; }
    await fetch(`${REST_URL}/course_schedule_forms?version_id=eq.${selVerId}`, { method:'DELETE', headers:getH() });
    const forms = (FORMS[key]||[]).filter(f=>(f.form_name||'').trim()).map(f=>({ course_id:c.id, version_id:selVerId, form_name:f.form_name.trim(), gekou_departures:(f.gekou_departures||[]).filter(t=>t), after_toukou:(f.after_toukou||'')||null, after_toukou_place:(f.after_toukou==='他所移動'?(f.after_toukou_place||null):null), after_toukou_addr:(f.after_toukou==='他所移動'?(f.after_toukou_addr||null):null), after_toukou_coord:(f.after_toukou==='他所移動'?(f.after_toukou_coord||null):null), dep_overrides:(f.dep_overrides&&Object.keys(f.dep_overrides).length)?f.dep_overrides:{} }));
    if(forms.length){ const r2=await fetch(`${REST_URL}/course_schedule_forms`, { method:'POST', headers:getH(), body:JSON.stringify(forms) }); if(!r2.ok){ const t=await r2.text(); _saveMsg('時程の保存に失敗：'+t.slice(0,100), false); return; } }
    // 3) バス停・ルート（このコースを置き換え）
    const stopsCount = (STOPS[key]||[]).filter(s=>(s.name||'').trim()||(s.address||'').trim()).length;
    if(!(await _confirmWipe(`course_locations?version_id=eq.${selVerId}`, stopsCount, 'バス停'))){ _saveMsg('保存を中止しました。', false); return; }
    await fetch(`${REST_URL}/course_locations?version_id=eq.${selVerId}`, { method:'DELETE', headers:getH() });
    let seq=0;
    const rows = (STOPS[key]||[]).filter(s=>(s.name||'').trim()||(s.address||'').trim()).map(s=>{
      const r = { course_id:c.id, version_id:selVerId, name:(s.name||'').trim()||(s.address||'').trim(), address:(s.address||'').trim(),
                  toukou_time:s.toukou_time||null, gekou_offset:(s.gekou_offset==null?null:s.gekou_offset), gekou_only:!!s.gekou_only, coord:s.coord||null, gekou_overrides:(s.gekou_overrides&&Object.keys(s.gekou_overrides).length)?s.gekou_overrides:{},
                  in_gekou:(s.gekou_offset!=null) };
      if(!s.gekou_only){ seq++; r.seq=seq; } else { r.seq=null; }
      return r;
    });
    if(rows.length){ const r3=await fetch(`${REST_URL}/course_locations`, { method:'POST', headers:getH(), body:JSON.stringify(rows) }); if(!r3.ok){ const t=await r3.text(); _saveMsg('バス停・ルートの保存に失敗：'+t.slice(0,100), false); return; } }
    // 3.5) 経路点（この版の4便ぶんをまとめて置き換え）
    rptSyncFromInputs();
    const rptRows=[];
    // 回送の鍵は「便|シナリオid|ルート名」。本線は便の名前だけ
    Object.keys(RPTS[key]||{}).forEach(kk=>{
      const { seg, scen, route } = _rkeyParse(kk);
      if(R_SEGS.indexOf(seg) < 0) return;
      const list=((RPTS[key]||{})[kk]||[]).filter(p=>String(p.lat).trim()!==''&&String(p.lng).trim()!=='');
      list.forEach((p,i)=>rptRows.push({ course_id:c.id, version_id:selVerId, segment:seg,
        scenario_id:scen, route_name:route, seq:i+1,
        name:(p.name||'').trim()||null, lat:Number(p.lat), lng:Number(p.lng), is_stop:!!p.is_stop, split_here:!!p.split_here, note:(p.note||'').trim()||null }));
    });
    if(!(await _confirmWipe(`course_route_points?version_id=eq.${selVerId}`, rptRows.length, '経路の地点'))){ _saveMsg('保存を中止しました。', false); return; }
    await fetch(`${REST_URL}/course_route_points?version_id=eq.${selVerId}`, { method:'DELETE', headers:getH() });
    if(rptRows.length){ const r35=await fetch(`${REST_URL}/course_route_points`, { method:'POST', headers:getH(), body:JSON.stringify(rptRows) }); if(!r35.ok){ const t=await r35.text(); _saveMsg('経路点の保存に失敗：'+t.slice(0,100), false); return; } }
    // 4) 送迎シナリオ（このコースを置き換え）— scenarios削除で points/settings も連動削除
    const scenHasContent = s => s.pts.some(p=>(p.name||'').trim()||(p.address||'').trim()||(p.coord||'').trim())
      || Object.keys(s.ps||{}).some(ph=>((s.ps[ph]||{}).shussha||'').trim()||((s.ps[ph]||{}).shukko||'').trim())
      || (s.label||'').trim();
    const scens = (SCEN[key]||[]).filter(scenHasContent);
    if(!(await _confirmWipe(`course_scenarios?course_id=eq.${c.id}`, scens.length, '添乗員送迎'))){ _saveMsg('保存を中止しました。', false); return; }

    /* ⚠️ シナリオの id は**残す**こと（2026-08-21 判明）。
       配置（`duties.scenario_id`）と回送の経路（`course_route_points.scenario_id`）が
       id で参照している。毎回 削除→作成 していたため、
       ・配置で選ばれている日があるとFK違反でDELETEが失敗し、重複が作られる
       ・回送の経路が道連れで消える（ON DELETE CASCADE）
       そこで「消えたものだけ削除・残るものは更新・新しいものだけ作成」に変えた */
    const keepIds = scens.map(s=>s.dbId).filter(Boolean);
    const delQ = keepIds.length
      ? `course_scenarios?course_id=eq.${c.id}&id=not.in.(${keepIds.join(',')})`
      : `course_scenarios?course_id=eq.${c.id}`;
    const rdel = await fetch(`${REST_URL}/${delQ}`, { method:'DELETE', headers:getH() });
    if(!rdel.ok){
      const t = await rdel.text();
      _saveMsg('使わなくなった添乗員送迎を消せませんでした：'+t.slice(0,120)
             + '／配置でその送迎が選ばれている日があると消せません。先に配置管理で外してください。', false);
      return;
    }

    const sidList = [];   // scens と同じ並びの scenario_id
    for(let i=0;i<scens.length;i++){
      const s = scens[i];
      const row = { course_id:c.id, segment:s.segment, label:(s.label||'').trim(), seq:i+1 };
      if(s.dbId){
        const r = await fetch(`${REST_URL}/course_scenarios?id=eq.${s.dbId}`, { method:'PATCH', headers:getH(), body:JSON.stringify(row) });
        if(!r.ok){ const t=await r.text(); _saveMsg('添乗員送迎の更新に失敗：'+t.slice(0,100), false); return; }
        sidList.push(s.dbId);
      }else{
        const r = await fetch(`${REST_URL}/course_scenarios`, { method:'POST', headers:getH(), body:JSON.stringify([row]) });
        if(!r.ok){ const t=await r.text(); _saveMsg('添乗員送迎の保存に失敗：'+t.slice(0,100), false); return; }
        const ins = await r.json();
        const nid = ins && ins[0] && ins[0].id;
        if(!nid){ _saveMsg('添乗員送迎の保存に失敗しました（idが返りません）。', false); return; }
        s.dbId = nid; sidList.push(nid);
      }
    }

    // 乗降場所と局面の設定は入れ替える（シナリオ本体が残るので、こちらは明示的に消す）
    await fetch(`${REST_URL}/course_transfer_points?course_id=eq.${c.id}`, { method:'DELETE', headers:getH() });
    if(sidList.length){
      await fetch(`${REST_URL}/course_phase_settings?scenario_id=in.(${sidList.join(',')})`, { method:'DELETE', headers:getH() });
      const allPts=[], allPs=[];
      scens.forEach((s,idx)=>{
        const sid = sidList[idx]; if(!sid) return;
        const seqByPhase={};
        s.pts.filter(p=>(p.name||'').trim()||(p.address||'').trim()||(p.coord||'').trim()).forEach(p=>{
          seqByPhase[p.phase]=(seqByPhase[p.phase]||0)+1;
          allPts.push({ course_id:c.id, scenario_id:sid, phase:p.phase, kind:p.kind||'乗車', seq:seqByPhase[p.phase],
                        name:(p.name||'').trim(), address:(p.address||'').trim(), coord:(p.coord||'').trim()||null,
                        bus_time:(s.segment==='下校'?null:(p.bus_time||null)), time_lead:(s.segment==='下校'?(p.time_lead==null?null:p.time_lead):null) });
        });
        Object.keys(s.ps||{}).forEach(ph=>{ const v=s.ps[ph]||{}; if((v.shussha||'').trim()||(v.shukko||'').trim()||v.shukko_lead!=null){ allPs.push({ scenario_id:sid, phase:ph, shussha:v.shussha||null, shukko:(s.segment==='下校'?null:(v.shukko||null)), shukko_lead:(s.segment==='下校'?(v.shukko_lead==null?null:v.shukko_lead):null) }); } });
      });
      if(allPts.length){ const rp=await fetch(`${REST_URL}/course_transfer_points`, { method:'POST', headers:getH(), body:JSON.stringify(allPts) }); if(!rp.ok){ const t=await rp.text(); _saveMsg('乗降場所の保存に失敗：'+t.slice(0,100), false); return; } }
      if(allPs.length){ const rq=await fetch(`${REST_URL}/course_phase_settings`, { method:'POST', headers:getH(), body:JSON.stringify(allPs) }); if(!rq.ok){ const t=await rq.text(); _saveMsg('局面の出社出庫の保存に失敗：'+t.slice(0,100), false); return; } }
    }
    // 保存後の読み直しは**このコースだけ**にする。
    // 以前は毎回64コース分（停留所331行・日課238行）を取り直しており、
    // 1回の保存に数秒かかって「押しても反応がない」状態になっていた（2026-08-19）
    await Promise.all([ loadVersionInto(c.id, selVerId), loadScenarios() ]);
    renderCourseList(); renderEditor();
    // ⚠️ 「保存しました」は**画面を作り直したあと**に出す。
    //    renderEditor() は編集欄をまるごと作り直すので、先に出すとメッセージごと消える。
    //    2026-08-19 に読み直しを速くしたことで、見える間もなく消えるようになっていた
    //    （2026-08-21 八重樫さんが「保存しましたが表示されませんでした」と発見）
    _saveMsg('✅ 保存しました', true);
  }catch(e){ _saveMsg('保存エラー：'+e.message, false); }
  finally{
    // どの抜け方をしても必ず鍵を外し、ボタンを戻す
    _saving = false;
    const b=document.getElementById('saveBtn');
    if(b){ b.disabled=false; b.textContent = _btnLabel || '💾 このコースを保存'; b.style.opacity=''; }
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  const ok = await initAuth(['super_admin','admin','operator','staff']);
  if (!ok) return;
  document.getElementById('courseSearch').addEventListener('input', renderCourseList);
  document.getElementById('activeOnly').addEventListener('change', renderCourseList);
  try{
    await loadCourses(); await loadVersions(); await loadStops(); await loadFormsLatest(); await loadScenarios(); await loadRoutePointsLatest();
    renderCourseList(); renderEditor();
    status('準備ができました。コースを選んでください。', true);
  }catch(e){ status('データ読み込みエラー：'+e.message, false); }
});

</script>
</body>
