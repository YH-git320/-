// ===== 高尾輸送サービス 管理システム 共通認証モジュール =====
// initAuth(['admin', 'staff'])  → 管理者・事務員どちらも可
// initAuth(['admin'])           → 管理者のみ

const AUTH_URL  = 'https://wxdyqkyqtizhtkwtpvru.supabase.co/auth/v1';
const REST_URL  = 'https://wxdyqkyqtizhtkwtpvru.supabase.co/rest/v1';

/* 🔴 権限の案内（2026-08-27 八重樫さん）。正本：業務管理システム_マスタ連動の原則

   > 権限では「指示のもとで編集する」と「自分で判断して編集する」を区別できません。
   > 区別できるのは「書けるか」「記録が残るか」「戻せるか」の3つだけです。（2026-08-27）

   ⚠️ ここは案内だけ。守っているのはデータベース側（RLS と RPC）。
      画面の判定だけに頼らない（画面は書き換えられる）。
   ⚠️ 権限が分からないときは止めない。止めるのはサーバーの役目。
      ここで止めると「通信できないだけ」で仕事が止まる。 */
const PAGE_PERM = { key: 'w_timetable', what: '運行時程マスタ' };
let MYPERM = null;
async function permLoad(){
  if (MYPERM) return MYPERM;
  try {
    const r = await fetch(`${REST_URL}/rpc/my_permissions`, { method:'POST', headers:getH(), body:'{}' });
    MYPERM = r.ok ? (await r.json() || []) : [];
  } catch(e){ MYPERM = []; }
  return MYPERM;
}
function permHas(key){
  if (!MYPERM || !MYPERM.length) return true;   // 分からないときは止めない
  const p = MYPERM.find(x => x.key === key);
  return p ? !!p.allowed : true;
}
function permLabel(key){
  const p = (MYPERM||[]).find(x => x.key === key);
  return p ? p.label : key;
}
/** 変更できないときに、画面の上に帯を出す（押す前に分かるように） */
async function permGuard(){
  if (!PAGE_PERM.key) return true;
  await permLoad();
  const keys = Array.isArray(PAGE_PERM.key) ? PAGE_PERM.key : [PAGE_PERM.key];
  if (keys.some(permHas)) return true;
  const names = keys.map(permLabel).join('・');
  const d = document.createElement('div');
  d.style.cssText = 'position:sticky;top:0;z-index:9999;background:#fdf2f2;border-bottom:2px solid #e0a9a2;'
    + 'color:#8c3b30;padding:10px 16px;font-size:13.5px;line-height:1.85;';
  d.innerHTML = '⚠️ <b>' + PAGE_PERM.what + 'を変更する権限がありません。</b>'

  document.body.insertBefore(d, document.body.firstChild);
  return false;
}
/** サーバーから返る英語のエラーを、何の権限が足りないかに言い換える */
const _PERM_TBL = {
  bicycle_parkings:'駐輪場', bicycle_parking_rates:'駐輪場の料金',

  return '「' + n + '」を変更する権限がありません。権限をお持ちの方にご相談ください。';
}

const ANON_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4ZHlxa3lxdGl6aHRrd3RwdnJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NzYxODEsImV4cCI6MjA5OTQ1MjE4MX0.yVbClXBk2JVeglevsBLY5sH2_m2ybCf71u4i_YYWyHE';

/* ===================== セッション管理 ===================== */

function _saveSession(data) {
  const session = {
    access_token:  data.access_token,
    refresh_token: data.refresh_token,
    expires_at:    data.expires_at || (Math.floor(Date.now() / 1000) + (data.expires_in || 3600)),
    user_id:       data.user?.id || data.user_id,
    email:         data.user?.email || data.email,
  };
  sessionStorage.setItem('takao_session', JSON.stringify(session));
  return session;
}

function _getSession() {
  try { return JSON.parse(sessionStorage.getItem('takao_session')); }
  catch { return null; }
}

function _clearSession() {
  sessionStorage.removeItem('takao_session');
  sessionStorage.removeItem('takao_role');
  sessionStorage.removeItem('takao_name');
  sessionStorage.removeItem('takao_permissions');
  sessionStorage.removeItem('takao_mfa_enforced');
}

// refresh_token でアクセストークンを更新する（成功=true）。長時間開いても保存が切れないように使う
async function refreshSession() {
  const s = _getSession();
  if (!s || !s.refresh_token) return false;
  try {
    const res = await fetch(`${AUTH_URL}/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    });
    if (!res.ok) return false;
    const data = await res.json();
    if (!data || !data.access_token) return false;
    _saveSession(data);
    return true;
  } catch { return false; }
}
// 期限が近い/切れていれば先に更新
async function ensureFreshToken() {
  const s = _getSession();
  if (s && s.expires_at && (s.expires_at - 60) < Math.floor(Date.now() / 1000)) {
    await refreshSession();
  }
}

function getPermissions() {
  try { return JSON.parse(sessionStorage.getItem('takao_permissions')) || {}; }
  catch { return {}; }
}

function isMfaEnforced() {
  return sessionStorage.getItem('takao_mfa_enforced') === 'true';
}

function _isExpired(session) {
  if (!session?.expires_at) return true;
  return Math.floor(Date.now() / 1000) > session.expires_at - 60;
}

function _authHeaders(token) {
  return {
    'Content-Type': 'application/json',
    'apikey': ANON_KEY,
    'Authorization': `Bearer ${token || ANON_KEY}`
  };
}

/* ===================== Supabase Auth API ===================== */

async function _refresh(session) {
  try {
    const res = await fetch(`${AUTH_URL}/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    if (!res.ok) return null;
    return _saveSession(await res.json());
  } catch { return null; }
}

async function _getRole(accessToken) {
  const cached = sessionStorage.getItem('takao_role');
  if (cached) return cached;
  try {
    const res = await fetch(`${REST_URL}/user_roles?select=role,display_name,permissions,mfa_enforced`, {
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${accessToken}` },
    });
    if (!res.ok) return null;
    const data = await res.json();
    const row = data[0];
    if (!row) return null;
    sessionStorage.setItem('takao_role', row.role);
    if (row.display_name) sessionStorage.setItem('takao_name', row.display_name);
    if (row.permissions) sessionStorage.setItem('takao_permissions', JSON.stringify(row.permissions));
    if (row.mfa_enforced != null) sessionStorage.setItem('takao_mfa_enforced', String(row.mfa_enforced));
    return row.role;
  } catch { return null; }
}

/* ===================== 公開 API ===================== */

/**
 * ログアウト
 */
async function signOut() {
  const session = _getSession();
  if (session?.access_token) {
    fetch(`${AUTH_URL}/logout`, {
      method: 'POST',
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${session.access_token}` },
    }).catch(() => {});
  }
  _clearSession();
  window.location.href = 'login.html';
}

/**
 * パスワード変更（ログイン中のユーザー自身）
 */
async function changePassword(newPassword) {
  const session = _getSession();
  if (!session?.access_token) return { ok: false, error: 'セッションが無効です' };
  try {
    const res = await fetch(`${AUTH_URL}/user`, {
      method: 'PUT',
      headers: _authHeaders(session.access_token),
      body: JSON.stringify({ password: newPassword })
    });
    if (res.ok) return { ok: true };
    const d = await res.json();
    return { ok: false, error: d.msg || d.message || 'パスワード変更に失敗しました' };
  } catch (e) {
    return { ok: false, error: 'ネットワークエラー: ' + e.message };
  }
}

/**
 * TOTP登録開始（QRコードURIを返す）
 */
async function enrollTotp() {
  let session = _getSession();
  if (!session?.access_token) return { ok: false, error: 'セッションが無効です' };

  // セッションの有効期限が近い場合はリフレッシュ
  if (_isExpired(session)) {
    session = await _refresh(session);
    if (!session) return { ok: false, error: 'セッションの更新に失敗しました。再ログインしてください。' };
  }

  try {
    // 未確認（unverified）のTOTPファクターのみ削除（確認済みのものは絶対に削除しない）
    const listRes = await fetch(`${AUTH_URL}/factors`, {
      headers: _authHeaders(session.access_token)
    });
    if (listRes.ok) {
      const factors = await listRes.json();
      if (Array.isArray(factors)) {
        // 確認済みファクターが既にある場合はエラーを返す
        const verified = factors.find(f => f.factor_type === 'totp' && f.status === 'verified');
        if (verified) {
          return { ok: false, error: '二段階認証はすでに設定済みです。一度「解除する」してから再設定してください。' };
        }
        // 未確認ファクターのみ削除
        for (const f of factors) {
          if (f.factor_type === 'totp' && f.status === 'unverified') {
            await fetch(`${AUTH_URL}/factors/${f.id}`, {
              method: 'DELETE',
              headers: _authHeaders(session.access_token)
            });
          }
        }
      }
    }

    const res = await fetch(`${AUTH_URL}/factors`, {
      method: 'POST',
      headers: _authHeaders(session.access_token),
      body: JSON.stringify({ factor_type: 'totp', friendly_name: '高尾輸送サービス', issuer: '高尾輸送サービス' })
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      const msg = errData.msg || errData.message || errData.error_description || errData.code || `エラー(${res.status})`;
      return { ok: false, error: 'QRコードの生成に失敗しました: ' + msg };
    }
    const d = await res.json();
    return { ok: true, factorId: d.id, totpUri: d.totp?.uri, secret: d.totp?.secret };
  } catch (e) {
    return { ok: false, error: 'ネットワークエラー: ' + e.message };
  }
}

/**
 * TOTP登録確認（初回コード検証）
 */
async function verifyTotpEnrollment(factorId, code) {
  const session = _getSession();
  if (!session?.access_token) return { ok: false, error: 'セッションが無効です' };
  try {
    const chRes = await fetch(`${AUTH_URL}/factors/${factorId}/challenge`, {
      method: 'POST', headers: _authHeaders(session.access_token), body: JSON.stringify({})
    });
    if (!chRes.ok) return { ok: false, error: 'チャレンジ作成に失敗しました' };
    const { id: challengeId } = await chRes.json();

    const vRes = await fetch(`${AUTH_URL}/factors/${factorId}/verify`, {
      method: 'POST',
      headers: _authHeaders(session.access_token),
      body: JSON.stringify({ challenge_id: challengeId, code })
    });
    if (!vRes.ok) return { ok: false, error: 'コードが正しくありません。もう一度お試しください。' };
    _saveSession(await vRes.json());
    return { ok: true };
  } catch (e) {
    return { ok: false, error: 'ネットワークエラー: ' + e.message };
  }
}

/**
 * 登録済みTOTPファクター一覧
 */
async function getEnrolledFactors() {
  const session = _getSession();
  if (!session?.access_token) return [];
  try {
    const res = await fetch(`${AUTH_URL}/factors`, {
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${session.access_token}` }
    });
    if (!res.ok) return [];
    const factors = await res.json();
    return Array.isArray(factors) ? factors.filter(f => f.factor_type === 'totp' && f.status === 'verified') : [];
  } catch { return []; }
}

/**
 * TOTP解除
 */
async function unenrollTotp(factorId) {
  const session = _getSession();
  if (!session?.access_token) return { ok: false };
  try {
    const res = await fetch(`${AUTH_URL}/factors/${factorId}`, {
      method: 'DELETE',
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${session.access_token}` }
    });
    return { ok: res.ok };
  } catch { return { ok: false }; }
}

/**
 * 認証チェック（各ページのDOMContentLoaded前に呼ぶ）
 */
async function initAuth(allowedRoles) {
  document.documentElement.style.visibility = 'hidden';
  try {
    let session = _getSession();
    if (!session) { _redirectLogin(); return false; }
    if (_isExpired(session)) {
      session = await _refresh(session);
      if (!session) { _clearSession(); _redirectLogin(); return false; }
    }
    const role = await _getRole(session.access_token);
    if (!role || !allowedRoles.includes(role)) {
      _showDenied(role);
      document.documentElement.style.visibility = 'visible';
      return false;
    }
    _injectUserInfo(session.email, role);
    _injectModals();
    document.documentElement.style.visibility = 'visible';
    return true;
  } catch (err) {
    console.error('[auth.js] initAuth error:', err);
    document.documentElement.style.visibility = 'visible';
    return false;
  }
}

/* ===================== 内部ヘルパー ===================== */

  document.documentElement.style.visibility = 'visible';

}

          <button onclick="signOut()" style="background:#eef7f1;color:#4d7a5e;border:1px solid #b4d4c0;

function _injectUserInfo(email, role) {
  const header = document.querySelector('header');

/* ===================== パスワード変更 ===================== */

function showPasswordChangeModal() {
  _injectModals();
  document.getElementById('_tm_pw_new').value = '';
  document.getElementById('_tm_pw_conf').value = '';
  document.getElementById('_tm_pw_err').style.display = 'none';
  document.getElementById('_tm_pw_ok').style.display = 'none';
  document.getElementById('_tm_pw').classList.add('open');
  setTimeout(() => document.getElementById('_tm_pw_new').focus(), 100);
}

function closePasswordChangeModal() {
  document.getElementById('_tm_pw').classList.remove('open');
}

async function _doChangePassword() {
  const np   = document.getElementById('_tm_pw_new').value;
  const conf = document.getElementById('_tm_pw_conf').value;
  const err  = document.getElementById('_tm_pw_err');
  const ok   = document.getElementById('_tm_pw_ok');
  const btn  = document.getElementById('_tm_pw_btn');
  err.style.display = 'none';
  ok.style.display = 'none';
  if (np.length < 8) { err.textContent = 'パスワードは8文字以上で設定してください'; err.style.display = 'block'; return; }
  if (np !== conf)   { err.textContent = 'パスワードが一致しません'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = '変更中…';
  const result = await changePassword(np);
  btn.disabled = false; btn.textContent = '変更する';
  if (result.ok) {
    ok.style.display = 'block';
    document.getElementById('_tm_pw_new').value = '';
    document.getElementById('_tm_pw_conf').value = '';
    setTimeout(() => closePasswordChangeModal(), 2000);
  } else {
    err.textContent = result.error; err.style.display = 'block';
  }
}

/* ===================== 二段階認証設定 ===================== */

let _totpFactorId = null;

async function showTotpSetupModal() {
  _injectModals();
  _showTotpStep0();
  document.getElementById('_tm_totp_err').style.display = 'none';
  document.getElementById('_tm_totp_ok').style.display = 'none';
  document.getElementById('_tm_totp').classList.add('open');

  const status = document.getElementById('_tm_totp_status');
  const startBtn  = document.getElementById('_tm_totp_start_btn');
  const disableBtn = document.getElementById('_tm_totp_disable_btn');
  status.textContent = '状態を確認中...';
  startBtn.style.display = 'none';
  disableBtn.style.display = 'none';

  const factors = await getEnrolledFactors();
  const role = sessionStorage.getItem('takao_role');
  const canDisable = !isMfaEnforced() || role === 'super_admin';
  if (factors.length > 0) {
    _totpFactorId = factors[0].id;
    if (canDisable) {
      status.textContent = '✅ 二段階認証は有効です。認証アプリが設定されています。';
      disableBtn.style.display = 'block';
    } else {
      status.textContent = '✅ 二段階認証は有効です（組織の設定により解除できません）。';
      disableBtn.style.display = 'none';
      const lockNote = document.getElementById('_tm_totp_lock_note');
      if (lockNote) lockNote.style.display = 'block';
    }
  } else {
    status.textContent = '二段階認証は現在無効です。設定するとログイン時にアプリのコード入力が必要になります。';
    startBtn.style.display = 'block';
  }
}

function closeTotpSetupModal() {
  document.getElementById('_tm_totp').classList.remove('open');
}

function _showTotpStep0() {
  ['_tm_totp_s0','_tm_totp_s1','_tm_totp_s2'].forEach((id, i) => {
    document.getElementById(id).classList.toggle('active', i === 0);
  });
}
function _showTotpStep1() {
  ['_tm_totp_s0','_tm_totp_s1','_tm_totp_s2'].forEach((id, i) => {
    document.getElementById(id).classList.toggle('active', i === 1);
  });
}
function _showTotpStep2() {
  document.getElementById('_tm_totp_code').value = '';
  ['_tm_totp_s0','_tm_totp_s1','_tm_totp_s2'].forEach((id, i) => {
    document.getElementById(id).classList.toggle('active', i === 2);
  });
  setTimeout(() => document.getElementById('_tm_totp_code').focus(), 100);
}

async function _startTotpSetup() {
  const startBtn = document.getElementById('_tm_totp_start_btn');
  const err = document.getElementById('_tm_totp_err');
  err.style.display = 'none';
  startBtn.disabled = true; startBtn.textContent = 'QRコード生成中…';

  const result = await enrollTotp();
  startBtn.disabled = false; startBtn.textContent = 'QRコードを表示して設定開始';
  if (!result.ok) { err.textContent = result.error; err.style.display = 'block'; return; }

  _totpFactorId = result.factorId;
  document.getElementById('_tm_totp_secret').textContent = result.secret || '';

  // QRコード描画
  const canvas = document.getElementById('_tm_qr_canvas');
  canvas.innerHTML = '';
  _loadQRLib(() => {
    new QRCode(canvas, { text: result.totpUri, width: 200, height: 200,
      colorDark: '#2d4a36', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  });

  _showTotpStep1();
}

async function _verifyTotpSetup() {
  const code = document.getElementById('_tm_totp_code').value.replace(/\D/g, '');
  const err  = document.getElementById('_tm_totp_err');
  const ok   = document.getElementById('_tm_totp_ok');
  const btn  = document.getElementById('_tm_totp_verify_btn');
  err.style.display = 'none';
  if (code.length !== 6) { err.textContent = '6桁のコードを入力してください'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = '確認中…';
  const result = await verifyTotpEnrollment(_totpFactorId, code);
  btn.disabled = false; btn.textContent = '設定を完了する';
  if (result.ok) {
    ok.textContent = '✅ 二段階認証の設定が完了しました！次回ログインからコード入力が必要になります。';
    ok.style.display = 'block';
    _showTotpStep0();
    document.getElementById('_tm_totp_status').textContent = '✅ 二段階認証は有効です。認証アプリが設定されています。';
    document.getElementById('_tm_totp_start_btn').style.display = 'none';
    document.getElementById('_tm_totp_disable_btn').style.display = 'block';
  } else {
    err.textContent = result.error; err.style.display = 'block';
  }
}

async function _disableTotp() {
  const role = sessionStorage.getItem('takao_role');
  if (isMfaEnforced() && role !== 'super_admin') {
    alert('組織のポリシーにより二段階認証は解除できません。');
    return;
  }
  if (!confirm('二段階認証を解除しますか？\nログイン時のコード入力が不要になります。')) return;
  const result = await unenrollTotp(_totpFactorId);
  const err = document.getElementById('_tm_totp_err');
  const ok  = document.getElementById('_tm_totp_ok');
  if (result.ok) {
    ok.textContent = '二段階認証を解除しました。';
    ok.style.display = 'block';
    document.getElementById('_tm_totp_status').textContent = '二段階認証は現在無効です。';
    document.getElementById('_tm_totp_start_btn').style.display = 'block';
    document.getElementById('_tm_totp_disable_btn').style.display = 'none';
  } else {
    err.textContent = '解除に失敗しました。'; err.style.display = 'block';
  }
}

function _loadQRLib(cb) {
  if (window.QRCode) { cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload = cb;
  document.head.appendChild(s);
}

// 時刻テキスト欄を HH:MM に整形して返す（欄を離れた/変更した時に呼ぶ）。空はそのまま''。
function tnorm(el){
  let v=String(el.value||'').trim(); if(!v){ el.value=''; return ''; }
  let h,m;
  if(v.indexOf(':')>=0){ const p=v.split(':'); h=parseInt(p[0],10); m=parseInt(p[1]||'0',10); }
  else { const d=v.replace(/\D/g,''); if(!d){ el.value=''; return ''; }
    if(d.length<=2){ h=parseInt(d,10); m=0; }
    else if(d.length===3){ h=parseInt(d.slice(0,1),10); m=parseInt(d.slice(1),10); }
    else { h=parseInt(d.slice(0,2),10); m=parseInt(d.slice(2,4),10); } }
  if(isNaN(h)){ el.value=''; return ''; } if(isNaN(m)) m=0;
  if(h>23)h=23; if(h<0)h=0; if(m>59)m=59; if(m<0)m=0;
  const out=('0'+h).slice(-2)+':'+('0'+m).slice(-2); el.value=out; return out;
}

   gekou_seq が空のバス停（古いデータ・追加直後）は末尾に回す。 */
function _gekouIdx(){

    const B = (stops[b].gekou_seq==null) ? 99999 : stops[b].gekou_seq;

function _cmpForm(a,b){
  const cat=n=>{n=n||''; return n.indexOf('通常')===0?0:n.indexOf('小1')===0?1:n.indexOf('短縮')===0?2:n.indexOf('午前')===0?3:9;};
  const fmin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||''); return m?(+m[1]*60+ +m[2]):1e9;};
  const first=d=>{let x=1e9;(d||[]).forEach(t=>{const v=fmin(t);if(v<x)x=v;});return x;};
  const ca=cat(a.form_name),cb=cat(b.form_name); if(ca!==cb)return ca-cb;
  if(ca===9)return String(a.form_name||'').localeCompare(String(b.form_name||''),'ja');
  const fa=first(a.gekou_departures),fb=first(b.gekou_departures); if(fa!==fb)return fa-fb;
  const na=(a.gekou_departures||[]).length,nb=(b.gekou_departures||[]).length; if(na!==nb)return na-nb;
  return String(a.form_name||'').localeCompare(String(b.form_name||''),'ja');
}

/* 🔴 版は3つに分かれる（2026-08-27 八重樫さん・岩﨑さんのご質問から）

   > 〇月〇日に変更の編集をしたあと、その日が来るまでの間は
   > サイトの画面で新しい情報しか見れないのか（岩﨑さん）

   いままでは「いちばん新しい版」を既定で開いていた。
   ⚠️ 9月1日の版を作ると、8月中も9月1日の版が出て、いま走っている内容が見えない。
   ⚠️ しかも「最新版でなければ保存できない」ため、8月中に今の内容を訂正できなかった。

   過去      もう使い終わった版      見るだけ
   適用中    今日の時点で有効な版    ⚠️ 訂正できる（まだ走っているため）
   これから  先日付の版              編集できる

   既定で開くのは「適用中」。通勤経路の到着地で案Bを選ばれたのと同じ考え方
   （いま走っているものを既定にする）。 */
function _today(){ return _dstr(new Date()); }

/** 今日の時点で有効な版。無ければいちばん古い版（すべて先日付のとき） */
function currentVerId(cid){
  const a = _vers(cid);                    // valid_from の新しい順
  if(!a.length) return null;
  const t = _today();
  const hit = a.find(v => String(v.valid_from) <= t);
  return hit ? hit.id : a[a.length-1].id;
}

/** その版がどれか（'過去' / '適用中' / 'これから'） */
function verState(v, cid){
  if(!v) return '';
  if(String(v.valid_from) > _today()) return 'これから';
  return (v.id === currentVerId(cid)) ? '適用中' : '過去';
}

/** 編集してよい版か。適用中とこれからは編集できる。過去は見るだけ */
function canEditVer(){
  const c = _c(); if(!c || selVerId == null) return false;
  const v = _vers(c.id).find(x => x.id === selVerId);
  return verState(v, c.id) !== '過去';
}

      条件はデータベース側でもう一度確かめる（画面の判定だけに頼らない）。 */

  const c=_c(); if(!c || !selVerId) return;
  const v=_vers(c.id).find(x=>x.id===selVerId);

      body:JSON.stringify({ p_version_id:selVerId }) });
    if(r.ok) chk=await r.json();
  }catch(e){}
  if(!chk){ _saveMsg('消せるかどうかを確かめられませんでした。', false); return; }
  if(!chk.ok){ _saveMsg('この版は消せません：'+(chk.reason||'理由不明'), false); return; }

  const msg = `⚠️ ${chk.valid_from} からの版を消します。\n\n`
    + `　一緒に消えるもの\n`
    + `　　日課 ${chk.forms||0}件\n`
    + `　　バス停 ${chk.stops||0}件\n`
    + `　　④ルート詳細 ${chk.route_points||0}件\n\n`
    + (chk.is_future
        ? 'この版はまだ始まっていません。便や配置には影響しません。\n\n'
        : `この期間の便 ${chk.duties||0}件・配置 ${chk.crew||0}件はそのまま残ります。\n`
          + '⚠️ ただし、その前提となる時程が無くなります。\n\n')
    + '元に戻せません。よろしいですか。';
  if(!confirm(msg)) return;

  try{
    const r=await fetch(`${REST_URL}/rpc/delete_version`, { method:'POST', headers:getH(),
      body:JSON.stringify({ p_version_id:selVerId }) });
    const txt=await r.text();
    if(!r.ok){ let j={}; try{ j=JSON.parse(txt); }catch(e){}
      _saveMsg('消せませんでした（元のデータは残っています）：'+((j&&j.message)||txt).slice(0,140), false); return; }
    const d=JSON.parse(txt);
    await loadVersions();
    selVerId = currentVerId(c.id);
    _editMode=null; _fixReason=''; _impact=null; _editOpen=false;
    if(selVerId) await loadVersionInto(c.id, selVerId);
    selRefD=_refDeparture()||'14:00';
    renderEditor(); _loadImpact().then(_renderEditBar);
    _saveMsg(`✅ ${d.valid_from} からの版を消しました（日課 ${d.forms||0}・バス停 ${d.stops||0}・④ルート詳細 ${d.route_points||0} も一緒に）。`, true);
  }catch(e){ _saveMsg('版を消せませんでした：'+e.message, false); }
}

/* 🔴 消えるものを名指しで見せてから進む（2026-08-27 八重樫さん）

   いままでの _confirmWipe は「入れ直す中身が空」のときだけ聞いていた。
   ⚠️ 5件が4件になっても素通りする。2026-08-26 に湘南 西コースの「河内」、
      2026-08-27 に金沢 みずいろコースの「金沢支援学校（下校専用）」が
      どちらも黙って消えた（後者は意図した削除だった）。

   ⚠️ バス停は同じ名前で2行ある（登校用・下校専用）。名前だけで突き合わせない。
      2026-08-21 と 2026-08-26 に2回踏んだ誤り。 */
async function _confirmDrop(path, select, newKeys, label, mkKey, mkLabel){
  let cur;
  try{
    const r = await fetch(`${REST_URL}/${path}&select=${select}`, { headers:getH() });
    if(!r.ok) return true;                       // 数えられないときは止めない
    cur = await r.json();
  }catch(e){ return true; }
  if(!Array.isArray(cur) || !cur.length) return true;

  const now = new Set(newKeys);
  const gone = cur.filter(x => !now.has(mkKey(x)));
  if(!gone.length) return true;                  // 減っていないなら聞かない

  const all = (gone.length === cur.length);
  return confirm(
    (all ? `⚠️ ${label}が全部（${cur.length}件）消えます。\n\n`
         : `⚠️ ${label}が ${cur.length}件 → ${cur.length - gone.length}件 になります。\n\n`)
    + `消えるのは：\n　・${gone.map(mkLabel).join('\n　・')}\n\n`
    + (all ? '画面がまだ読み込めていないだけの可能性があります。\n\n' : '')
    + 'よろしいですか。');
}

/* 適用開始日の候補。年度替わりだけでなく学期の変更にも使うため（2026-08-27） */
function _dstr(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function _tomorrow(){ const d=new Date(); d.setDate(d.getDate()+1); return _dstr(d); }
function _nextMonth1(){ const d=new Date(); return _dstr(new Date(d.getFullYear(), d.getMonth()+1, 1)); }
function _setNvDate(v){ const el=document.getElementById('nvDate'); if(el) el.value=v; }

async function createVersion(){
  const c=_c(); if(!c) return;
  const vf=(document.getElementById('nvDate')||{}).value||'';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(vf)){ _saveMsg('適用開始日を選んでください', false); return; }
  if(_vers(c.id).some(v=>String(v.valid_from)===vf)){ _saveMsg('その適用開始日の版が既にあります', false); return; }
  const sv=((document.getElementById('nvSource')||{}).value||'').split(':').map(Number);
  const srcVid=sv[1];
  if(!srcVid){ _saveMsg('コピー元を選んでください', false); return; }
  const note=((document.getElementById('nvNote')||{}).value||'').trim();
  await ensureFreshToken();

  /* 🔴 遡って作れるようにする。ただし過去の便は作り直さない（2026-08-27 八重樫さん）
     > 入力当日より遡ることも一応できるようにしてください。入力が間に合わなかった
     > という可能性もあるためです。ただ、その時は〇〇件のデータに反映しています。
     ⚠️ 「そのままです」と先に言っておかないと、あとで「反映されていない」と見える */
  if(vf < _dstr(new Date())){
    let im = null;
    try{
      const r=await fetch(`${REST_URL}/rpc/backdate_impact`, { method:'POST', headers:getH(),
        body:JSON.stringify({ p_course_id:c.id, p_from:vf }) });
      if(r.ok) im = await r.json();
    }catch(e){}
    const msg = `⚠️ ${vf} は今日より前です。\n\n`
      + (im ? `　${vf} 〜 昨日の ${im.kept_duties||0}便（配置 ${im.kept_crew||0}件）は、そのままです。\n`
            + `　　すでに起きたこととして残します。\n`
            + `　今日から先の ${im.next_duties||0}便に反映します。\n\n`
          : '　過去の便はそのまま残ります。今日から先の便に反映します。\n\n')
      + 'このまま作りますか。';
    if(!confirm(msg)) return;
  }

  /* 2026-08-27：版づくりと複製を1つの処理にまとめた（00_データを壊さない書き方）。
     途中で止まっても、中身の欠けた版が残らない */
  try{
    const r = await fetch(`${REST_URL}/rpc/create_version_copy`, { method:'POST', headers:getH(),
      body: JSON.stringify({ p_course_id:c.id, p_valid_from:vf, p_src_version_id:srcVid, p_note:note||null }) });
    const txt = await r.text();
    if(!r.ok){ let j={}; try{ j=JSON.parse(txt); }catch(e){}
      _saveMsg('版を作れませんでした（元のデータはそのままです）：'+((j&&j.message)||txt).slice(0,140), false); return; }
    const d = JSON.parse(txt);
    const newId = Array.isArray(d) ? (d[0]&&d[0].version_id) : (d&&d.version_id);
    if(!newId){ _saveMsg('版を作れませんでした（番号が返りません）。', false); return; }

    await loadVersions(); selVerId=newId; await loadVersionInto(c.id, newId);
    _nvOpen=false; selRefD=_refDeparture()||'14:00';
    _editMode='new'; _fixReason=''; _impact=null; _editOpen=true;   /* 作った直後はそのまま編集できる */
    renderEditor(); _loadImpact().then(_renderEditBar);
    _saveMsg(`✅ ${vf} からの版を作りました`
      + `（日課 ${d.forms||0}・バス停 ${d.stops||0}・④ルート詳細 ${d.route_points||0} を写しました）。`
      + `内容を確認して保存してください。`, true);
  }catch(e){ _saveMsg('版作成エラー：'+e.message, false); }
}

/* 🔴 作業を遡る（2026-09-02 岩﨑さん → 八重樫さん）

   > 作業を遡るボタンは作れますか。保存をしたらそれ以上は遡らなくて結構ですが、
   > ワードやエクセルの遡るボタンのような機能です。

   決めたこと（八重樫さん）
     遡る単位   ボタンは1回ぶん／文字は「欄ごと」（1文字ずつではない）
     回数       50回
     置き場所   タブの並びの右端
     やり直し   作らない（入れると作りが倍になり、間違いも増える）

   ⚠️ 控えを取る場所は**1か所だけ**にする。
      直す関数を1つずつ書き換えると必ず取り漏らす（今日それで8回やり直した）。
      editorArea の中で「押した・欄に入った」瞬間を、まとめて捕まえる。
   ⚠️ 遡ってもDBには一切触れない。画面の中だけ。保存すると控えは消える。 */
const UNDO_MAX = 50;
let UNDO = [];            // [{ t: 何をする前か, s: 控え(JSON) }]

/** いま編集中のコースの中身を、まるごと文字にする */
function _undoSnap(){
  const c = _c(); if(!c) return null;
  const k = String(c.id);
  try{
    return JSON.stringify({
      c: c,
      forms: FORMS[k] || null,
      stops: STOPS[k] || null,
      rpts:  RPTS[k]  || null,
      scen:  SCEN[k]  || null,
      ren:   (typeof FORM_RENAMES !== 'undefined' ? (FORM_RENAMES[k] || null) : null)
    });
  }catch(e){ return null; }
}
/** 控えを1つ積む。⚠️ 呼ばれた時点では積まない。
    「何も変わっていないのに戻せると出る」のを避けるため、
    あとで見比べて、**本当に変わっていたときだけ**積む
    （2026-09-02 八重樫さん「編集していない気がします。1つ遡るというのは何か入力したのでしょうか」）。 */
function _undoCommit(before){
  if(before == null) return;
  const after = _undoSnap();
  if(after == null || after === before) return;              // 変わっていない → 積まない
  if(UNDO.length && UNDO[UNDO.length-1].s === before) return; // 同じものを二重に積まない
  UNDO.push({ s: before });
  if(UNDO.length > UNDO_MAX) UNDO.shift();
  _undoPaint();
}
/** 押した直後に見比べる（押した処理は同じ流れの中で終わるので、次の順番で足りる） */
function _undoPush(label){
  const before = _undoSnap(); if(before == null) return;
  setTimeout(function(){ _undoCommit(before); }, 0);
}
/** 1つ前に戻す */
function undoStep(){
  if(!UNDO.length) return;
  const top = UNDO.pop();
  let o; try{ o = JSON.parse(top.s); }catch(e){ _undoPaint(); return; }
  const c = _c(); if(!c){ _undoPaint(); return; }
  const k = String(c.id);
  /* ⚠️ コースの行は入れ替えず、中身だけ書き戻す。
     　 入れ替えると、他の場所が持っている参照が古いものを指したままになる。 */
  Object.keys(o.c).forEach(function(f){ c[f] = o.c[f]; });
  if(o.forms) FORMS[k] = o.forms; else delete FORMS[k];
  if(o.stops) STOPS[k] = o.stops; else delete STOPS[k];
  if(o.rpts)  RPTS[k]  = o.rpts;  else delete RPTS[k];
  if(o.scen)  SCEN[k]  = o.scen;  else delete SCEN[k];
  if(typeof FORM_RENAMES !== 'undefined'){ if(o.ren) FORM_RENAMES[k] = o.ren; else delete FORM_RENAMES[k]; }
  renderEditor();
  _saveMsg('1つ前に戻しました' + (UNDO.length ? '' : '（これ以上は戻れません）')
    + '　⚠️ 保存はしていません。', true);
}
/** 控えを捨てる（保存した・コースを変えた・版を変えたとき） */
function undoClear(){ UNDO = []; _undoPaint(); }

/** ボタンの見た目を合わせる */
function _undoPaint(){
  const b = document.getElementById('undoBtn');
  if(!b) return;
  const n = UNDO.length;
  b.disabled = !n;
  b.style.opacity = n ? '1' : '0.45';
  b.style.cursor = n ? 'pointer' : 'default';
  /* ⚠️ 回数は出さない（2026-09-02 八重樫さん「必要ないように思います」）。
     押せるかどうかは、濃さで分かるようにしてある。 */
  b.textContent = '↩ 戻す';
  b.title = n ? '1つ前の状態に戻します（保存すると戻せなくなります）'
              : '戻せる作業がありません';
}
function undoBtnHtml(){
  return '<button id="undoBtn" onclick="undoStep()" disabled'
    + ' style="margin-left:auto;border:1px solid #cfe0d5;background:#fff;color:#2d4a38;'
    + 'padding:7px 13px;border-radius:9px;font-size:13px;font-family:inherit;opacity:0.45;cursor:default;"'
    + ' title="戻せる作業がありません">↩ 戻す</button>';
}

/* ⚠️ 控えを取るのはここ1か所だけ。
   　 click は「押す前」に、focusin は「その欄に入った時点」に控える。
   　 どちらも capture（先に届く側）で受けるので、画面が変わる前の姿が残る。 */
(function(){
  let armed = false;
  let pendFocus = null;   // その欄に入った時点の姿
  function arm(){
    if(armed) return;
    const area = document.getElementById('editorArea');
    if(!area) return;
    area.addEventListener('click', function(e){
      /* 戻すボタン自身では控えない */
      if(e.target && e.target.id === 'undoBtn') return;
      _undoPush('押す前');
    }, true);
    /* ⚠️ 文字は「欄に入った時点」を控え、**欄を離れたとき**に見比べる。
       押した直後に見比べると、まだ何も打っていないので必ず「変わっていない」になる。 */
    area.addEventListener('focusin', function(e){
      const t = e.target;
      if(!t || !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
      pendFocus = _undoSnap();
    }, true);
    area.addEventListener('focusout', function(e){
      const t = e.target;
      if(!t || !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
      const p = pendFocus; pendFocus = null;
      setTimeout(function(){ _undoCommit(p); }, 0);
    }, true);
    armed = true;
  }
  if(document.readyState === 'loading') window.addEventListener('DOMContentLoaded', arm);
  else arm();
  /* editorArea は作り直されないので（中身だけ差し替わる）、一度付ければ足りる */
})();

function renderEditor(){
  const area = document.getElementById('editorArea');
  if (!selCourseId){ area.innerHTML = '<div class="panel"><p class="muted">左からコースを選んでください。</p></div>'; return; }
  const c = _c(); if (!c){ area.innerHTML=''; return; }
  const key = String(c.id);
  PLACEBOOK = placeBook();   // 場所の一覧は毎回作り直す（保存前の入力もそのまま出る）
  const forms = FORMS[key] = FORMS[key] || [];
  const stops = _stops();
  selRefD = _refDeparture() || '14:00';   // 基準は常に「最初の日課の最初の下校便」

  // 日課フォーム（各下校便に 出庫・配車 を自動表示＝出発−リード／便ごと手修正可。留置きは出庫非表示）

  const formsHtml = forms.length ? forms.map((f,fi)=>{
    const eff = f.after_toukou || c.after_toukou || '帰庫';
    const ruchi = (eff==='学校留置き');
    const ov = (f.dep_overrides&&typeof f.dep_overrides==='object') ? f.dep_overrides : {};
    const bins = (f.gekou_departures||[]).map((t,ti)=>{
      const dm=_toMin(t);
      const aSh = (dm!=null&&shL!=null)?_toHm(dm-shL):'';
      const aHa = (dm!=null&&haL!=null)?_toHm(dm-haL):'';
      const o = ov[t]||{}; const shHas=!!o.shukko, haHas=!!o.haisha;
      const shVal = shHas?_hm(o.shukko):aSh, haVal = haHas?_hm(o.haisha):aHa;
      const shukkoCell = ruchi
        ? '<span class="muted" style="font-size:11px;">出庫なし（学校留置き）</span>'
        : `<span class="muted" style="font-size:11px;">出庫</span><input type="text" inputmode="numeric" class="tinp" maxlength="5" placeholder="--:--" value="${escAttr(shVal)}" onchange="updDepOv(${fi},${ti},'shukko',tnorm(this),'${aSh}')" title="${shHas?('手修正あり（自動='+aSh+'）'):'自動＝下校便出発−出庫リード。修正で例外保存'}" style="width:60px;text-align:center;${shHas?'background:#fff3e0;border-color:#e0a23a;':''}">`;
      const haishaCell = `<span class="muted" style="font-size:11px;">配車</span><input type="text" inputmode="numeric" class="tinp" maxlength="5" placeholder="--:--" value="${escAttr(haVal)}" onchange="updDepOv(${fi},${ti},'haisha',tnorm(this),'${aHa}')" title="${haHas?('手修正あり（自動='+aHa+'）'):'自動＝下校便出発−配車リード。修正で例外保存'}" style="width:60px;text-align:center;${haHas?'background:#fff3e0;border-color:#e0a23a;':''}">`;
      return `<div style="margin:4px 0;padding:4px 6px;border-left:3px solid #e2ede6;">
        <div class="line" style="margin-bottom:2px;flex-wrap:wrap;">${shukkoCell}${haishaCell}</div>
        <div class="line"><span class="muted" style="min-width:74px;">下校便 出発</span><input type="text" inputmode="numeric" class="tinp" maxlength="5" placeholder="--:--" value="${escAttr(t)}" onchange="updFormTime(${fi},${ti},tnorm(this))" style="width:64px;text-align:center;"><button onclick="delFormTime(${fi},${ti})" title="この便を削除" style="border:none;background:#fdecea;color:#c0392b;border-radius:6px;padding:2px 8px;cursor:pointer;font-weight:700;line-height:1;">×</button></div>
      </div>`;
    }).join('') || '<div class="line"><span class="muted">便なし（登校のみ）</span></div>';
    const carSel = `<select onchange="updFormAfterToukou(${fi},this.value)" style="font-size:12px;"><option value=""${!f.after_toukou?' selected':''}>登校後の車両：既定（${escHtml(c.after_toukou||'帰庫')}）</option><option value="帰庫"${f.after_toukou==='帰庫'?' selected':''}>帰庫</option><option value="他所移動"${f.after_toukou==='他所移動'?' selected':''}>他所移動</option><option value="学校留置き"${f.after_toukou==='学校留置き'?' selected':''}>学校留置き</option></select>`;
    const carPlace = (f.after_toukou==='他所移動') ? `<div class="line" style="flex-wrap:wrap;margin:2px 0 4px;"><input type="text" value="${escAttr(f.after_toukou_place||'')}" placeholder="移動先の名称" oninput="updFormField(${fi},'after_toukou_place',this.value)" style="flex:1;min-width:120px;"><input type="text" value="${escAttr(f.after_toukou_addr||'')}" placeholder="住所" oninput="updFormField(${fi},'after_toukou_addr',this.value)" style="flex:1;min-width:120px;"><input type="text" value="${escAttr(f.after_toukou_coord||'')}" placeholder="座標(任意)" oninput="updFormField(${fi},'after_toukou_coord',this.value)" style="flex:0 0 120px;"><button class="mini" onclick="mapAfterF(${fi})" title="グーグルマップで開く">🗺</button></div>` : '';
    return `<div class="seg">
      <div class="line" style="flex-wrap:wrap;"><label class="fld" style="margin:0;">日課</label>
        <input type="text" value="${escAttr(f.form_name)}" placeholder="例：A" onchange="updFormName(${fi},this.value)" style="width:80px;">
        ${carSel}
        ${(function(){ const n=_usageOf((f.form_name||'').trim());
          return n ? `<span class="muted" style="font-size:11.5px;">月間予定で <b>${n}日</b> 使用中</span>` : ''; })()}
        <button class="link" onclick="delForm(${fi})" style="margin-left:auto;">この日課を削除</button></div>
      ${carPlace}
      ${bins}
      <button class="mini" onclick="addFormTime(${fi})">＋便</button>
    </div>`;
  }).join('') : '<p class="muted" style="margin:0 0 8px;">日課がありません。「＋日課を追加」で足してください。</p>';

  // 登校ルート（配列順・gekou_only以外）
  let toIdx = []; stops.forEach((s,i)=>{ if(!s.gekou_only) toIdx.push(i); });
  const toukouHtml = toIdx.length ? toIdx.map((i,pos)=>{
    const s=stops[i];
    return `<div class="line" style="margin-bottom:6px;">
      <span class="muted" style="min-width:20px;text-align:right;">${pos+1}</span>
      <input type="text" value="${escAttr(s.name)}" placeholder="バス停名" oninput="updStopName(${i},this.value)" style="flex:1;min-width:120px;">
      <input type="text" value="${escAttr(s.address)}" placeholder="住所" oninput="updStopAddr(${i},this.value)" style="flex:1;min-width:120px;">
      <input type="text" value="${escAttr(s.coord||'')}" placeholder="座標(任意)" oninput="updCoord(${i},this.value)" title="臨時運転時の正確な停車位置" style="flex:0 0 120px;">
      <button class="mini" onclick="mapStop(${i})" title="グーグルマップで開く">🗺</button>
      <input type="text" inputmode="numeric" class="tinp" maxlength="5" placeholder="--:--" value="${escAttr(_hm(s.toukou_time))}" onchange="updToukouTime(${i},tnorm(this))" title="登校便のこのバス停の時刻" style="width:64px;text-align:center;">
      <button class="link" onclick="moveStop(${i},-1)" title="上へ">▲</button>
      <button class="link" onclick="moveStop(${i},1)" title="下へ">▼</button>
      <button class="link" onclick="delStop(${i})">削除</button>
    </div>`;

/** ④経路タブの「便・区間ボタン」を画面の上に貼り付ける。
 *  ④では上の見出しは固定しない（作業する場所を広く取るため）ので top=0。
 *  ①〜③では見出しが固定なので、その高さのぶんだけ下げる（高さは版の表示などで変わるため毎回測る） */
function _fitRptSticky(){
  const head=document.getElementById('stickyHead'), bar=document.getElementById('rptSticky');
  if(!bar) return;
  const stuck = head && getComputedStyle(head).position === 'sticky';
  const t0 = (stuck ? head.offsetHeight : 0);
  bar.style.top = t0 + 'px';
  /* コピー・貼り付けの帯と、表の見出しも順に貼り付ける。
     高さは画面幅で折り返して変わるので、そのつど測って積み上げる
     （2026-08-21 八重樫さんの要望：ボタンを「全部」のすぐ上に置き、スクロールしても残す） */
  const clip = document.getElementById('rptClipBar');
  if(clip) clip.style.top = (t0 + bar.offsetHeight) + 'px';
  /* ⚠️ 表の見出しは固定できない。表は横スクロールの枠（overflow-x:auto）の中にあり、
     枠の中が position:sticky の基準になるのでページのスクロールに追従しない
     （2026-08-21 実機で確認）。そのため「全部」はこの帯の中に置いてある */
}
window.addEventListener('resize', _fitRptSticky);

function renderGekouPreview(){
  const c=_c();
  const stops = _stops();

  // ── 登校便（出社・出庫＋登校ルート各バス停の時刻を順路どおりに表示）
  const shussha=_hm(c&&c.toukou_shussha), shukko=_hm(c&&c.toukou_shukko);
  const toCells = stops.map((s,i)=>({s,i})).filter(x=>!x.s.gekou_only).map(x=>{
    const t=_hm(x.s.toukou_time);
    return `<span style="display:inline-flex;align-items:center;gap:3px;margin:2px 6px;"><span style="font-size:11px;color:#5a7a65;">${escHtml(x.s.name||'(バス停)')}</span><span style="font-weight:600;">${t||'—'}</span></span>`;
  }).join('');
  const toukouBlock = `<div style="margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #e2ede6;">
    <div style="font-weight:700;color:#2d4a38;margin-bottom:2px;">▼ 登校便　<span style="font-size:11px;color:#5a7a65;">出社 ${shussha||'—'} ／ 出庫 ${shukko||'—'}</span></div>
    ${ toCells ? `<div>${toCells}<span style="font-size:11px;color:#5a7a65;margin-left:4px;">→ 学校</span></div>` : '<span class="muted">「①主要情報・登校便」タブで登校ルートを入れると、各バス停の時刻がここに出ます。</span>' }
  </div>`;

  // ── 下校便（日課の入力順。各バス停は下校の並び＝offsetの小さい順）
  const timed = stops.map((s,i)=>({i, name:s.name, off:s.gekou_offset, ov:(s.gekou_overrides||{})})).filter(x=>x.off!=null).sort((a,b)=>a.off-b.off);
  const forms = FORMS[String(selCourseId)]||[];
  const anyDep = forms.some(f=>(f.gekou_departures||[]).some(t=>t));
  let gekouBlock;
  if(!anyDep){ gekouBlock = '<span class="muted">【下校便】日課ごとの時程で出発時刻を入れると、ここに時刻表が出ます。</span>'; }
  else if(!timed.length){ gekouBlock = '<span class="muted">【下校便】バス停と時刻で各バス停の時刻を入れると、日課ごとの時刻表がここに出ます。各時刻は個別に手修正できます。</span>'; }
  else {
    gekouBlock = forms.map((f,fi)=>{
      const deps=(f.gekou_departures||[]).filter(t=>t);
      const nm = escHtml(f.form_name||'(名称未設定)');
      if(!deps.length) return `<div style="margin-bottom:4px;"><span style="font-weight:700;color:#2d4a38;">日課 ${nm}</span> <span class="muted">下校便なし（登校のみ）</span></div>`;
      const fov = (f.dep_overrides&&typeof f.dep_overrides==='object') ? f.dep_overrides : {};
      const rows = deps.map(D=>{
        const dm=_toMin(D);
        const skip = (fov[D]&&Array.isArray(fov[D].skip)) ? fov[D].skip : [];
        const cells = timed.map(x=>{
          if(skip.includes(x.name)){
            return `<span style="display:inline-flex;align-items:center;gap:3px;margin:2px 5px;"><span style="font-size:11px;color:#b0451f;text-decoration:line-through;">${escHtml(x.name||'(バス停)')}</span><span style="font-size:11px;color:#b0451f;">通らない</span><button class="link" onclick="toggleSkip(${fi},'${escAttr(D)}','${escAttr(x.name)}',false)" title="この便でこのバス停を通す">戻す</button></span>`;
          }
          const auto=_toHm(dm+x.off);
          const has = x.ov && x.ov[D]!=null && x.ov[D]!=='';
          const val = has ? _hm(x.ov[D]) : auto;
          const st = has ? 'background:#fff3e0;border-color:#e0a23a;' : '';
          return `<span style="display:inline-flex;align-items:center;gap:3px;margin:2px 5px;"><span style="font-size:11px;color:#5a7a65;">${escHtml(x.name||'(バス停)')}</span><input type="text" inputmode="numeric" class="tinp" maxlength="5" placeholder="--:--" value="${escAttr(val)}" onchange="updOverride(${x.i},'${escAttr(D)}',tnorm(this),'${auto}')" title="${has?('手修正あり（自動='+auto+'）'):'自動。修正すると例外として保存されます'}" style="width:64px;text-align:center;${st}"><button class="link" onclick="toggleSkip(${fi},'${escAttr(D)}','${escAttr(x.name)}',true)" title="この便はこのバス停を通らない">×</button></span>`;
        }).join('');
        return `<div style="margin:2px 0 4px;"><span style="font-weight:600;">学校発 ${escHtml(D)}</span> → ${cells}</div>`;
      }).join('');
      return `<div style="margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid #e2ede6;"><div style="font-weight:700;color:#2d4a38;">日課 ${nm}</div>${rows}</div>`;
    }).join('');
  }
  return toukouBlock + gekouBlock;
}
function updOverride(i,D,val,auto){
  const s=_stops()[i]; s.gekou_overrides = s.gekou_overrides||{};
  const v=_hm(val), a=_hm(auto);
  if(v && v!==a){ s.gekou_overrides[D]=v; } else { delete s.gekou_overrides[D]; }
  _updPreview();
}
// この日課・この下校便で、指定のバス停を「通らない」に切替（dep_overrides[出発時刻].skip=[バス停名...]）
function toggleSkip(fi,D,name,on){
  const f=FORMS[String(selCourseId)][fi]; if(!f) return;
  f.dep_overrides = f.dep_overrides||{};
  const cur = f.dep_overrides[D]||{};
  let sk = Array.isArray(cur.skip)?cur.skip.slice():[];
  if(on){ if(!sk.includes(name)) sk.push(name); } else { sk=sk.filter(n=>n!==name); }
  if(sk.length) cur.skip=sk; else delete cur.skip;
  if(Object.keys(cur).length) f.dep_overrides[D]=cur; else delete f.dep_overrides[D];
  _updPreview();
}

function updToukou(field, val){ const c=_c(); if(c) c[field]=val; }

/** ②で日課名を変えたら、④の経路もその場で付け替える（2026-08-26）。
 *  ⚠️ 経路は日課の「名前」で紐づいているので、付け替えないと
 *     名前を変えたとたんに④の道が画面から消えたように見える。 */
function _routePtsOfForm(nm){
  const box = RPTS[String(selCourseId)] || {};
  let n = 0; const pre = nm + RK;
  Object.keys(box).forEach(kk=>{ if(kk.indexOf(pre) === 0) n += (box[kk]||[]).length; });
  return n;
}
function _renameRouteForm(from, to){
  const key = String(selCourseId);
  const box = RPTS[key]; if(!box) return 0;
  let n = 0; const next = {};
  Object.keys(box).forEach(kk=>{
    const p = kk.split(RK);
    if(p[0] === from){ p[0] = to; n += (box[kk]||[]).length; }
    next[p.join(RK)] = box[kk];
  });
  RPTS[key] = next;
  return n;
}
function updFormName(fi, val){
  const arr = FORMS[String(selCourseId)] || [];
  const f = arr[fi]; if(!f) return;
  const from = (f.form_name||'').trim(), to = (val||'').trim();
  if(from === to){ f.form_name = val; return; }
  /* ⚠️ 同じ名前が他にあると、④の経路がぶつかって片方が消える。
     版の中で日課名は一意でなければならない */
  if(to && arr.some((g,i)=>i!==fi && (g.form_name||'').trim() === to)){
    _saveMsg(`日課名「${to}」は既にあります。別の名前にしてください。`, false);
    renderEditor(); return;   // 入力を元に戻す
  }
  f.form_name = val;
  let moved = 0;
  if(from && to){
    moved = _renameRouteForm(from, to);
    const k = String(selCourseId);
    const list = FORM_RENAMES[k] = FORM_RENAMES[k] || [];
    // 続けて何度も変えたときは、いちばん最初の名前から今の名前へ1本にまとめる
    const prev = list.find(r => r[1] === from);

/* ── 下校便の並べ替え（2026-08-24 追加） ──
   下校が登校の逆順にならないコースがあるため。あおば支援学校2コースは
   途中から登校と同じ向きに戻る（ロの字）ので、最終目的地も逆順とは違う。 */
function moveGekou(i,dir){
  const stops=_stops(), ord=_gekouIdx();
  const p=ord.indexOf(i), q=p+dir;
  if(p<0 || q<0 || q>=ord.length) return;
  const t=ord[p]; ord[p]=ord[q]; ord[q]=t;
  ord.forEach((idx,k)=>{ stops[idx].gekou_seq = k+1; });
  renderEditor();
}
/** 入れた時刻の早い順に並べ替える。時刻が空のバス停（学校・下校で外したバス停）は今の位置に残す */
function sortGekouByTime(){
  const stops=_stops(), ord=_gekouIdx();
  const slots=[]; ord.forEach((i,k)=>{ if(stops[i].gekou_offset!=null) slots.push(k); });
  if(slots.length<2){ _saveMsg('時刻が2つ以上入っていないと並べ替えられません。', false); return; }
  const timed = ord.filter(i=>stops[i].gekou_offset!=null)
                   .sort((a,b)=>stops[a].gekou_offset-stops[b].gekou_offset);
  const next = ord.slice();
  slots.forEach((k,n)=>{ next[k]=timed[n]; });
  next.forEach((i,k)=>{ stops[i].gekou_seq=k+1; });
  renderEditor();
  _saveMsg('下校の並びを、入れた時刻の早い順にしました。よければ「このコースを保存」を押してください。', true);
}
/** 登校の逆順に戻す（下校専用のバス停はその後ろ） */
function resetGekouOrder(){
  const stops=_stops();
  const norm=[], only=[];
  stops.forEach((s,i)=>{ (s.gekou_only?only:norm).push(i); });
  norm.reverse();
  norm.concat(only).forEach((i,k)=>{ stops[i].gekou_seq=k+1; });
  renderEditor();
  _saveMsg('下校の並びを登校の逆順に戻しました。よければ「このコースを保存」を押してください。', true);
}

// ⑤ 添乗員の送迎シナリオ（人・日付は入れない）。登校用／下校用を別々に複数持てる＝途中交代に対応。
function _scenList(){ return SCEN[String(selCourseId)] = SCEN[String(selCourseId)] || []; }
/* 🔴 ③添乗員送迎の場所を、他の送迎から写す（2026-09-02 岩﨑さん → 八重樫さん）

   > 同じように③添乗員送迎でも出来ないかという事です。
   > 登校便の勤務前乗車場所と下校便の勤務後降車場所、
   > 登校便の勤務後降車場所と下校便の勤務前乗車場所、あるいは全場所、
   > 多くの場合で同じはずだという事です。
   > 行き方面帰り方面位置は微妙な調整をするだけで良いので
   > その他の名前や位置は一回で写すように出来ないでしょうか。

   写す先の組み合わせ
     同じ区分どうし    前 → 前 ／ 後 → 後   （同じ道すじの別パターン）
     区分をまたぐとき  登校前 ↔ 下校後 ／ 登校後 ↔ 下校前

   ⚠️ 写すのは **場所名・住所・座標** だけ。**時刻は写さない**。
      乗車時刻（登校）と「下校便出発の◯分前」（下校）は持ち方そのものが違い、
      岩﨑さんの言われる「微妙な調整」がまさにそこだから。
   ⚠️ 乗車／降車は**写し先の局面で決める**（前＝乗車、後＝降車）。
      源の種別をそのまま持ってくると、降車の場所が乗車として入ってしまう。 */

/** 局面が「前」か */
function _isMae(ph){ return ph === '登校前' || ph === '下校前'; }

/** 源の局面 → 写し先の局面（同じ区分なら同じ側、またぐなら反対側） */
function _scenDstPhase(srcSeg, srcPh, dstSeg){
  const mae = _isMae(srcPh);
  const same = (srcSeg === dstSeg);
  const toMae = same ? mae : !mae;
  return dstSeg + (toMae ? '前' : '後');
}

/** その局面へ写せる源の一覧 */
function _scenSrcOpts(dstSi, dstPh){
  const list = _scenList();
  const dst = list[dstSi];
  const out = [];
  list.forEach(function(s, si){
    if(si === dstSi) return;
    (SEG_PHASES[s.segment] || []).forEach(function(ph){
      const n = (s.pts || []).filter(function(r){ return r.phase === ph && (r.name || r.address || r.coord); }).length;
      if(!n) return;
      if(_scenDstPhase(s.segment, ph, dst.segment) !== dstPh) return;
      const nm = (s.label || '').trim() || '(名前なし)';
      out.push({ v: si + '|' + ph, t: s.segment + '「' + nm + '」' + ph + '（' + n + '件）' });
    });
  });
  return out;
}

/** その局面へ写す */
function scenCopyFrom(dstSi, dstPh, val){
  if(!val) return;
  const parts = String(val).split('|');
  const srcSi = Number(parts[0]), srcPh = parts[1];
  const list = _scenList();
  const src = list[srcSi], dst = list[dstSi];
  if(!src || !dst) return;
  const rows = (src.pts || []).filter(function(r){ return r.phase === srcPh && (r.name || r.address || r.coord); });
  if(!rows.length){ alert('写せる場所がありません。'); renderEditor(); return; }
  const cur = (dst.pts || []).filter(function(r){ return r.phase === dstPh; });
  const kind = _isMae(dstPh) ? '乗車' : '降車';
  const msg = srcPh + ' の場所 ' + rows.length + '件 を「' + dstPh + '」へ ' + kind + ' として写します。\n\n'
    + (cur.length ? 'いま「' + dstPh + '」に入っている ' + cur.length + '件 は消えます。\n\n' : '')
    + '⚠️ 時刻は写しません。写したあとで入れてください。\n\n'
    + 'よろしいですか。';
  if(!confirm(msg)) { renderEditor(); return; }
  dst.pts = (dst.pts || []).filter(function(r){ return r.phase !== dstPh; });
  rows.forEach(function(r){
    dst.pts.push({ phase: dstPh, kind: kind,
      name: r.name || '', address: r.address || '', coord: r.coord || '',
      bus_time: '', time_lead: null });   /* ⚠️ 時刻は写さない */
  });
  renderEditor();
  status(srcPh + ' から ' + dstPh + ' へ ' + rows.length + '件 写しました。⚠️ 時刻は入っていません。保存前に確かめてください。', true);
}

/** 送迎まるごと写す（2つの局面を一度に） */
function _scenWholeOpts(dstSi){
  const list = _scenList();
  const out = [];
  list.forEach(function(s, si){
    if(si === dstSi) return;
    const n = (s.pts || []).filter(function(r){ return r.name || r.address || r.coord; }).length;
    if(!n) return;
    const nm = (s.label || '').trim() || '(名前なし)';
    out.push({ v: String(si), t: s.segment + '「' + nm + '」（全' + n + '件）' });
  });
  return out;
}
function scenCopyWhole(dstSi, val){
  if(!val) return;
  const list = _scenList();
  const src = list[Number(val)], dst = list[dstSi];
  if(!src || !dst) return;
  const plan = [];
  (SEG_PHASES[src.segment] || []).forEach(function(ph){
    const rows = (src.pts || []).filter(function(r){ return r.phase === ph && (r.name || r.address || r.coord); });
    if(!rows.length) return;
    plan.push({ srcPh: ph, dstPh: _scenDstPhase(src.segment, ph, dst.segment), rows: rows });
  });
  if(!plan.length){ alert('写せる場所がありません。'); renderEditor(); return; }
  const cur = (dst.pts || []).filter(function(r){ return r.name || r.address || r.coord; }).length;
  const msg = '「' + ((src.label||'').trim() || '(名前なし)') + '」の場所を、この送迎へ写します。\n\n'
    + plan.map(function(p){ return '　' + p.srcPh + ' → ' + p.dstPh + '　' + p.rows.length + '件'; }).join('\n') + '\n\n'
    + (cur ? 'いまこの送迎に入っている ' + cur + '件 は消えます。\n\n' : '')
    + '⚠️ 時刻は写しません。写したあとで入れてください。\n\n'
    + 'よろしいですか。';
  if(!confirm(msg)) { renderEditor(); return; }
  const keep = plan.map(function(p){ return p.dstPh; });
  dst.pts = (dst.pts || []).filter(function(r){ return keep.indexOf(r.phase) < 0; });
  let total = 0;
  plan.forEach(function(p){
    const kind = _isMae(p.dstPh) ? '乗車' : '降車';
    p.rows.forEach(function(r){
      dst.pts.push({ phase: p.dstPh, kind: kind,
        name: r.name || '', address: r.address || '', coord: r.coord || '',
        bus_time: '', time_lead: null });
      total++;
    });
  });
  renderEditor();
  status('場所を ' + total + '件 写しました。⚠️ 時刻は入っていません。保存前に確かめてください。', true);
}

// 「35°32'39.2"N 139°42'15.8"E」→ 10進の緯度経度。バス停の座標欄がこの形なので変換して取り込む
function dmsToDecimal(s){
  const t=String(s||'').trim();
  const m = t.match(/(\d+)°(\d+)'([\d.]+)"([NS])\s*[, ]\s*(\d+)°(\d+)'([\d.]+)"([EW])/);
  if(m){
    const lat=(Number(m[1])+Number(m[2])/60+Number(m[3])/3600)*(m[4]==='S'?-1:1);
    const lng=(Number(m[5])+Number(m[6])/60+Number(m[7])/3600)*(m[8]==='W'?-1:1);
    return { lat:+lat.toFixed(6), lng:+lng.toFixed(6) };
  }
  // 「35.544222, 139.704389」の形も受ける
  const d = t.match(/^(-?\d+\.\d+)\s*[, ]\s*(-?\d+\.\d+)$/);
  if(d) return { lat:+Number(d[1]).toFixed(6), lng:+Number(d[2]).toFixed(6) };
  return null;
}
// 2地点間の直線距離(km)。地点を密に置くほど、実際の道のりに近づく
function rptHaversine(a,b){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
// 緯度経度が入っている地点だけを対象に、前の地点からの距離と累計を出す
function rptDistances(){
  const pts=_rpts();
  const valid=pts.map((p,i)=>({...p,idx:i})).filter(p=>String(p.lat).trim()!==''&&String(p.lng).trim()!=='');
  let cum=0; const byIdx={};
  valid.forEach((p,k)=>{
    const seg = k===0 ? null : rptHaversine({lat:Number(valid[k-1].lat),lng:Number(valid[k-1].lng)},{lat:Number(p.lat),lng:Number(p.lng)});
    if(seg!=null) cum+=seg;
    byIdx[p.idx]={ seg, cum };
  });
  return { byIdx, total:cum };
}
// 再描画の前に、画面で入力中の値を拾っておく（拾わずに描き直すと入力が消える）
function rptSyncFromInputs(){

  const rows=document.querySelectorAll('#rptTable tbody tr.rp-row');

          st=tr.querySelector('.rp-stop'), ct=tr.querySelector('.rp-cut');
    if(n) pts[i].name=n.value;
    if(la) pts[i].lat=la.value;
    if(ln) pts[i].lng=ln.value;

    const nt=tr.nextElementSibling && tr.nextElementSibling.querySelector('.rp-note');
    if(nt) pts[i].note=nt.value;

}

/** ②で下校に入っているバス停の添字（下校の並び順）。
 *  ⚠️ ②で「下校で外す」を押したバス停は下校の時刻が空になる（gekou_offset が null）。
 *     これを見ないと、外したはずのバス停を④が「足りない」と言ってしまう（2026-08-26）。
 *  ⚠️ 先頭（＝学校）は時刻を持たないが、下校の出発地なので必ず含める。 */
function _gekouStopIdx(){
  const stops = _stops();
  return _gekouIdx().filter((i,k)=> k === 0 || stops[i].gekou_offset != null);
}

/** ②が「この便で通る」と言っているバス停の名前（並び順）。
 *  ⚠️ ②が正。④はこれに合わせる（2026-08-26 八重樫さんの整理） */
function _expectedStops(form, seg){
  seg = seg || selRSeg;
  const stops = _stops();
  if(seg === '登校') return stops.filter(s=>!s.gekou_only).map(s=>(s.name||'').trim()).filter(Boolean);
  if(R_GEKOU_MAIN.indexOf(seg) < 0) return [];   // 回送はバス停一覧と対応しない
  const skip = _skipNames(form, seg);
  return _gekouStopIdx().map(i=>(stops[i].name||'').trim())
    .filter(n=>n && skip.indexOf(n) < 0);
}

/** ④に入っているバス停と、②が言うバス停の食い違い */
function _diffVs2(){
  const seg = selRSeg;
  if(seg !== '登校' && R_GEKOU_MAIN.indexOf(seg) < 0) return null;   // 回送は対象外
  if(seg !== '登校' && !_curForm()) return null;
  const want = _expectedStops();
  if(!want.length) return null;
  const have = _rpts().filter(p=>p.is_stop).map(p=>(p.name||'').trim()).filter(Boolean);
  const extra   = have.filter(n=>want.indexOf(n) < 0);          // ④にあるが②では通らない
  const missing = want.filter(n=>have.indexOf(n) < 0);          // ②では通るが④に無い
  // 並び順の食い違い（両方にあるバス停だけで比べる）
  const common = have.filter(n=>want.indexOf(n)>=0);
  const wantCommon = want.filter(n=>have.indexOf(n)>=0);
  const orderNg = common.join('|') !== wantCommon.join('|');
  if(!extra.length && !missing.length && !orderNg) return null;
  return { extra, missing, orderNg, want };
}

/** ②で通らないバス停を「バス停ではない」にする。
 *  ⚠️ 地点そのものは消さない。道をたどる目印として残すほうが多いため
 *     （2026-08-26 八重樫さん）。本当に道から外れる場合だけ rptDropStop を使う。 */
function rptUnstop(name){
  const list = _rpts();
  const i = list.findIndex(p=>p.is_stop && (p.name||'').trim() === name);
  if(i < 0) return;
  list[i].is_stop = false;
  rptSelIdx = null; rptPick = {};
  renderEditor();
  _saveMsg(`「${name}」のバス停の印を外しました。道の目印としては残しています。`, true);
}
/** 地点ごと消す（道からも外れるとき） */
function rptDropStop(name){
  const list = _rpts();
  const i = list.findIndex(p=>(p.name||'').trim() === name);
  if(i < 0) return;
  if(!confirm(`「${name}」を地点ごと消します。\n\n※ 道の目印としても残りません。道が通らなくなる場合だけお使いください。\n　 バス停ではなくなるだけなら「バス停を外す」のほうが安全です。`)) return;
  list.splice(i, 1);
  rptSelIdx = null; rptPick = {};
  renderEditor();
  _saveMsg(`「${name}」を地点ごと消しました。`, true);
}
/** ②では通るのに④でバス停になっていないバス停を、バス停にする。
 *  同じ名前の地点が目印として既にあれば、印を付けるだけ（重ねて入れない） */
function rptAddStop(name){
  const list = _rpts();
  const at0 = list.findIndex(p=>!p.is_stop && (p.name||'').trim() === name);
  if(at0 >= 0){
    list[at0].is_stop = true;
    rptSelIdx = null; rptPick = {};
    renderEditor();
    _saveMsg(`「${name}」は道の目印として入っていたので、バス停の印を付けました。`, true);
    return;
  }
  const stops = _stops();
  const src = stops.find(s=>(s.name||'').trim() === name);
  const c = src && dmsToDecimal(src.coord);
  if(!c){ _saveMsg(`「${name}」の座標がバス停一覧で空です。先にそちらで座標を入れてください。`, false); return; }
  const want = _expectedStops();
  const wi = want.indexOf(name);
  let at = list.length;
  for(let i=0;i<list.length;i++){
    if(!list[i].is_stop) continue;
    const k = want.indexOf((list[i].name||'').trim());
    if(k >= 0 && k > wi){ at = i; break; }
  }
  list.splice(at, 0, { name:name, lat:String(c.lat), lng:String(c.lng), is_stop:true, split_here:false, note:'' });
  rptSelIdx = null; rptPick = {};
  renderEditor();
  _saveMsg(`「${name}」を${at+1}番目に入れました。前後の目印をご確認ください。`, true);
}
/** まとめて直す。余分はバス停の印を外すだけ、足りないものは付ける／差し込む */
function rptFixAll(){
  const d = _diffVs2();
  if(!d) return;
  if(!confirm(`バス停の設定に合わせて直します。\n　バス停の印を外す：${d.extra.length}バス停（地点は道の目印として残します）\n　バス停にする：${d.missing.length}バス停\n\n※ 差し込んだ前後の道が合っているかご確認ください。`)) return;
  const list = _rpts();
  d.extra.forEach(n=>{ const i=list.findIndex(p=>p.is_stop && (p.name||'').trim()===n); if(i>=0) list[i].is_stop = false; });
  const want = _expectedStops();
  d.missing.forEach(n=>{
    const at0 = list.findIndex(p=>!p.is_stop && (p.name||'').trim()===n);
    if(at0 >= 0){ list[at0].is_stop = true; return; }
    const src = _stops().find(s=>(s.name||'').trim()===n);
    const c = src && dmsToDecimal(src.coord);
    if(!c) return;
    const wi = want.indexOf(n);
    let at = list.length;
    for(let i=0;i<list.length;i++){
      if(!list[i].is_stop) continue;
      const k = want.indexOf((list[i].name||'').trim());
      if(k >= 0 && k > wi){ at = i; break; }
    }
    list.splice(at, 0, { name:n, lat:String(c.lat), lng:String(c.lng), is_stop:true, split_here:false, note:'' });
  });
  rptSelIdx = null; rptPick = {};
  renderEditor();
  _saveMsg('バス停の設定に合わせて直しました。前後の目印をご確認ください。', true);
}

/* ===== 出発地・到着地は「①主要情報・登校便」タブで決まる =====
   経路の両端は独立した項目ではなく「並びの1番目と最後」そのもの。
   その2つは「①主要情報・登校便」タブ（車庫・バス停・登校後の行き先）に書いてある事実なので、
   ④からは**書き換えられない**ようにする。
   ・画面に出す前に①②の値を入れ直す（rptLockEnds）
   ・その行は入力できない・消せない・動かせない・その外側には差し込めない
   ・④から①②③へ書き戻す筋道は作らない（2026-08-21 八重樫さんと確認）
   ⚠️ ①②から決められない端（車庫の座標が空など）は縛らない。
      でないと新しいコースの経路を作り始められなくなる。 */
function _rptLockState(){
  const pts = _rpts();
  if(!pts.length) return { from:false, to:false };
  const w = _endPtsHere();
  return { from: !!w.from, to: !!(w.to && pts.length >= 2) };
}
/** 両端に①②の値を入れ直す。描画のたびに呼ぶので、画面は常に①②と一致する */
function rptLockEnds(){
  const pts = _rpts();
  if(!pts.length) return { from:false, to:false };
  const w = _endPtsHere();
  const set = (p, q) => { p.name = q.name || p.name || ''; p.lat = String(q.lat); p.lng = String(q.lng); };
  const lock = { from:false, to:false };
  if(w.from){ set(pts[0], w.from); lock.from = true; }
  if(w.to && pts.length >= 2){ set(pts[pts.length-1], w.to); lock.to = true; }
  return lock;
}
/** その行が①②で決まっている端か */
function _rptIsLocked(i){
  const pts = _rpts(), lock = _rptLockState();
  return (i===0 && lock.from) || (i===pts.length-1 && lock.to);
}
/** 選択なしで「＋」を押したときに入る位置（到着地が縛られていればその手前） */
function _rptAddTail(){
  const pts = _rpts();
  return _rptLockState().to ? Math.max(0, pts.length-1) : pts.length;
}
function _rptAddLabel(){
  if(rptSelIdx != null) return '＋ '+(rptSelIdx+1)+'番の上に差し込む';
  return _rptLockState().to ? '＋ 到着地の手前に差し込む' : '＋ 最後に地点を追加';
}
/** 貼り付けボタンの文字。行を選んでいるかどうかで動きが変わるので、それを出す */
function _rptPasteLabel(){

  return (rptSelIdx != null) ? ('📥 貼り付け（'+(rptSelIdx+1)+'番の上へ）') : '📥 貼り付け（中を入れ替え）';

/** 行を選ぶ。差し込み先の目印なので、再描画はせず色とボタンの文字だけ変える（入力中の値を消さないため） */

/** 指定位置に空欄の行を差し込む。at を省くと末尾（到着地が縛られていればその手前）に足す */
function rptAdd(at){
  rptSyncFromInputs();
  var pts=_rpts(), lock=_rptLockState();
  if(at==null) at = (rptSelIdx==null) ? _rptAddTail() : rptSelIdx;
  if(at<0) at=0; if(at>pts.length) at=pts.length;
  if(lock.from && at===0){
    _saveMsg('出発地の前には足せません。出発地は「①主要情報・登校便」タブ（車庫・バス停・登校後の行き先）で決まります。', false); return; }
  if(lock.to && at>=pts.length){
    _saveMsg('到着地の後ろには足せません。到着地は「①主要情報・登校便」タブ（車庫・バス停・登校後の行き先）で決まります。', false); return; }
  pts.splice(at, 0, { name:'', lat:'', lng:'', is_stop:false, split_here:false, note:'' });
  // 差し込んだ位置より下の行は1つずつ下がる。選んでいた行もそれに合わせて動かす
  // （選んだ行の上に足した場合は選択がその行を追い続けるので、続けて足すと進行方向どおりに並ぶ）
  if(rptSelIdx!=null && rptSelIdx>=at) rptSelIdx++;
  rptPick = {};   // 行がずれるので「コピー」の選択は解除する
  renderEditor();

  var tr = document.querySelectorAll('#rptTable tbody tr.rp-row')[at];
  if(tr){ var el=tr.querySelector('.rp-lat'); if(el){ el.focus(); } }
}
function rptMove(i,dir){

/** バス停一覧から下書きを作る。登校＝順路どおり、下校＝②下校便で並べた順 */
function rptFillFromStops(){
  const stops=_stops();
  /* ⚠️ ②の「この便は通らない」を反映する（2026-08-26）。
     反映しないと、日課ごとに分けた意味がなくなる */
  const _skip = _skipNames();

    ? stops.filter(s=>!s.gekou_only)

  });
