}

/** 回送の下書き。すでに分かっている地点を並べる：
 *  出庫＝ 車庫 →（その送迎の乗降地点）→ その便の最初のバス停
 *  帰庫＝ その便の最後の地点 →（乗降地点）→ 車庫
 *  あとは曲がり角の目印を間に差し込むだけにする（バス停一覧から作る下書きと同じ考え方） */
/** いま見ている回送の「どこから → どこまで」。画面の見出しに出す。
 *  登校の後・下校の前は、コース設定（帰庫／他所移動／学校留置き）で行き先が変わる */
function _kaiEnds(){
  const c   = COURSES.find(x=>x.id===selCourseId) || {};
  const off = OFFICES[c.office_id] || {};
  const garName = off.name || '車庫';
  const _mseg = (_kaiGroup()==='登校') ? '登校'
    : (selRSeg==='便間回送②' ? '下校②' : (selRSeg==='帰庫回送下校' ? _lastGekouSeg() : '下校①'));
  const line = ((RPTS[String(selCourseId)]||{})[_rkey(_mseg,null,null)]||[])
    .filter(p=>String(p.lat).trim()!=='' && String(p.lng).trim()!=='');
  const firstName = line.length ? ((line.find(p=>p.is_stop)||line[0]).name || '最初のバス停') : '最初のバス停';
  const lastName  = line.length ? (line[line.length-1].name || '最後の地点') : '最後の地点';
  let hub = garName, warn = '';
  if(selRSeg==='帰庫回送登校' || selRSeg==='出庫回送下校'){
    if(c.after_toukou === '他所移動'){
      hub = (c.after_toukou_place||'').trim() || '他所（名前が未入力）';
      if(!dmsToDecimal(c.after_toukou_coord)) warn = '⚠️ 他所の座標が「①主要情報・登校便」タブで空です。入れないと下書きが作れません。';
    }else if(c.after_toukou === '学校留置き'){
      hub = '学校に置いたまま';
      warn = '⚠️ このコースは登校の後「学校留置き」です。車庫へ戻らないので、この道は不要かもしれません。';
    }
  }
  if(!off.coord) warn = warn || '⚠️ 車庫の座標が営業所マスタで空です。';
  switch(selRSeg){
    case '出庫回送登校': return { from: garName,  to: firstName, warn };
    case '帰庫回送登校': return { from: lastName, to: hub,       warn };
    case '出庫回送下校': return { from: hub,      to: firstName, warn };
    default:             return { from: lastName, to: garName,   warn };
  }
}

function rptSeedKaisou(){
  if(!_isKaisou(selRSeg)) return;
  const c   = COURSES.find(x=>x.id===selCourseId) || {};
  const off = OFFICES[c.office_id];
  const gc  = off && dmsToDecimal(off.coord);
  if(!gc){ _saveMsg('このコースの車庫に座標が入っていません。営業所マスタ（master.html）で座標を入れてください。', false); return; }

  /* その便の本線から、最初のバス停と最後の地点を取る。
     ⚠️ 鍵は日課つきになったので _rkey を通す（2026-08-26 直し漏れ）。
        帰庫はその日課の最後の便から、便間回送はその前の便から始まる */
  const mainSeg = (_kaiGroup() === '登校') ? '登校'
    : (selRSeg === '便間回送②' ? '下校②'
       : (selRSeg === '帰庫回送下校' ? _lastGekouSeg() : '下校①'));
  const line = ((RPTS[String(selCourseId)]||{})[_rkey(mainSeg, null, null)]||[])
    .filter(p=>String(p.lat).trim()!=='' && String(p.lng).trim()!=='');
  if(!line.length){ _saveMsg(`${R_SEG_LABEL[mainSeg]}にまだ地点がありません。先にそちらを作ってください。`, false); return; }
  const firstStop = line.find(p=>p.is_stop) || line[0];
  const lastPt    = line[line.length-1];

  // その送迎の乗降地点（「登校前」「登校後」のように前後で分かれている）
  const sc   = _scenList().find(s=>String(s.dbId)===String(selRScen));
  const want = (_kaiWhich()==='出庫') ? '前' : '後';
  const tps  = !sc ? [] : (sc.pts||[])
    .filter(p=>String(p.phase||'').endsWith(want))
    .map(p=>{ const d=dmsToDecimal(p.coord); return d ? {
        name:(p.name||'送迎地点')+'（'+(p.kind||'乗降')+'）',
        lat:String(d.lat), lng:String(d.lng), is_stop:true, split_here:false, note:'' } : null; })
    .filter(Boolean);

  const mk = (name,lat,lng) => ({ name:name||'', lat:String(lat), lng:String(lng), is_stop:true, split_here:false, note:'' });
  const gar = mk(off.name||'車庫', gc.lat, gc.lng);
  // 登校の後は「帰庫」だけでなく「他所移動」もある。下校の前はそこから出る。
  // ⚠️ 他所の座標が空なら車庫で代用し、あとで直してもらう
  const ac = (c.after_toukou==='他所移動') ? dmsToDecimal(c.after_toukou_coord) : null;
  const away = ac ? mk((c.after_toukou_place||'他所'), ac.lat, ac.lng) : null;
  const hub = (selRSeg==='帰庫回送登校' || selRSeg==='出庫回送下校') ? (away || gar) : gar;
  if(!away && (selRSeg==='帰庫回送登校' || selRSeg==='出庫回送下校') && c.after_toukou==='他所移動'){
    _saveMsg('登校の後は「他所移動」ですが、行き先の座標が空です。「①主要情報・登校便」タブで入れてください。いまは車庫で下書きを作ります。', false);
  }
  const pts = (_kaiWhich()==='出庫')
    ? [hub].concat(tps, [mk(firstStop.name||'最初のバス停', firstStop.lat, firstStop.lng)])
    : [mk(lastPt.name||'最後の地点', lastPt.lat, lastPt.lng)].concat(tps, [hub]);

  rptSyncFromInputs();
  const cur = _rpts();
  if(cur.length && !confirm(`いまの${cur.length}地点を、下書き${pts.length}地点で置き換えます。よろしいですか。`)) return;
  RPTS[String(selCourseId)][_rkey()] = pts;
  rptSelIdx = null; rptPick = {};
  renderEditor();
  _saveMsg(`${pts.length}地点の下書きを作りました。曲がり角の目印を間に差し込んでください。`, true);
}

/** 他の便の並びを、いま開いている便へ丸ごとコピーする（下校は原則どの便も同じ道のため） */
/* コピー元は「同じコースの他の日課・他の便」。
   鍵に区切り文字を使っているので、HTMLの属性には番号だけを渡す（2026-08-26） */
let _rCopySrc = [];
function rptCopyFrom(i){
  const o = _rCopySrc[i];
  if(!o){ _saveMsg('コピー元が見つかりません。画面を開き直してください。', false); return; }
  const box = RPTS[String(selCourseId)] = RPTS[String(selCourseId)] || _emptyRpts();
  const src = box[o.key] || [];
  if(!src.length){ _saveMsg(o.label + 'にはまだ地点がありません。先にそちらを作ってください。', false); return; }
  rptSyncFromInputs();
  const here = _rkey();
  const cur = box[here] || [];
  if(cur.length && !confirm(`いま開いている道の${cur.length}地点を、${o.label}の${src.length}地点で置き換えます。よろしいですか。`)) return;
  box[here] = src.map(p=>({ name:p.name, lat:p.lat, lng:p.lng, is_stop:p.is_stop, split_here:p.split_here, note:p.note }));
  rptSelIdx = null; rptPick = {};
  renderEditor();
  _saveMsg(o.label + `から ${src.length}地点をコピーしました。バス停の設定との食い違いが出ていないかご確認ください。`, true);
}

/* ===== 経路のコピー／貼り付け（コースをまたぐ） =====
   ・回送で途中まで同じ道を通るコース、同じ学校へ行く別の車両など、
     一度作った道を別のコースでも使い回すためのもの（2026-08-21 八重樫さんの要望）。
   ・控えは **1本単位**（いま開いている便・送迎・ルートの並び）。
     コースまるごとにしないのは、車庫が違えば出庫回送は違う道になり、
     出庫回送は行き先の**最初のバス停がコースごとに違う**ため。
   ・RPTS は版を読み直すたび丸ごと入れ替わる（loadVersionInto）。
     そのため控えは localStorage に置く。コースを移っても画面を読み直しても残る。
   ・貼り付けても**保存はされない**。必ず「保存」を押してもらう。 */
/* 控えの置き場。④の「道まるごと」と「選んだ地点」の2つ。
   localStorage なのでコースを移っても、画面を読み直しても残る。 */
const CLIP_KEY = { keiro:'unkou_rpt_clip_v1' };
function clipGet(kind){
  try{ const s = localStorage.getItem(CLIP_KEY[kind]); return s ? (JSON.parse(s) || null) : null; }
  catch(e){ return null; }
}
function clipPut(kind, o){
  try{ localStorage.setItem(CLIP_KEY[kind], JSON.stringify(o)); return true; }
  catch(e){ _saveMsg('控えを置けませんでした：'+e.message, false); return false; }
}
function clipDrop(kind, what){
  if(!confirm(what+'の控えを消します。よろしいですか。')) return;
  try{ localStorage.removeItem(CLIP_KEY[kind]); }catch(e){}
  renderEditor(); _saveMsg('控えを消しました。', true);
}

function rptClipGet(){
  const o = clipGet('keiro');
  return (o && Array.isArray(o.pts) && o.pts.length) ? o : null;
}
/** 控えの中身を1行で表す（どのコースのどの道か） */
function _clipLabel(o){
  let s = (o.course||'') + '　' + (R_SEG_LABEL[o.seg] || o.seg || '');
  if(o.who)   s += '　' + o.who;
  if(o.route) s += '　サブ：' + o.route;
  return s;
}
/** いま開いている道を同じ形で表す（貼り付け先の確認に使う） */
function _clipHere(){
  const c = _c() || {};
  const o = { course: courseLabel(c), seg: selRSeg, route: selRRoute || '', who: '' };
  if(_isKaisou(selRSeg)){
    const sc = _scenList().find(x=>String(x.dbId)===String(selRScen));
    o.who = sc ? (sc.label || ('送迎'+sc.dbId)) : '送迎なし';
  }
  return _clipLabel(o);
}
/** コピーは1つ。
 *  ・「コピー」列にチェックがあれば、その地点だけ
 *  ・チェックが無ければ、中（2番目〜最後から2番目）をまとめて
 *  出発地・到着地は「①主要情報・登校便」タブで決まるので、どちらの場合も控えには入れない
 *  （2026-08-21 八重樫さんの案で、2つあったボタンを1つにまとめた） */
function rptClipCopy(){
  if(!selCourseId){ _saveMsg('先にコースを選んでください。', false); return; }
  rptSyncFromInputs();
  const all  = _rpts();
  const lock = _rptLockState();
  const idx  = Object.keys(rptPick).map(Number).filter(i=>all[i]).sort((a,b)=>a-b);
  const pick = idx.length
    ? idx.map(i=>all[i])
    : all.slice(lock.from?1:0, lock.to ? all.length-1 : all.length);
  // 名前も緯度も経度も空の行は、控えに入れない
  const pts = pick.filter(p => String(p.lat).trim()!=='' || String(p.lng).trim()!=='' || String(p.name||'').trim()!=='');
  if(!pts.length){
    _saveMsg(idx.length ? '選んだ地点が空です。' : 'コピーできる地点がありません（出発地と到着地は「①主要情報・登校便」タブで決まるのでコピーしません）。', false); return; }
  const c  = _c() || {};
  const sc = _isKaisou(selRSeg) ? _scenList().find(x=>String(x.dbId)===String(selRScen)) : null;
  const o = {
    course: courseLabel(c),
    seg:    selRSeg,
    who:    _isKaisou(selRSeg) ? (sc ? (sc.label || ('送迎'+sc.dbId)) : '送迎なし') : '',
    route:  selRRoute || '',
    えらんだ: !!idx.length,
    pts: pts.map(p=>({ name:p.name||'', lat:p.lat, lng:p.lng,
                       is_stop:!!p.is_stop, split_here:!!p.split_here, note:p.note||'' }))
  };
  if(!clipPut('keiro', o)) return;
  rptPick = {};
  renderEditor();
  _saveMsg(`${pts.length}地点をコピーしました。`
    + (idx.length ? '差し込みたい行をクリックしてから「📥 貼り付け」を押してください。'
                  : '貼り付けたいコース・便を開いて「📥 貼り付け」を押すと、中が入れ替わります。'), true);
}
/** いま開いている道の、**このコース本来の**出発地と到着地（座標つき）。
 *  貼り付けた道の両端がここと違っていないかを確かめるために使う。
 *  ⚠️ 経路の両端は独立した項目ではなく「並びの1番目と最後」そのもの。
 *     だから貼り付けると両端も一緒に入れ替わる（2026-08-21 八重樫さんの指摘）。 */
function _endPtsHere(){
  const num = p => (p && String(p.lat).trim()!=='' && String(p.lng).trim()!=='')
    ? { name:p.name||'', lat:Number(p.lat), lng:Number(p.lng) } : null;
  if(!_isKaisou(selRSeg)){
    /* 本線＝バス停一覧の並び。登校は先頭から、下校は②下校便で並べた順（gekou_seq）。
       ⚠️ 以前は「登校の逆順」だったため、下校がロの字で戻るコースでは
       到着地が登校の1番目になってしまっていた（2026-08-24 修正） */
    const stops = _stops();
    const src = (selRSeg==='登校')
      ? stops.filter(s=>!s.gekou_only)
      : _gekouStopIdx().map(i=>stops[i]);
    const cv = src.map(s=>{ const d=dmsToDecimal(s.coord); return d ? { name:s.name||'', lat:d.lat, lng:d.lng } : null; }).filter(Boolean);
    return cv.length ? { from:cv[0], to:cv[cv.length-1] } : { from:null, to:null };
  }
  const c   = _c() || {};
  const off = OFFICES[c.office_id];
  const gc  = off && dmsToDecimal(off.coord);
  const gar = gc ? { name:off.name||'車庫', lat:gc.lat, lng:gc.lng } : null;
  const ac  = (c.after_toukou==='他所移動') ? dmsToDecimal(c.after_toukou_coord) : null;
  const away = ac ? { name:(c.after_toukou_place||'他所'), lat:ac.lat, lng:ac.lng } : null;
  const hub = (selRSeg==='帰庫回送登校' || selRSeg==='出庫回送下校') ? (away || gar) : gar;
  // 本線から拾う（_kaiEnds と同じ拾い方にそろえる）
  const _mseg2 = (_kaiGroup()==='登校') ? '登校'
    : (selRSeg==='便間回送②' ? '下校②' : (selRSeg==='帰庫回送下校' ? _lastGekouSeg() : '下校①'));
  const raw = ((RPTS[String(selCourseId)]||{})[_rkey(_mseg2,null,null)]||[])
    .filter(p=>String(p.lat).trim()!=='' && String(p.lng).trim()!=='');
  const firstStop = raw.length ? num(raw.find(p=>p.is_stop) || raw[0]) : null;
  const lastPt    = raw.length ? num(raw[raw.length-1]) : null;
  switch(selRSeg){
    case '出庫回送登校': return { from:gar,    to:firstStop };
    case '帰庫回送登校': return { from:lastPt, to:hub       };
    case '出庫回送下校': return { from:hub,    to:firstStop };
    default:             return { from:lastPt, to:gar       };
  }
}
/** 貼り付け先の両端。①②から引くのが本筋で、引けないときだけ順に下がる。
 *  ① ①②から決まる地点（車庫・バス停・他所移動の行き先）
 *  ② いまこの道に入っている両端（①②の座標がまだ空のとき）
 *  ③ コピー元の両端（どちらも無いとき。⚠️を出す） */
function _pasteEnds(clipPts){
  const cur = _rpts().filter(p=>String(p.lat).trim()!=='' && String(p.lng).trim()!=='');
  const cv  = (clipPts||[]).filter(p=>String(p.lat).trim()!=='' && String(p.lng).trim()!=='');
  const want = _endPtsHere();
  const pick = (w, mine, theirs) => {
    if(w) return { pt:w, src:'①主要情報・登校便' };
    if(mine) return { pt:mine, src:'いまの道' };
    if(theirs) return { pt:theirs, src:'コピー元' };
    return { pt:null, src:'' };
  };
  return {
    from: pick(want.from, cur[0], cv[0]),
    to:   pick(want.to,   cur[cur.length-1], cv[cv.length-1])
  };
}
/** 貼り付けも1つ。行を選んでいるかどうかで動きが変わる。
 *  ・行を選んでいない … 中（2番目〜最後から2番目）を入れ替える。両端はそのまま
 *  ・行を選んでいる   … その行の上に差し込む
 *  どちらでも**出発地と到着地は変わらない**。両端は①②で決まっているため
 *  （2026-08-21 八重樫さんの案で、2つあったボタンを1つにまとめた） */
function rptClipPaste(){
  const o = rptClipGet();
  if(!o){ _saveMsg('コピーされた地点がありません。先に「📋 コピー」を押してください。', false); return; }
  if(!selCourseId){ _saveMsg('先にコースを選んでください。', false); return; }
  rptSyncFromInputs();
  const pts  = _rpts();
  const lock = _rptLockState();
  const cp = p => ({ name:p.name||'', lat:p.lat, lng:p.lng,
                     is_stop:!!p.is_stop, split_here:!!p.split_here, note:p.note||'' });
  const add = o.pts.map(cp);

  /* ── 行を選んでいる＝その上に差し込む ── */
  if(rptSelIdx != null){
    const at = Math.max(0, Math.min(rptSelIdx, pts.length));
    if(lock.from && at === 0){
      _saveMsg('出発地の前には差し込めません。ここは出発地「' + (pts[0].name||'名前なし') + '」です。'
        + '出発地は「①主要情報・登校便」タブ（車庫・バス停・登校後の行き先）で決まります。'
        + '入れたい場所の行をクリックしてから押してください。', false); return; }
    pts.splice(at, 0, ...add);
    rptSelIdx = null; rptPick = {};
    renderEditor();
    _saveMsg(add.length + '地点を ' + (at+1) + '番から差し込みました。地図で道を確かめてから「保存」を押してください。', true);
    return;
  }

  /* ── 行を選んでいない＝中を入れ替える ── */
  const ends = _pasteEnds(o.pts);
  if(!ends.from.pt || !ends.to.pt){
    _saveMsg('出発地か到着地が決められません。「①主要情報・登校便」タブで車庫・バス停の座標を入れてから貼り付けてください。'
      + '（入れたい場所の行をクリックしてから押すと、差し込みになります）', false); return;
  }
  const mk = p => ({ name:p.name||'', lat:String(p.lat), lng:String(p.lng),
                     is_stop:true, split_here:false, note:'' });
  const now = pts.length;
  const next = [mk(ends.from.pt)].concat(add, [mk(ends.to.pt)]);
  if(!confirm(
      'コピーした地点　' + add.length + '地点\n　　' + _clipLabel(o) + '\n'
    + '\n貼り付け先\n　　' + _clipHere() + '\n'
    + '\n　出発地　' + (ends.from.pt.name || '名前なし') + '（変わりません）\n'
    + '　中の道　' + add.length + '地点に入れ替えます'
    + (now ? '（いまの中の' + Math.max(0, now-(lock.from?1:0)-(lock.to?1:0)) + '地点は消えます）' : '') + '\n'
    + '　到着地　' + (ends.to.pt.name || '名前なし') + '（変わりません）\n'
    + '\n差し込みたいだけなら「いいえ」を押し、入れたい場所の行をクリックしてから押し直してください。\n'
    + '\nよろしいですか。（この時点ではまだ保存されません）')) return;
  RPTS[String(selCourseId)][_rkey()] = next;
  rptSelIdx = null; rptPick = {};
  renderEditor();
  _saveMsg('中を' + add.length + '地点に入れ替えました（出発地と到着地はこのコースのまま）。地図で道を確かめてから「保存」を押してください。', true);
}

function rptPickToggle(i, el){
  rptSyncFromInputs();
  if(el.checked) rptPick[i] = true; else delete rptPick[i];
  renderEditor();
}
function rptPickNone(){ rptPick = {}; renderEditor(); }
/* 「全部」のチェック欄は置かない。チェックが無ければ中をまとめてコピーするので、
   同じことが2通りあると迷うだけだった（2026-08-21 八重樫さんの指摘） */

/* ===== 場所帳（①の他所移動・③の乗降場所を使い回す） =====
   同じ場所を何コースでも使う。
   ・登校後の他所移動：大塚ろう学校の各コースは、どれも「前野原温泉 さやの湯処」へ行く
   ・添乗員の乗降場所：久我山の複数車両が、世田谷の車両が乗せた添乗員を受け取る同じ場所へ向かう
   そのたびに座標を調べ直すのは無駄なので、**すでにこのシステムに入っている場所**を選べるようにする
   （2026-08-21 八重樫さんの要望）。
   ⚠️ 控え（コピー）ではなく**その場の一覧**にしてある。
      保存前の入力もそのまま出るし、どこかで直せば全部の一覧に反映される。 */
let PLACEBOOK = [];
function placeBook(){
  const map = {};
  const add = (name, addr, coord, where) => {
    name = String(name||'').trim(); coord = String(coord||'').trim();
    if(!name || !coord || !dmsToDecimal(coord)) return;   // 座標が読めないものは出さない
    const k = name + '|' + coord;
    if(!map[k]) map[k] = { name, addr:String(addr||'').trim(), coord, uses:[] };
    if(!map[k].addr && addr) map[k].addr = String(addr).trim();
    if(where && map[k].uses.indexOf(where) < 0) map[k].uses.push(where);
  };
  COURSES.forEach(c=>{
    if(c.after_toukou === '他所移動')
      add(c.after_toukou_place, c.after_toukou_addr, c.after_toukou_coord, courseLabel(c)+'（登校後）');
  });
  Object.keys(SCEN).forEach(cid=>{
    const c = COURSES.find(x=>String(x.id)===String(cid));
    (SCEN[cid]||[]).forEach(s=>(s.pts||[]).forEach(p=>
      add(p.name, p.address, p.coord, (c?courseLabel(c):'コース'+cid)+'（'+(s.label||'送迎')+'）')));
  });
  return Object.keys(map).map(k=>map[k]).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ja'));
}
/** 場所を選ぶ小さな選択欄。onchange に呼び出し先を渡す */
function placePickHtml(call){
  if(!PLACEBOOK.length) return '';
  const opts = PLACEBOOK.map((p,i)=>{
    const n = p.uses.length;
    return `<option value="${i}">${escHtml(p.name)}${n?`（${escHtml(p.uses[0])}${n>1?' ほか'+(n-1)+'件':''}）`:''}</option>`;
  }).join('');
  return `<select onchange="${call}" title="すでにこのシステムに入っている場所から選ぶと、名前・住所・座標がまとめて入ります"
    style="flex:0 0 auto;max-width:200px;font-size:12px;padding:4px 6px;">
    <option value="">📍 登録済みの場所…</option>${opts}</select>`;
}
function _placePicked(el){ const p = PLACEBOOK[Number(el.value)]; el.value=''; return p||null; }
/** ①の登校後の他所移動へ入れる */
function pickPlaceAfter(el){
  const p = _placePicked(el); if(!p) return;
  const c = _c(); if(!c) return;
  c.after_toukou_place = p.name; c.after_toukou_addr = p.addr; c.after_toukou_coord = p.coord;
  renderEditor();
  _saveMsg(`「${p.name}」を入れました。「保存」を押すまでは反映されません。`, true);
}
/** ③の乗降場所へ入れる */
function pickPlaceScen(si, pi, el){
  const p = _placePicked(el); if(!p) return;
  const s = _scenList()[si]; if(!s || !s.pts[pi]) return;
  s.pts[pi].name = p.name; s.pts[pi].address = p.addr; s.pts[pi].coord = p.coord;
  renderEditor();
  _saveMsg(`「${p.name}」を入れました。「保存」を押すまでは反映されません。`, true);
}


/* ===== Googleマップの道案内リンク =====
   実際にGoogleマップへ渡して確かめたこと（2026-08-19）：
   ・`?api=1&waypoints=…` の形式は経由地9か所まで。10個以上渡すと超えた分は黙って捨てられる
   ・地点を「/」で並べる形式（/maps/dir/緯度,経度/緯度,経度/…）なら**44か所まで通った**。
     こちらを使う。狙った道を通らせるには地点を密に置くしかないため、9か所では足りない
   ・指定しないと首都高を使う（六郷→大塚ろう学校で34.0km・有料区間あり）。
     data=…!1b1!2b1… を付けると一般道だけの28.9kmになる */
const RPT_MAX_VIA = 44;   // 実測で通った数。これを超えるかは未確認なので目安として警告に使う

/** 区間に切り分ける。切り方は2通りあり、画面では両方出す。
 *  byStop=false（通し）… 「区切」だけで切る。区切が無ければ**全体を1本**で開く
 *  byStop=true （バス停ごと）… 「区切」に加えてバス停でも切る。運転手がバス停ごとに開く用
 *
 *  ・区切（切）  … その地点で終わり、**次の地点から**新しい区間（地点を共有しない）。
 *                  Uターンのように、地点と地点の間をナビに任せられないときに使う
 *  ・バス停 … その地点を前後の区間で**共有**する（停まって、そこから続ける）  */
function rptLegs(byStop){
  const pts=_rpts().filter(p=>String(p.lat).trim()!==''&&String(p.lng).trim()!=='');
  if(pts.length<2) return [];
  const mk=(a,b)=>({
    from: pts[a].name || `${a+1}番目`,
    to:   pts[b].name || `${b+1}番目`,
    cut:  !!pts[b].split_here,      // この区間が「切」で終わるか（画面の表示に使う）
    pts:  pts.slice(a, b+1)
  });
  const legs=[]; let start=0;
  for(let i=1;i<pts.length;i++){
    const last=(i===pts.length-1);
    if(pts[i].split_here){          // 切：ここで終わって、次から仕切り直す
      if(i>start) legs.push(mk(start,i));
      start=i+1;
    } else if(byStop && pts[i].is_stop && !last){   // バス停：ここで区切り、同じ地点から続ける
      if(i>start) legs.push(mk(start,i));
      start=i;
    } else if(last){
      if(i>start) legs.push(mk(start,i));
    }
  }
  return legs;
}
/** 隣り合う2地点の順番が逆になっていないか調べる。
 *  入れ替えたときに道のりが目に見えて短くなるなら、順番が逆の可能性が高い。
 *  （差し込む位置を1つ間違えると起きる。2026-08-19 実際に発生した）
 *  Uターンのように短い距離で折り返す場合は差が出ないので、誤検出しない。 */
const RPT_SWAP_KM = 0.5;   // これ以上短くなるなら知らせる
function rptOrderWarnings(){
  const pts=_rpts().map((p,i)=>({...p, idx:i}))
                   .filter(p=>String(p.lat).trim()!==''&&String(p.lng).trim()!=='');
  const D=(a,b)=>rptHaversine({lat:Number(a.lat),lng:Number(a.lng)},{lat:Number(b.lat),lng:Number(b.lng)});
  const out=[];
  // 両隣がある組だけを見る。先頭・末尾を入れ替えるのは「順番の誤り」ではなく
  // 出発地・目的地そのものの変更なので、判定に混ぜると誤って知らせてしまう
  // （学校の裏門へ回り込むために最後だけ south へ下がる、といった正しい動きが引っかかった）
  for(let i=1;i+2<pts.length;i++){
    // i と i+1 を入れ替えると、前後との繋がりだけが変わる（i↔i+1 の間は共通なので相殺される）
    const gain = (D(pts[i-1],pts[i]) + D(pts[i+1],pts[i+2]))
               - (D(pts[i-1],pts[i+1]) + D(pts[i],pts[i+2]));
    if(gain>RPT_SWAP_KM) out.push({ a:pts[i].idx+1, b:pts[i+1].idx+1, km:gain });
  }
  return out;
}

/* 地点を「/」で並べる形式のURLを組み立てる。
   末尾の data=!4m5!4m4!2m2!1b1!2b1!3e0 は、Googleマップの設定画面で
   「高速道路を利用しない」「有料道路を利用しない」にチェックを入れたときと同じ状態を表す
   （!1b1=高速を使わない ／ !2b1=有料を使わない ／ !3e0=車）。 */
function rptLegUrl(leg){
  const c=leg.pts.map(p=>`${Number(p.lat)},${Number(p.lng)}`);
  return 'https://www.google.com/maps/dir/' + c.join('/') + '/data=!4m5!4m4!2m2!1b1!2b1!3e0';
}
/** 1地点だけをGoogleマップで開く。「この座標はどこか」を確かめるため。
 *  区間ごとの道案内（rptOpenLeg）とは別で、こちらは場所そのものを見る
 *  （2026-08-21 八重樫さんの要望：経由地をコピーする前に場所を確かめたい） */
function rptMapPt(i){
  rptSyncFromInputs();
  const p = _rpts()[i];
  if(!p){ return; }
  const la = Number(String(p.lat).trim()), ln = Number(String(p.lng).trim());
  if(String(p.lat).trim()==='' || String(p.lng).trim()==='' || !isFinite(la) || !isFinite(ln)){
    _saveMsg((i+1)+'番の座標が空か、数字になっていません。', false); return;
  }
  window.open('https://www.google.com/maps/search/?api=1&query=' + la + ',' + ln, '_blank');
}
function rptOpenLeg(i, byStop){
  rptSyncFromInputs();
  const legs=rptLegs(byStop);
  if(!legs[i]){ _saveMsg('地点を2つ以上入れてください。', false); return; }
  window.open(rptLegUrl(legs[i]), '_blank');
}

  /* 2026-08-24　区間ボタンは、曲がり角を足す作業中に何度も押すので固定領域に残す（legRowMain）。

  const legRowWhole = '';

/** うっかり全消しを防ぐ。保存は「消してから入れ直す」作りなので、
 *  入れ直す中身が空で、かつDBに中身があるときだけ確認をとる。
 *  （2026-08-19 六郷コースのバス停5件が、画面が空の状態の保存で消えた） */
async function _confirmWipe(path, newCount, label){
  if(newCount>0) return true;                       // 入れ直す中身があるなら従来どおり
  try{
    const r = await fetch(`${REST_URL}/${path}&select=id&limit=1`, { headers:getH() });
    if(!r.ok) return true;                          // 数えられないときは止めない
    const cur = await r.json();
    if(!Array.isArray(cur) || !cur.length) return true;   // もともと空なら確認不要
  }catch(e){ return true; }
  return confirm(`⚠️ ${label}が画面上で空になっています。\n\n`
    + `このまま保存すると、保存済みの${label}がすべて消えます。\n`
    + `画面がまだ読み込めていないだけの可能性があります。\n\n`
    + `本当に消してよろしいですか？`);
}

/* 保存が二重に走らないようにする鍵。
   2026-08-19：保存に反応が無いため何度も押され、1回目の「保存後の読み直し」が
   バッファを空にした瞬間に2回目がバス停を読み、空だと判断して削除してしまった。 */
let _saving = false;

/* 🔴 マスタを保存したら、便にも必ず反映する（2026-08-26 八重樫さんの指示）。
   正本：業務管理システム_マスタ連動の原則

   > とにかくマスタの情報を重要視してください。マスタが変わったときに配置画面は変わらないといけません。
   > 下見はマスタを保存する前でないと整合性が取れません。
   > 保存後「反映しますか」の問いに拒否ができるのはデータが二重になってしまうことになります。

   ⚠️ だから、この順序でなければならない。
       ① 保存する前に、便がどう変わるかを見せる（preview_duty_sync。1件も書き換えない）
       ② 「保存して反映する」を押したら、マスタを保存し、続けて必ず便へ反映する
       ③ 「やめる」なら、マスタも保存しない
   ⚠️ 「保存したけど反映しない」は選べない。選べると、マスタと便が食い違ったまま残る。
   ⚠️ 反映するのは「版の適用開始日以降」かつ「今日以降」だけ。過去は1件も触らない。 */

/** 画面がいま持っている日課（保存したらこうなる、という中身） */
function _pendingForms(){
  const key = String(selCourseId);
  return (FORMS[key] || [])
    .filter(f => (f.form_name||'').trim())
    .map(f => ({ form_name: (f.form_name||'').trim(),
                 gekou_departures: (f.gekou_departures||[]).filter(t => (t||'').trim()) }));
}
/** 画面がいま持っているバス停から、登校便の最初の時刻（＝便の時刻になる） */
function _pendingToukou(){
  const t = _stops().filter(s => !s.gekou_only)
                    .map(s => (s.toukou_time||'').trim()).filter(Boolean).sort();
  return t.length ? t[0] : null;
}
/** 保存したら便がどう変わるかを調べる（何も書き換えない） */
async function _previewSync(){
  const v = curVer();
  if(!v) return null;
  try{
    const r = await fetch(`${REST_URL}/rpc/preview_duty_sync`, { method:'POST', headers:getH(),
      body: JSON.stringify({ p_course: selCourseId, p_from: String(v.valid_from),
                             p_forms: _pendingForms(), p_toukou: _pendingToukou() }) });
    if(!r.ok) return { _ng: (await r.text()).slice(0,200) };
    return await r.json();
  }catch(e){ return { _ng: e.message }; }
}
function _syncLines(p){
  const L = [];
  const d = s => String(s).slice(5).replace('-','/');
  (p.retimed||[]).slice(0,20).forEach(x => L.push(
    `　${d(x.work_date)} ${x.segment}　${x.old||'—'} → ${x.new||'—'}` + (x.crew ? `（${x.crew} はそのまま）` : '')));
  if((p.retimed||[]).length > 20) L.push(`　ほか ${p.retimed.length-20}件`);
  (p.added||[]).slice(0,10).forEach(x => L.push(`　${d(x.work_date)} ${x.segment} ${x.start_time||''} を作ります`));
  if((p.added||[]).length > 10) L.push(`　ほか ${p.added.length-10}件`);
  (p.removed||[]).slice(0,20).forEach(x => L.push(
    `　${d(x.work_date)} ${x.segment} ${x.start_time||''} を取り消します` + (x.crew ? `　⚠️ ${x.crew} が外れます` : '')));
  if((p.removed||[]).length > 20) L.push(`　ほか ${p.removed.length-20}件`);
  (p.fixed||[]).slice(0,10).forEach(x => L.push(`　${d(x.work_date)} ${x.segment}　${x.what}を直します`));
  if((p.fixed||[]).length > 10) L.push(`　ほか ${p.fixed.length-10}件`);
  return L;
}
/** 保存の前に出す確認。true が返ったときだけ保存へ進む */
function _confirmSync(p){
  const n = (p.retimed_count|0) + (p.added_count|0) + (p.removed_count|0) + (p.fixed_count|0);
  if(!n) return true;                               // 便に影響が無ければ黙って保存
  const kept = (p.kept||[]).slice(0,10)
    .map(x => `　${String(x.work_date).slice(5).replace('-','/')} ${x.segment}　${x.why}`);
  const msg =
    `保存すると、この変更が便にも反映されます。\n`
  + `　${p.course}　${p.from} 以降（今日より前の便は触りません）\n\n`
  + (p.retimed_count ? `【時刻を直す】${p.retimed_count}件　乗務員はそのまま残ります\n` : '')
  + (p.added_count   ? `【便を作る】${p.added_count}件\n` : '')
  + (p.removed_count ? `【便を取り消す】${p.removed_count}件　⚠️ 配置されている乗務員も外れます\n` : '')
  + (p.fixed_count   ? `【車両・必要人数を直す】${p.fixed_count}件\n` : '')
  + '\n' + _syncLines(p).join('\n') + '\n'
  + (kept.length ? `\n【触らないもの】\n${kept.join('\n')}\n` : '')
  + `\n保存して反映しますか。\n`
  + `　「キャンセル」を押すと、マスタも保存しません。`;
  return confirm(msg);
}
/** 保存のあとに必ず呼ぶ。マスタの内容を便へ反映する */
async function _applySync(){
  const v = curVer();
  if(!v) return '';
  try{
    const r = await fetch(`${REST_URL}/rpc/sync_duties_from_master`, { method:'POST', headers:getH(),
      body: JSON.stringify({ p_course: selCourseId, p_from: String(v.valid_from), p_apply: true }) });
    const t = await r.text();
    if(!r.ok){ let j={}; try{ j=JSON.parse(t); }catch(e){}
      return `　⚠️ 便への反映ができませんでした：${((j&&j.message)||t).slice(0,120)}`; }
    const p = JSON.parse(t);
    const n = (p.retimed_count|0) + (p.added_count|0) + (p.removed_count|0) + (p.fixed_count|0);
    if(!n) return '';
    if(p.removed_count){
      alert(`便を取り消しました（${p.removed_count}件）。配置されていた乗務員も外れています。\n`
        + `（従業員の登録は変わりません。外した記録は変更履歴に残ります）\n\n`
        + (p.removed||[]).map(x => `　${x.work_date} ${x.segment} ${x.start_time||''}　外れた配置：${x.crew||'なし'}`).join('\n'));
    }
    return `（便へ反映：時刻${p.retimed_count}件／作成${p.added_count}件／取り消し${p.removed_count}件／車両・人数${p.fixed_count}件）`;
  }catch(e){ return `　⚠️ 便への反映ができませんでした：${e.message}`; }
}

async function saveCourse(){
  if(_saving){ _saveMsg('保存中です。そのままお待ちください。', false); return; }
  const c=_c(); if(!c) return;
  if(!selVerId){ _saveMsg('版がありません。まず版を作成してください。', false); return; }
  if(!canEditVer()){ _saveMsg('過去の版は保存できません。「適用中」か「この日から」の版を選んでください。', false); return; }
  const key=String(c.id);
  let _stopsChanged = [];   // バス停一覧が変わった側（保存後に④の確認をうながす）
  let _flagOn = [], _flagOff = [];   // ②に合わせて④のバス停の印を付けた／外したバス停
  let _calRenamed = [];              // 予定表の日課名を付け替えたもの
  // 押している間ずっと分かるようにする（無反応に見えて何度も押されるのを防ぐ）
  _saving = true;
  const _btn = document.getElementById('saveBtn');
  const _btnLabel = _btn ? _btn.textContent : '';
  if(_btn){ _btn.disabled = true; _btn.textContent = '⏳ 保存中… そのままお待ちください'; _btn.style.opacity = '0.7'; }
  _saveMsg('保存しています…', true);
  await ensureFreshToken();
  try{
    // 検証：時刻はあるのに日課名が空の行があれば中止（取りこぼし防止）
    /* ⚠️ 日課名が重なると、④の経路が同じ鍵になってどちらかが消える（2026-08-26） */
    {
      const nm = (FORMS[key]||[]).map(f=>(f.form_name||'').trim()).filter(Boolean);
      const dup = nm.filter((v,i)=>nm.indexOf(v) !== i);
      if (dup.length){
        _saveMsg('日課名が重なっています：' + [...new Set(dup)].join('、') + '。同じ名前があると「④ルート詳細」の道が消えてしまうため、別の名前にしてから保存してください。', false); return;
      }
    }
    if ((FORMS[key]||[]).some(f => !(f.form_name||'').trim() && (f.gekou_departures||[]).some(t=>t))){
      _saveMsg('日課名が空の行があります。A・B・C… の日課名を入れてから保存してください。', false); return;
    }
    /* 🔴 保存する前に、便がどう変わるかを見せる。ここで断られたらマスタも保存しない。
       保存してから「反映しますか」と聞くと、断られたときにマスタと便が食い違ったまま残る */
    {
      const _pv = await _previewSync();
      if(_pv && _pv._ng){
        if(!confirm('便への影響を調べられませんでした：' + _pv._ng + '\n\nこのまま保存しますか。\n（マスタだけ保存され、便は古いままになります）')) return;
      } else if(_pv && !_confirmSync(_pv)){
        _saveMsg('保存をやめました。マスタも便も変わっていません。', false); return;
      }
    }
    // 1) 登校時刻・有効フラグ（courses）
    const r1 = await fetch(`${REST_URL}/courses?id=eq.${c.id}`, { method:'PATCH', headers:getH(), body:JSON.stringify({ toukou_shussha:c.toukou_shussha||null, toukou_shukko:c.toukou_shukko||null, active:c.active, after_toukou:c.after_toukou||'帰庫', after_toukou_place:(c.after_toukou==='他所移動'?(c.after_toukou_place||null):null), after_toukou_addr:(c.after_toukou==='他所移動'?(c.after_toukou_addr||null):null), after_toukou_coord:(c.after_toukou==='他所移動'?(c.after_toukou_coord||null):null), gekou_shukko_lead:(c.gekou_shukko_lead==null?null:c.gekou_shukko_lead), gekou_haisha_lead:(c.gekou_haisha_lead==null?null:c.gekou_haisha_lead) }) });
    if(!r1.ok){ const t=await r1.text(); _saveMsg('「①主要情報・登校便」の保存に失敗：'+t.slice(0,100), false); return; }
    // 2) 下校フォーム（この年度・このコースを置き換え）
    const formsCount = (FORMS[key]||[]).filter(f=>(f.form_name||'').trim()).length;
    {
      const _fk = (FORMS[key]||[]).filter(f=>(f.form_name||'').trim()).map(f=>f.form_name.trim());
      if(!(await _confirmDrop(`course_schedule_forms?version_id=eq.${selVerId}`, 'form_name', _fk, '日課',
            x=>(x.form_name||''), x=>(x.form_name||'（名前なし）')))){
        _saveMsg('保存を中止しました。', false); return; }
    }
    const forms = (FORMS[key]||[]).filter(f=>(f.form_name||'').trim()).map(f=>({ id:(f.id==null?null:f.id), course_id:c.id, version_id:selVerId, form_name:f.form_name.trim(), gekou_departures:(f.gekou_departures||[]).filter(t=>t), after_toukou:(f.after_toukou||'')||null, after_toukou_place:(f.after_toukou==='他所移動'?(f.after_toukou_place||null):null), after_toukou_addr:(f.after_toukou==='他所移動'?(f.after_toukou_addr||null):null), after_toukou_coord:(f.after_toukou==='他所移動'?(f.after_toukou_coord||null):null), dep_overrides:(f.dep_overrides&&Object.keys(f.dep_overrides).length)?f.dep_overrides:{} }));
    // 2026-08-25：削除＋入れ直しを1つのDB関数にまとめた（00_データを壊さない書き方）
    { const r2=await fetch(`${REST_URL}/rpc/save_course_schedule_forms`, { method:'POST', headers:getH(),
        body:JSON.stringify({ p_course_id:c.id, p_version_id:selVerId, p_rows:forms }) });
      if(!r2.ok){ const t=await r2.text(); _saveMsg('「②下校便」（日課）の保存に失敗（元のデータは残っています）：'+t.slice(0,100), false); return; } }
    // 2.5) 日課名を変えていたら、予定表（月間予定）の日課名も付け替える
    {
      const ren = (FORM_RENAMES[key] || []).filter(r => r[0] && r[1] && r[0] !== r[1]);
      for(const [from, to] of ren){
        const rr = await fetch(`${REST_URL}/rpc/rename_course_form`, { method:'POST', headers:getH(),
          body:JSON.stringify({ p_course_id:c.id, p_from:from, p_to:to }) });
        if(rr.ok){ const n = await rr.json(); if(n) _calRenamed.push(`${from}→${to}（${n}日）`); }
        else { const t=await rr.text(); _saveMsg('予定表の日課名の付け替えに失敗：'+t.slice(0,100), false); return; }
      }
      if(ren.length) FORM_RENAMES[key] = [];
      await loadFormUsage(c.id);   // 名前を変えたあとの使用状況を読み直す
    }
    // 3) バス停・ルート（このコースを置き換え）
    const stopsCount = (STOPS[key]||[]).filter(s=>(s.name||'').trim()||(s.address||'').trim()).length;
    {
      /* ⚠️ 同じ名前で2行ある（登校用・下校専用）。名前だけで突き合わせない */
      const _sk = (STOPS[key]||[]).filter(s=>(s.name||'').trim()||(s.address||'').trim())
        .map(s=>((s.name||'').trim()+'|'+(s.gekou_only?'下校':'登校')));
      if(!(await _confirmDrop(`course_locations?version_id=eq.${selVerId}`, 'name,gekou_only,toukou_time', _sk, 'バス停',
            x=>((x.name||'')+'|'+(x.gekou_only?'下校':'登校')),
            x=>((x.name||'（名前なし）')+(x.gekou_only?'（下校専用）':'')+(x.toukou_time?(' '+x.toukou_time):''))))){
        _saveMsg('保存を中止しました。', false); return; }
    }
    let seq=0;
    const keep = (STOPS[key]||[]).filter(s=>(s.name||'').trim()||(s.address||'').trim());
    /* 下校の順番は、空行を抜いたあとの並びで 1,2,3… に振り直す。
       画面で ▲▼ したときの並びをそのまま保存するため（2026-08-24） */
    const gRank = new Map();
    keep.map((s,i)=>({s,i})).sort((a,b)=>{
      const A=(a.s.gekou_seq==null)?99999:a.s.gekou_seq, B=(b.s.gekou_seq==null)?99999:b.s.gekou_seq;
      return (A!==B)?(A-B):(a.i-b.i);
    }).forEach((x,k)=>gRank.set(x.i,k+1));
    const rows = keep.map((s,i)=>{
      const r = { id:(s.id==null?null:s.id), course_id:c.id, version_id:selVerId, name:(s.name||'').trim()||(s.address||'').trim(), address:(s.address||'').trim(),
                  toukou_time:s.toukou_time||null, gekou_offset:(s.gekou_offset==null?null:s.gekou_offset), gekou_only:!!s.gekou_only, coord:s.coord||null,
                  gekou_seq:gRank.get(i)||null, gekou_overrides:(s.gekou_overrides&&Object.keys(s.gekou_overrides).length)?s.gekou_overrides:{},
                  in_gekou:(s.gekou_offset!=null) };
      if(!s.gekou_only){ seq++; r.seq=seq; } else { r.seq=null; }
      return r;
    });
    // 2026-08-25：削除＋入れ直しを1つのDB関数（save_course_locations）にまとめた。
    // 途中で失敗しても元のデータが残る（消えたのに入れ直せない、という事故を防ぐ）。
    const r3 = await fetch(`${REST_URL}/rpc/save_course_locations`, { method:'POST', headers:getH(),
      body:JSON.stringify({ p_course_id:c.id, p_version_id:selVerId, p_rows:rows }) });
    if(!r3.ok){ const t=await r3.text(); _saveMsg('バス停・登校ルートの保存に失敗（元のデータは残っています）：'+t.slice(0,100), false); return; }
    // 3.5) 経路点（この版の4便ぶんをまとめて置き換え）
    rptSyncFromInputs();
    /* ⚠️ 2026-08-26：②を変えても④の本線を勝手に作り直さないようにした。
       それまでは「バス停の名前か並びが変わったら④を作り直す（曲がり角の目印も消える）」
       という動きだった。八重樫さんの当初のご趣旨は
       「バス停の順番が総入れ替えになり、最終バス停まで変わったときは、
         残っているルートに価値がないので消えてよい」というもので、
       名前を1文字直しただけで消えてよい、という意味ではなかった。
       これからは④の画面でバス停の設定との食い違いを知らせ、
       「そのバス停だけ足し引きする」か「作り直す」かを人が選ぶ。 */
    {
      const nowSig  = _stopsOrderSig(keep);
      const origSig = STOPS_ORIG_SIG[key] || { toukou:'', gekou:'' };
      if(nowSig.toukou !== origSig.toukou) _stopsChanged.push('登校');
      if(nowSig.gekou  !== origSig.gekou)  _stopsChanged.push('下校');
    }
    /* ②を保存したら、④のバス停の印を②に合わせる（2026-08-26 八重樫さん）。
       　「この④ルート詳細は②の各日課にあわせて反映しなければなりません。
       　　編集ののちチェックが外れるバス停もあればチェックが加わるバス停もあると思います」

       日課・便ごとに、②が言う「この便で通るバス停」と突き合わせる：
         ②の下校に入っている　かつ　その便で「通らない」に入っていない → バス停の印を付ける
         そうでない                                                  → バス停の印を外す

       ⚠️ 地点は消さない。道をたどる目印として残す。
       ⚠️ バス停一覧に無い名前（曲がり角の目印など）は触らない。
       ⚠️ ④に地点そのものが無いバス停は、ここでは足さない（道の形が変わるため）。
          ④の食い違いの枠から「バス停にする」を押していただく。 */
    {
      const inGekou = {};
      keep.forEach(s=>{ const n=(s.name||'').trim(); if(n) inGekou[n] = (s.gekou_offset != null); });
      // 下校の並びの先頭は学校＝出発地。時刻を持たないがバス停のまま残す
      let schoolName = '';
      { const ord = _gekouIdxOf(keep); if(ord.length) schoolName = (keep[ord[0]].name||'').trim(); }
      const fmap = {};
      (FORMS[key]||[]).forEach(f=>{
        const nm = (f.form_name||'').trim(); if(!nm) return;
        fmap[nm] = { deps:(f.gekou_departures||[]).filter(t=>t),
                     ov:(f.dep_overrides && typeof f.dep_overrides==='object') ? f.dep_overrides : {} };
      });
      const box = RPTS[key] || {};
      const off = {}, on = {};
      Object.keys(box).forEach(kk=>{
        const q  = _rkeyParse(kk);
        const gi = R_GEKOU_MAIN.indexOf(q.seg);
        if(gi < 0) return;   // 下校の本線だけ（回送はバス停一覧と対応しない）
        let skip = [];
        const f = q.form ? fmap[q.form] : null;
        if(f){ const t = f.deps[gi]; const o = t ? f.ov[t] : null;
               skip = (o && Array.isArray(o.skip)) ? o.skip : []; }
        (box[kk]||[]).forEach(p=>{
          const n = (p.name||'').trim();
          if(!n || n === schoolName) return;
          if(!(n in inGekou)) return;            // バス停一覧でない＝曲がり角の目印。触らない
          const want = inGekou[n] && skip.indexOf(n) < 0;
          if(p.is_stop && !want){ p.is_stop = false; off[n] = true; }
          else if(!p.is_stop && want){ p.is_stop = true; on[n] = true; }
        });
      });
      _flagOff = Object.keys(off);
      _flagOn  = Object.keys(on);
    }
    const rptRows=[];
    // 回送の鍵は「便|シナリオid|ルート名」。本線は便の名前だけ
    Object.keys(RPTS[key]||{}).forEach(kk=>{
      const { form, seg, scen, route } = _rkeyParse(kk);
      if(R_SEGS.indexOf(seg) < 0) return;
      const list=((RPTS[key]||{})[kk]||[]).filter(p=>String(p.lat).trim()!==''&&String(p.lng).trim()!=='');
      /* ⚠️ 新しく足した地点は id が無いので、そのまま追加される。
         道を描くと順番（seq）は毎回変わるが、番号で対応づけるので並べ替えは更新になる。 */
      list.forEach((p,i)=>rptRows.push({ id:(p.id==null?null:p.id), course_id:c.id, version_id:selVerId, form_name:form, segment:seg,
        scenario_id:scen, route_name:route, seq:i+1,
        name:(p.name||'').trim()||null, lat:Number(p.lat), lng:Number(p.lng), is_stop:!!p.is_stop, split_here:!!p.split_here, note:(p.note||'').trim()||null }));
    });
    if(!(await _confirmWipe(`course_route_points?version_id=eq.${selVerId}`, rptRows.length, '経路の地点'))){ _saveMsg('保存を中止しました。', false); return; }
    // 2026-08-25：削除＋入れ直しを1つのDB関数にまとめた（00_データを壊さない書き方）
    { const r35=await fetch(`${REST_URL}/rpc/save_course_route_points`, { method:'POST', headers:getH(),
        body:JSON.stringify({ p_course_id:c.id, p_version_id:selVerId, p_rows:rptRows }) });
      if(!r35.ok){ const t=await r35.text(); _saveMsg('「④ルート詳細」の保存に失敗（元のデータは残っています）：'+t.slice(0,100), false); return; } }
    // 4) 送迎シナリオ（このコースを置き換え）— scenarios削除で points/settings も連動削除
    const scenHasContent = s => s.pts.some(p=>(p.name||'').trim()||(p.address||'').trim()||(p.coord||'').trim())
      || Object.keys(s.ps||{}).some(ph=>((s.ps[ph]||{}).shussha||'').trim()||((s.ps[ph]||{}).shukko||'').trim())
      || (s.label||'').trim();
    const scens = (SCEN[key]||[]).filter(scenHasContent);
    if(!(await _confirmWipe(`course_scenarios?course_id=eq.${c.id}`, scens.length, '添乗員送迎'))){ _saveMsg('保存を中止しました。', false); return; }

    /* ⚠️ シナリオの id は**残す**こと（2026-08-21 判明）。
       配置（`duties.scenario_id`）と回送の経路（`course_route_points.scenario_id`）が
       id で参照している。毎回 削除→作成 していたため、
       ・配置で選ばれている日があるとFK違反でDELETEが失敗し、重複が作られる
       ・回送の経路が道連れで消える（ON DELETE CASCADE）
       そこで「消えたものだけ削除・残るものは更新・新しいものだけ作成」に変えた */
    const keepIds = scens.map(s=>s.dbId).filter(Boolean);
    const delQ = keepIds.length
      ? `course_scenarios?course_id=eq.${c.id}&id=not.in.(${keepIds.join(',')})`
      : `course_scenarios?course_id=eq.${c.id}`;
    const rdel = await fetch(`${REST_URL}/${delQ}`, { method:'DELETE', headers:getH() });
    if(!rdel.ok){
      const t = await rdel.text();
      _saveMsg('使わなくなった添乗員送迎を消せませんでした：'+t.slice(0,120)
             + '／配置でその送迎が選ばれている日があると消せません。先に配置管理で外してください。', false);
      return;
    }

    const sidList = [];   // scens と同じ並びの scenario_id
    for(let i=0;i<scens.length;i++){
      const s = scens[i];
      const row = { course_id:c.id, segment:s.segment, label:(s.label||'').trim(), seq:i+1 };
      if(s.dbId){
        const r = await fetch(`${REST_URL}/course_scenarios?id=eq.${s.dbId}`, { method:'PATCH', headers:getH(), body:JSON.stringify(row) });
        if(!r.ok){ const t=await r.text(); _saveMsg('「③添乗員送迎」の更新に失敗：'+t.slice(0,100), false); return; }
        sidList.push(s.dbId);
      }else{
        const r = await fetch(`${REST_URL}/course_scenarios`, { method:'POST', headers:getH(), body:JSON.stringify([row]) });
        if(!r.ok){ const t=await r.text(); _saveMsg('「③添乗員送迎」の保存に失敗：'+t.slice(0,100), false); return; }
        const ins = await r.json();
        const nid = ins && ins[0] && ins[0].id;
        if(!nid){ _saveMsg('「③添乗員送迎」の保存に失敗しました（idが返りません）。', false); return; }
        s.dbId = nid; sidList.push(nid);
      }
    }

    // 乗降場所と局面の設定は入れ替える（シナリオ本体が残るので、こちらは明示的に消す）
    // 2026-08-25：2つの表の削除＋入れ直しを1つのDB関数にまとめた（00_データを壊さない書き方）。
    //   片方だけ消えた状態が起こらない。シナリオが無いときは空で呼び、乗降場所だけ消す。
    {
      const allPts=[], allPs=[];
      scens.forEach((s,idx)=>{
        const sid = sidList[idx]; if(!sid) return;
        const seqByPhase={};
        s.pts.filter(p=>(p.name||'').trim()||(p.address||'').trim()||(p.coord||'').trim()).forEach(p=>{
          seqByPhase[p.phase]=(seqByPhase[p.phase]||0)+1;
          /* 🔴 番号を返して、消して入れ直さずに済むようにする（2026-09-01）
             ⚠️ 番号が毎回変わると、変更の記録が「消して入れ直しただけ」で埋まり、
             　 通勤経路から場所を番号でつなぐこともできない。
             新しく足した行は id が無いので、そのまま追加される。 */
          allPts.push({ id:(p.id==null?null:p.id), course_id:c.id, scenario_id:sid, phase:p.phase, kind:p.kind||'乗車', seq:seqByPhase[p.phase],
                        name:(p.name||'').trim(), address:(p.address||'').trim(), coord:(p.coord||'').trim()||null,
                        bus_time:(s.segment==='下校'?null:(p.bus_time||null)), time_lead:(s.segment==='下校'?(p.time_lead==null?null:p.time_lead):null) });
        });
        Object.keys(s.ps||{}).forEach(ph=>{ const v=s.ps[ph]||{}; if((v.shussha||'').trim()||(v.shukko||'').trim()||v.shukko_lead!=null){ allPs.push({ scenario_id:sid, phase:ph, shussha:v.shussha||null, shukko:(s.segment==='下校'?null:(v.shukko||null)), shukko_lead:(s.segment==='下校'?(v.shukko_lead==null?null:v.shukko_lead):null) }); } });
      });
      const rtp = await fetch(`${REST_URL}/rpc/save_course_transfer_and_phase`, { method:'POST', headers:getH(),
        body:JSON.stringify({ p_course_id:c.id, p_scenario_ids:sidList, p_points:allPts, p_settings:allPs }) });
      if(!rtp.ok){ const t=await rtp.text(); _saveMsg('「③添乗員送迎」（乗降場所・局面）の保存に失敗（元のデータは残っています）：'+t.slice(0,100), false); return; }
    }
    // 保存後の読み直しは**このコースだけ**にする。
    // 以前は毎回64コース分（バス停331行・日課238行）を取り直しており、
    // 1回の保存に数秒かかって「押しても反応がない」状態になっていた（2026-08-19）
    /* 🔴 保存したら、それより前には戻さない（2026-09-02 岩﨑さん・八重樫さん） */
    undoClear();
    await Promise.all([ loadVersionInto(c.id, selVerId), loadScenarios() ]);
    renderCourseList(); renderEditor();
    // ⚠️ 「保存しました」は**画面を作り直したあと**に出す。
    //    renderEditor() は編集欄をまるごと作り直すので、先に出すとメッセージごと消える。
    //    2026-08-19 に読み直しを速くしたことで、見える間もなく消えるようになっていた
    //    （2026-08-21 八重樫さんが「保存しましたが表示されませんでした」と発見）
    /* 🔴 訂正で直したときは、理由を記録に残す（2026-08-27）
       ⚠️ audit_log は「何が変わったか」を残すが「なぜ直したか」は残らない */
    if(_editMode === 'fix' && _fixReason){
      try{
        await fetch(`${REST_URL}/rpc/log_master_fix`, { method:'POST', headers:getH(),
          body: JSON.stringify({ p_course_id:c.id, p_version_id:selVerId, p_reason:_fixReason }) });
      }catch(e){ /* 記録できなくても保存は止めない */ }
    }
    _editMode = null; _fixReason = ''; _editOpen = false;   /* 保存したら、また見るだけに戻す */
    /* ⚠️ 画面の作り直しはこの数行前に済んでいる。ここで鍵をかけ直さないと、
       保存したのに編集できたままになる（2026-08-27 実装中に気づいた） */
    _renderEditBar(); _applyLock(); _loadImpact().then(_renderEditBar);
    const _syncMsg = await _applySync();   // 🔴 保存したら必ず反映する（断れない）
    _saveMsg('✅ 保存しました' + _syncMsg + (_calRenamed.length ? `（月間予定の日課名も付け替えました：${_calRenamed.join('・')}）` : '') + (_flagOn.length ? `（「④ルート詳細」で「${_flagOn.join('・')}」をバス停にしました）` : '') + (_flagOff.length ? `（「④ルート詳細」で「${_flagOff.join('・')}」のバス停の印を外しました。地点は道の目印として残しています）` : '') + (_stopsChanged.length ? `（⚠️ ${_stopsChanged.join('・')}のバス停が変わりました。④ルート詳細でバス停の設定との食い違いをご確認ください。④の道はそのまま残してあります）` : ''), true);
  }catch(e){ _saveMsg('保存エラー：'+e.message, false); }
  finally{
    // どの抜け方をしても必ず鍵を外し、ボタンを戻す
    _saving = false;
    const b=document.getElementById('saveBtn');
    if(b){ b.disabled=false; b.textContent = _btnLabel || '💾 このコースを保存'; b.style.opacity=''; }
  }
}

/* 配置管理の知らせから飛んできたとき、そのコース・その月を開く（2026-08-26）。
   例：unkou.html#course=72&tab=gekou ／ yotei.html#ym=2026-09&q=赤コース */
function _hashParams(){
  const o = {};
  (location.hash||'').replace(/^#/,'').split('&').forEach(kv=>{
    const i = kv.indexOf('=');
    if(i > 0){ try{ o[decodeURIComponent(kv.slice(0,i))] = decodeURIComponent(kv.slice(i+1)); }catch(e){} }
  });
  return o;
}
document.addEventListener('DOMContentLoaded', async () => {
  const ok = await initAuth(['super_admin','admin','operator','staff']);
  if (!ok) return;
  document.getElementById('courseSearch').addEventListener('input', renderCourseList);
  document.getElementById('activeOnly').addEventListener('change', renderCourseList);
  try{
    await loadCourses(); await loadVersions(); await loadStops(); await loadFormsLatest(); await loadScenarios(); await loadRoutePointsLatest();
    renderCourseList(); renderEditor();
    const _hp = _hashParams();
    if(_hp.q) document.getElementById('courseSearch').value = _hp.q;
    if(_hp.course && !isNaN(Number(_hp.course))){
      await selectCourse(Number(_hp.course));
      if(_hp.tab) setTab(_hp.tab);
      status('配置管理から開きました。食い違いの元をご確認ください。', true);
    } else {
      renderCourseList();
      status('準備ができました。コースを選んでください。', true);
    }
  }catch(e){ status('データ読み込みエラー：'+e.message, false); }
});

</script>
