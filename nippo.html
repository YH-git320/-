<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>添乗員業務日報</title>
<style>
  :root{
    --ink:#2d3b35;--ink-soft:#5c7066;--line:#c8d8cc;--bg:#f5f8f4;--card:#ffffff;
    --brand:#6b9e7e;--brand-dark:#4d7a5e;--brand-tint:#e4f0e8;
    --amber:#9a5f12;--amber-tint:#fbf0db;--danger:#a82d24;--ok:#2e7d52;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);font-size:19px;line-height:1.7;
    display:flex;flex-direction:column;min-height:100dvh;-webkit-text-size-adjust:100%;overflow-x:hidden;}
  .pbar-wrap{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px 9px;position:sticky;top:0;z-index:10;}
  .pbar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
  .pbar-title{font-size:16px;font-weight:800;color:var(--brand-dark);}
  .pbar-count{font-size:15px;font-weight:700;color:var(--ink-soft);}
  .pbar{height:9px;background:#e2e9eb;border-radius:9px;overflow:hidden;}
  .pbar > i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .25s ease;}
  main{flex:1;padding:16px 16px 24px;max-width:640px;margin:0 auto;width:100%;}
  .pagehead{font-size:23px;font-weight:800;color:var(--brand-dark);margin:2px 0 2px;}
  .pagesub{font-size:15px;color:var(--ink-soft);margin:0 0 16px;}
  .sec-h{font-size:16px;font-weight:800;color:#fff;background:var(--brand);border-radius:10px;
    padding:8px 14px;margin:20px 0 12px;}
  .fld{margin:0 0 16px;}
  .flabel{font-size:16px;font-weight:700;color:var(--ink-soft);margin:0 0 7px;}
  .fhint{font-size:14px;color:#8a9a92;margin:6px 0 0;}
  .roval{font-size:22px;font-weight:800;color:var(--ink);background:var(--brand-tint);
    border-radius:12px;padding:12px 16px;}
  .badge{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 9px;margin-left:7px;vertical-align:middle;}
  .badge.req{background:var(--danger);color:#fff;}
  .badge.pf{background:var(--brand-tint);color:var(--brand-dark);}
  input[type=text],input[type=number],input[type=time],input[type=date],textarea{
    width:100%;max-width:100%;font-size:22px;font-family:inherit;color:var(--ink);
    border:2px solid var(--line);border-radius:12px;background:#fff;padding:13px 15px;line-height:1.4;
    -webkit-appearance:none;appearance:none;}
  textarea{min-height:110px;resize:vertical;font-size:19px;}
  input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint);}
  .choices{display:flex;flex-wrap:wrap;gap:10px;}
  .choice{display:flex;align-items:center;gap:12px;text-align:left;
    font-size:19px;font-weight:700;font-family:inherit;color:var(--ink);
    background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;min-height:58px;flex:1;min-width:44%;}
  .choice .tick{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);
    display:grid;place-items:center;color:#fff;font-size:15px;}
  .choice.sel{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-dark);}
  .choice.sel .tick{background:var(--brand);border-color:var(--brand);}
  .route-disp{background:#f0f7f3;border:1px solid #cfe3d6;border-radius:12px;padding:10px 12px;margin:0 0 8px;}
  .route-disp .rt{font-size:13px;font-weight:700;color:var(--brand-dark);margin-bottom:6px;}
  .route-seg{display:flex;align-items:center;gap:8px;font-size:16px;padding:3px 0;}
  .route-seg .m{font-size:12px;background:var(--brand-tint);color:var(--brand-dark);border-radius:6px;padding:2px 7px;min-width:38px;text-align:center;}
  .route-seg .ar{color:#9bb0a3;}
  .route-seg .fare{margin-left:auto;color:var(--ink-soft);font-size:14px;}
  .route-disp.edit{background:#fff;}
  .rbtn{margin-top:10px;font-family:inherit;font-size:15px;font-weight:700;background:#fff;border:2px solid var(--brand);color:var(--brand-dark);border-radius:10px;padding:8px 14px;cursor:pointer;}
  .rbtn.done{background:var(--brand);color:#fff;border-color:var(--brand);}
  .rbtnrow{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;}
  .rbtnrow .rbtn{margin-top:0;}
  .seg-edit{border:1px solid #cfe3d6;border-radius:10px;padding:10px;margin-bottom:8px;background:#f7fbf8;}
  .seg-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .seg-line select.rs{width:auto;min-width:88px;font-size:17px;padding:9px 10px;}
  .seg-line input.rs{flex:1;min-width:88px;font-size:17px;padding:9px 10px;}
  .seg-line2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px;}
  .seg-line2 input.rs{font-size:17px;padding:9px 10px;}
  .rlink{font-family:inherit;font-size:13px;font-weight:700;background:#eef4ee;border:none;color:var(--brand-dark);border-radius:8px;padding:7px 11px;cursor:pointer;}
  .rlink.del{background:#fbe9e7;color:#a82d24;}
  .err{display:none;background:#fbe9e7;border:2px solid #eebab4;color:var(--danger);
    font-size:16px;font-weight:700;border-radius:12px;padding:12px 15px;margin-top:14px;}
  .err.show{display:block;}
  .nav{position:sticky;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);
    border-top:1px solid var(--line);padding:14px 16px;box-shadow:0 -6px 20px rgba(20,40,50,.07);}
  .nav .inner{max-width:640px;margin:0 auto;width:100%;display:flex;gap:12px;}
  button.nav-btn{flex:1;border:none;border-radius:14px;font-family:inherit;font-weight:800;
    cursor:pointer;min-height:62px;font-size:21px;letter-spacing:.03em;}
  .btn-back{flex:0 0 32%;background:#fff;border:2px solid var(--line);color:var(--ink-soft);}
  .btn-next{background:var(--brand);color:#fff;}
  .btn-next.send{background:var(--ok);}
  .btn-back:disabled{opacity:.4;}
  .confirm-title{font-size:23px;font-weight:800;color:var(--brand-dark);margin:2px 0 4px;}
  .confirm-sub{font-size:15px;color:var(--ink-soft);margin:0 0 16px;}
  .cgrp{font-size:14px;font-weight:800;color:var(--brand-dark);margin:16px 0 6px;}
  .crow{background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;overflow:hidden;}
  .crow .ck{font-size:14px;font-weight:700;color:var(--ink-soft);}
  .crow .cv{font-size:19px;font-weight:700;margin-top:2px;word-break:break-word;}
  .crow .fix{float:right;font-size:14px;font-weight:700;color:var(--brand-dark);
    background:var(--brand-tint);border:none;border-radius:10px;padding:6px 12px;cursor:pointer;font-family:inherit;}
  .done{text-align:center;padding-top:36px;}
  .done .ico{width:88px;height:88px;border-radius:50%;background:var(--brand-tint);color:var(--ok);
    display:grid;place-items:center;font-size:50px;margin:0 auto 16px;}
  .done h2{font-size:27px;margin:0 0 8px;color:var(--brand-dark);}
  .done p{font-size:18px;color:var(--ink-soft);margin:0 0 28px;}
  .send-err{display:none;background:#fbe9e7;border:2px solid #eebab4;color:var(--danger);
    font-size:16px;font-weight:700;border-radius:12px;padding:13px 16px;margin:14px 16px 0;text-align:center;}
  .send-err.show{display:block;}
  @media (max-width:768px){ body{font-size:17px;} .pagehead{font-size:20px;} input,textarea{font-size:18px;} .choice{font-size:17px;} button.nav-btn{min-height:56px;font-size:18px;} }
</style>
</head>
<body>

<div class="pbar-wrap">
  <div class="pbar-top">
    <span class="pbar-title" id="ptitle">添乗員業務日報</span>
    <span class="pbar-count" id="count"></span>
  </div>
  <div class="pbar"><i id="pfill" style="width:0%"></i></div>
</div>

<main id="screen"></main>
<div class="send-err" id="sendErr">送信に失敗しました。時間をおいて再度お試しください。</div>

<div class="nav" id="nav">
  <div class="inner">
    <button class="nav-btn btn-back" id="back">もどる</button>
    <button class="nav-btn btn-next" id="next">次へ ▶</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://wxdyqkyqtizhtkwtpvru.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4ZHlxa3lxdGl6aHRrd3RwdnJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NzYxODEsImV4cCI6MjA5OTQ1MjE4MX0.yVbClXBk2JVeglevsBLY5sH2_m2ybCf71u4i_YYWyHE";

/* ---- 条件 ---- */
const toOn   = a => ['登校・下校 両方','登校のみ'].includes(a['勤務種別']);
const fromOn = a => ['登校・下校 両方','下校のみ'].includes(a['勤務種別']);
const otherOn= a => a['勤務種別']==='その他（研修・短時間授業など）';
const both   = a => a['勤務種別']==='登校・下校 両方';
const arriveOpt = ['車庫','学校','会社指示場所'];
const leaveOpt  = ['車庫','学校','途中下車'];
const methodOpt = ['自家用車','徒歩','自転車','公共交通機関'];

function trip(pfx, key, when){
  const T = m => a => when(a) && a[`${key}_${m}`]==='公共交通機関';
  return [
   {k:`${key}_学校`, q:`学校名`, t:'text', req:true, ph:'例）〇〇特別支援学校', when},
   {k:`${key}_コース`, q:`コース`, t:'text', opt:true, ph:'例）Aコース', when},
   {k:`${key}_出勤指示時刻`, q:`出勤指示時刻`, t:'time', req:true, hint:'会社が指示した時刻。遅刻したときは到着時刻', when},
   {k:`${key}_出勤場所`, q:`出勤場所`, t:'choice', op:arriveOpt, req:true, when},
   {k:`${key}_出勤手段`, q:`出勤場所までの通勤手段`, t:'choice', op:methodOpt, req:true, when},
   {k:`${key}_出勤経路`, q:`出勤の経路`, t:'text', opt:true, ph:'例）〇〇駅 → 学校前', hint:'公共交通機関を使ったときだけ入力します', when:T('出勤手段')},
   {k:`${key}_出勤交通費`, q:`出勤の交通費（円）`, t:'number', opt:true, ph:'例）480', when:T('出勤手段')},
   {k:`${key}_出勤移動時間`, q:`出勤前の移動時間（駅→乗車場所）`, t:'text', opt:true, ph:'例）1:10', hint:'最寄り駅から乗車場所までの標準所要時間（乗換案内）。時:分。※実時間ではなく標準時間', when:T('出勤手段')},
   {k:`${key}_終了時刻`, q:`添乗業務の終了時刻`, t:'time', req:true, hint:'実際にバスを降りた時刻', when},
   {k:`${key}_退勤場所`, q:`退勤場所`, t:'choice', op:leaveOpt, req:true, when},
   {k:`${key}_帰宅手段`, q:`退勤場所から帰宅手段`, t:'choice', op:methodOpt, req:true, when},
   {k:`${key}_帰宅経路`, q:`帰宅の経路`, t:'text', opt:true, hint:'公共交通機関を使ったときだけ入力します', when:T('帰宅手段')},
   {k:`${key}_帰宅交通費`, q:`帰宅の交通費（円）`, t:'number', opt:true, hint:'自宅に戻った場合のみ', when:T('帰宅手段')},
   {k:`${key}_帰宅移動時間`, q:`退勤後の移動時間（乗車場所→駅）`, t:'text', opt:true, ph:'例）1:10', hint:'乗車場所から最寄り駅までの標準所要時間（乗換案内）。時:分。※実時間ではなく標準時間', when:T('帰宅手段')},
  ];
}

const Q = [
  {k:'勤務日', q:'勤務日', t:'date', req:true, when:()=>true},
  {k:'氏名',  q:'お名前', t:'text', req:true, ph:'例）山田 太郎', when:()=>true},
  {k:'勤務種別', q:'きょうの勤務はどれですか？', t:'choice', req:true, when:()=>true,
     op:['登校・下校 両方','登校のみ','下校のみ','その他（研修・短時間授業など）']},
  ...trip('to','登校', toOn),
  ...trip('from','下校', fromOn),
  {k:'その他_内容', q:'勤務の内容', t:'text', req:true, ph:'例）安全運転研修 / 短時間授業 添乗', when:otherOn},
  {k:'その他_出勤場所', q:'出勤場所', t:'choice', op:[...arriveOpt,'その他'], opt:true, when:otherOn},
  {k:'その他_手段', q:'通勤手段', t:'choice', op:methodOpt, opt:true, when:otherOn},
  {k:'その他_経路', q:'経路', t:'text', opt:true, when:a=>otherOn(a)&&a['その他_手段']==='公共交通機関'},
  {k:'その他_交通費', q:'交通費（円）', t:'number', opt:true, when:a=>otherOn(a)&&a['その他_手段']==='公共交通機関'},
  {k:'その他_開始時刻', q:'開始時刻', t:'time', req:true, when:otherOn},
  {k:'その他_終了時刻', q:'終了時刻', t:'time', req:true, when:otherOn},
  {k:'_中間有無', q:'中間利用・SB連絡会などはありましたか？', t:'choice', op:['あり','なし'], req:true,
     hint:'登校と下校の間に行った業務', when:a=>toOn(a)||fromOn(a)},
  {k:'中間業務_開始', q:'中間業務の開始時刻', t:'time', req:true, when:a=>a['_中間有無']==='あり'},
  {k:'中間業務_終了', q:'中間業務の終了時刻', t:'time', req:true, when:a=>a['_中間有無']==='あり'},
  {k:'自宅戻り', q:'登校と下校の間に自宅へ戻りましたか？', t:'choice', op:['あり','なし'], req:true, when:both},
  {k:'_備考有無', q:'連絡事項・特記事項はありますか？', t:'choice', op:['ある','ない'], req:true, when:()=>true},
  {k:'備考', q:'備考', t:'textarea', opt:true, ph:'気づいたこと・伝えたいこと', when:a=>a['_備考有無']==='ある'},
];
const QMAP = Object.fromEntries(Q.map(x=>[x.k,x]));
const RECORD_KEYS = Q.map(x=>x.k).filter(k=>!k.startsWith('_'));

/* ---- ページ定義 ---- */
const PAGE_DEFS = [
  { id:'base', title:'きほんの確認', sub:'お名前と勤務日、きょうの勤務をえらびます',
    sections:[ {h:null, keys:['勤務日','氏名','勤務種別']} ] },
  { id:'to', title:'登校便（行き）', sub:'朝の便について', show:a=>toOn(a),
    sections:[
      {h:null, keys:['登校_学校','登校_コース']},
      {h:'① 出勤（家 → 集合場所 → 学校）', keys:['登校_出勤指示時刻','登校_出勤場所','登校_出勤手段','登校_出勤経路','登校_出勤交通費','登校_出勤移動時間']},
      {h:'② 退勤（学校 → 帰宅／待機）', keys:['登校_終了時刻','登校_退勤場所','登校_帰宅手段','登校_帰宅経路','登校_帰宅交通費','登校_帰宅移動時間']},
    ]},
  { id:'from', title:'下校便（帰り）', sub:'午後の便について', show:a=>fromOn(a),
    sections:[
      {h:null, keys:['下校_学校','下校_コース']},
      {h:'① 出勤（家／待機 → 学校）', keys:['下校_出勤指示時刻','下校_出勤場所','下校_出勤手段','下校_出勤経路','下校_出勤交通費','下校_出勤移動時間']},
      {h:'② 退勤（学校 → 帰宅）', keys:['下校_終了時刻','下校_退勤場所','下校_帰宅手段','下校_帰宅経路','下校_帰宅交通費','下校_帰宅移動時間']},
    ]},
  { id:'other', title:'その他の勤務', sub:'研修・短時間授業など', show:a=>otherOn(a),
    sections:[ {h:null, keys:['その他_内容','その他_開始時刻','その他_終了時刻','その他_出勤場所','その他_手段','その他_経路','その他_交通費']} ]},
  { id:'extra', title:'中間業務・連絡事項', sub:'最後の確認です', show:a=>true,
    sections:[
      {h:null, keys:['_中間有無','中間業務_開始','中間業務_終了','自宅戻り']},
      {h:'連絡事項', keys:['_備考有無','備考']},
    ]},
];

/* 選択で画面を作り直すキー（条件表示が変わるもの） */
const RERENDER = new Set(['勤務種別','登校_出勤手段','登校_帰宅手段','下校_出勤手段','下校_帰宅手段','その他_手段','_中間有無','_備考有無','自宅戻り']);

/* ---- 状態 ---- */
const _now = new Date();
const today = _now.getFullYear()+'-'+String(_now.getMonth()+1).padStart(2,'0')+'-'+String(_now.getDate()).padStart(2,'0');
let answers = {'勤務日':today};
let routes = {};            // 事前記入の構造化経路（_routes）
let editing = new Set();    // 経路を編集中のキー
let prefilledKeys = [];
let pages = [];
let pageIdx = 0;
let mode = 'form';          // 'form' | 'confirm' | 'done'

const previewMode = (location.hash === '#preview') || (new URLSearchParams(location.search).get('preview') === '1');

let accessToken = null;
(function readToken(){
  const h = location.hash;
  if (h && h.startsWith('#t=')) { accessToken = h.slice(3); history.replaceState(null,'',location.pathname+location.search); }
  else { const p=new URLSearchParams(location.search); if(p.get('t')){ accessToken=p.get('t'); p.delete('t'); const qs=p.toString(); history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')); } }
})();

const screen=document.getElementById('screen');
const backBtn=document.getElementById('back');
const nextBtn=document.getElementById('next');

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function buildPages(){ pages = PAGE_DEFS.filter(p=>!p.show || p.show(answers)); if(pageIdx>=pages.length) pageIdx=pages.length-1; }

const SEG_MODES = ['電車','バス','タクシー','徒歩','自転車','自家用車'];
function routeLegDir(key){
  const leg = key.startsWith('登校')?'登校':key.startsWith('下校')?'下校':key.startsWith('その他')?'その他':null;
  const dir = key.includes('_出勤')?'出勤':key.includes('_帰宅')?'帰宅':(key==='その他_経路'?'出勤':null);
  return (leg&&dir)?{leg,dir}:null;
}
function slotOf(key){
  const ld=routeLegDir(key); if(!ld) return {'区間':[]};
  if(!routes[ld.leg]) routes[ld.leg]={};
  if(!routes[ld.leg][ld.dir]) routes[ld.leg][ld.dir]={'区間':[]};
  if(!Array.isArray(routes[ld.leg][ld.dir]['区間'])) routes[ld.leg][ld.dir]['区間']=[];
  return routes[ld.leg][ld.dir];
}
function syncRoute(key){
  const segs=slotOf(key)['区間'];
  answers[key]=segs.map(s=>`${s['手段']||''} ${s['乗車']||''}→${s['下車']||''}`).filter(x=>x.trim()!=='→'&&x.trim()!=='').join(' / ');
  answers[key.replace('経路','交通費')]=String(segs.reduce((a,s)=>a+(Number(s['運賃'])||0),0));
}
function routeBlockHtml(key){
  const segs=slotOf(key)['区間'];
  const total=segs.reduce((a,s)=>a+(Number(s['運賃'])||0),0);
  if(!editing.has(key)){
    const body = segs.length
      ? segs.map(s=>`<div class="route-seg"><span class="m">${esc(s['手段']||'')}</span><span>${esc(s['乗車']||'')}</span><span class="ar">→</span><span>${esc(s['下車']||'')}</span>${(s['運賃']!==undefined&&s['運賃']!=='')?`<span class="fare">¥${esc(s['運賃'])}</span>`:''}</div>`).join('')
      : `<div style="color:#8a9a92;font-size:15px;">経路は登録されていません。</div>`;
    return `<div class="route-disp">
      <div class="rt">行程（確認してください）${segs.length?`<span style="float:right;color:#5c7066;">合計 ¥${total}</span>`:''}</div>
      ${body}
      <button type="button" class="rbtn" data-edit="${key}">${segs.length?'修正する':'入力する'}</button>
    </div>`;
  }
  const rows = segs.map((s,i)=>`<div class="seg-edit">
    <div class="seg-line">
      <select class="rs" data-key="${key}" data-si="${i}" data-f="手段">${SEG_MODES.map(m=>`<option ${s['手段']===m?'selected':''}>${m}</option>`).join('')}</select>
      <input class="rs" data-key="${key}" data-si="${i}" data-f="乗車" value="${escA(s['乗車']||'')}" placeholder="乗車">
      <span class="ar">→</span>
      <input class="rs" data-key="${key}" data-si="${i}" data-f="下車" value="${escA(s['下車']||'')}" placeholder="下車">
    </div>
    <div class="seg-line2"><span>運賃 ¥<input class="rs" type="number" inputmode="numeric" data-key="${key}" data-si="${i}" data-f="運賃" value="${Number(s['運賃'])||0}" style="width:96px;"></span>
      <button type="button" class="rlink" data-key="${key}" data-si="${i}" data-yahoo="1">乗換案内で調べる</button>
      <button type="button" class="rlink del" data-key="${key}" data-si="${i}" data-del="1">× 削除</button></div>
  </div>`).join('');
  return `<div class="route-disp edit">
    ${rows||'<div style="color:#8a9a92;font-size:14px;margin-bottom:8px;">「区間を追加」で足してください。</div>'}
    <div class="rbtnrow"><button type="button" class="rbtn" data-addseg="${key}">＋ 区間を追加</button><button type="button" class="rbtn done" data-done="${key}">修正を終える</button></div>
  </div>`;
}

function control(def){
  const k=def.k; const v = answers[k] ?? (def.t==='date'?today:'');
  if(def.t==='choice'){
    return `<div class="choices" data-k="${k}">`+ def.op.map(o=>
      `<button type="button" class="choice ${v===o?'sel':''}" data-val="${escA(o)}"><span class="tick">✓</span><span>${esc(o)}</span></button>`).join('')+`</div>`;
  }
  if(def.t==='textarea') return `<textarea data-k="${k}" placeholder="${escA(def.ph||'')}">${esc(v)}</textarea>`;
  const type = def.t==='number'?'number':def.t==='time'?'time':def.t==='date'?'date':'text';
  const imode = def.t==='number'?'inputmode="numeric"':'';
  return `<input type="${type}" data-k="${k}" value="${escA(v)}" placeholder="${escA(def.ph||'')}" ${imode}>`;
}

function fieldHtml(key){
  const def=QMAP[key]; if(!def || !def.when(answers)) return '';
  const label=def.q.replace('は？','');
  const pf=prefilledKeys.includes(key);
  const badge = def.req ? '<span class="badge req">必須</span>' : (pf?'<span class="badge pf">記入済み</span>':'');
  if((key==='勤務日'||key==='氏名') && pf){
    return `<div class="fld"><div class="flabel">${esc(label)}</div><div class="roval">${esc(answers[key]||'')}</div></div>`;
  }
  // 交通費は経路ブロックに統合（自動合算）するため単独では出さない
  if(key.endsWith('交通費')) return '';
  // 経路は「区間表示＋修正」ブロック（テキスト欄は使わない）
  if(key.endsWith('経路')){
    return `<div class="fld"><div class="flabel">${esc(label)}</div>${routeBlockHtml(key)}</div>`;
  }
  const hint = def.hint?`<div class="fhint">${esc(def.hint)}</div>`:'';
  return `<div class="fld"><div class="flabel">${esc(label)}${badge}</div>${control(def)}${hint}</div>`;
}

function renderPage(){
  const p=pages[pageIdx];
  let html = `<div class="pagehead">${esc(p.title)}</div>` + (p.sub?`<div class="pagesub">${esc(p.sub)}</div>`:'');
  p.sections.forEach(sec=>{
    const fields = sec.keys.map(fieldHtml).filter(Boolean).join('');
    if(!fields) return;
    if(sec.h) html += `<div class="sec-h">${esc(sec.h)}</div>`;
    html += fields;
  });
  html += `<div class="err" id="err">未入力の必須項目があります。赤い「必須」の欄をご確認ください。</div>`;
  screen.innerHTML = html;
  bindPage();
  backBtn.disabled = (pageIdx===0);
  nextBtn.textContent = (pageIdx===pages.length-1) ? '確認へ ▶' : '次へ ▶';
  nextBtn.classList.remove('send');
  setProgress();
}

function bindPage(){
  screen.querySelectorAll('.choices').forEach(box=>{
    const k=box.dataset.k;
    box.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>{
      answers[k]=btn.dataset.val;
      const err=document.getElementById('err'); if(err) err.classList.remove('show');
      if(RERENDER.has(k)){ buildPages(); renderPage(); }
      else { box.querySelectorAll('.choice').forEach(b=>b.classList.toggle('sel', b.dataset.val===answers[k])); }
    }));
  });
  screen.querySelectorAll('input[data-k],textarea[data-k]').forEach(inp=>{
    inp.addEventListener('input',()=>{ answers[inp.dataset.k]=inp.value; });
  });
  // 経路（区間）編集
  screen.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.edit; if(!slotOf(k)['区間'].length) slotOf(k)['区間'].push({'手段':'電車','乗車':'','下車':'','運賃':0});
    editing.add(k); renderPage();
  }));
  screen.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',()=>{ syncRoute(b.dataset.done); editing.delete(b.dataset.done); renderPage(); }));
  screen.querySelectorAll('[data-addseg]').forEach(b=>b.addEventListener('click',()=>{ slotOf(b.dataset.addseg)['区間'].push({'手段':'電車','乗車':'','下車':'','運賃':0}); renderPage(); }));
  screen.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.key; slotOf(k)['区間'].splice(Number(b.dataset.si),1); syncRoute(k); renderPage(); }));
  screen.querySelectorAll('[data-yahoo]').forEach(b=>b.addEventListener('click',()=>{
    const seg=slotOf(b.dataset.key)['区間'][Number(b.dataset.si)]||{};
    if(!seg['乗車']||!seg['下車']){ alert('乗車地と下車地を入れてから調べてください'); return; }
    window.open('https://transit.yahoo.co.jp/search/result?from='+encodeURIComponent(seg['乗車'])+'&to='+encodeURIComponent(seg['下車'])+'&ticket=normal','_blank');
  }));
  screen.querySelectorAll('.rs').forEach(el=>el.addEventListener('input',()=>{
    const seg=slotOf(el.dataset.key)['区間'][Number(el.dataset.si)]; if(!seg) return;
    seg[el.dataset.f]=(el.dataset.f==='運賃')?(Number(el.value)||0):el.value; syncRoute(el.dataset.key);
  }));
}

function setProgress(){
  const total=pages.length+1;
  const cur = mode==='confirm'?total : Math.min(pageIdx+1,pages.length);
  document.getElementById('ptitle').textContent = mode==='confirm'?'確認':(mode==='done'?'完了':pages[pageIdx].title);
  document.getElementById('count').textContent = mode==='done'?'完了':`${cur} / ${total}`;
  document.getElementById('pfill').style.width = (mode==='done'?100:(cur/total*100))+'%';
}

function validatePage(){
  const p=pages[pageIdx]; let ok=true;
  p.sections.forEach(sec=>sec.keys.forEach(k=>{
    const def=QMAP[k]; if(!def||!def.when(answers)) return;
    if(def.req){ const v=answers[k]; if(v===undefined||String(v).trim()==='') ok=false; }
  }));
  if(!ok){ const e=document.getElementById('err'); if(e) e.classList.add('show'); }
  return ok;
}

function valueText(k){ const v=answers[k]; if(v===undefined||v==='') return '—'; return v; }
function keyPage(k){ for(let i=0;i<pages.length;i++){ if(pages[i].sections.some(s=>s.keys.includes(k))) return i; } return 0; }

function renderConfirm(){
  const groups=[
    {t:'きほん', keys:['勤務日','氏名','勤務種別']},
    {t:'登校便', keys:['登校_学校','登校_コース','登校_出勤指示時刻','登校_出勤場所','登校_出勤手段','登校_出勤経路','登校_出勤交通費','登校_終了時刻','登校_退勤場所','登校_帰宅手段','登校_帰宅経路','登校_帰宅交通費']},
    {t:'下校便', keys:['下校_学校','下校_コース','下校_出勤指示時刻','下校_出勤場所','下校_出勤手段','下校_出勤経路','下校_出勤交通費','下校_終了時刻','下校_退勤場所','下校_帰宅手段','下校_帰宅経路','下校_帰宅交通費']},
    {t:'その他', keys:['その他_内容','その他_開始時刻','その他_終了時刻','その他_出勤場所','その他_手段','その他_経路','その他_交通費']},
    {t:'中間・連絡', keys:['中間業務_開始','中間業務_終了','自宅戻り','備考']},
  ];
  let html='<div class="confirm-title">この内容で送信します</div><div class="confirm-sub">まちがいがなければ「送信する」を押してください</div>';
  groups.forEach(g=>{
    const rows=g.keys.filter(k=>{const d=QMAP[k];return d&&d.when(answers)&&answers[k]!==undefined&&answers[k]!=='';})
      .map(k=>`<div class="crow"><button class="fix" data-k="${k}">なおす</button><div class="ck">${esc(QMAP[k].q.replace('は？',''))}</div><div class="cv">${esc(valueText(k))}</div></div>`).join('');
    if(rows) html+=`<div class="cgrp">${g.t}</div>`+rows;
  });
  screen.innerHTML=html;
  screen.querySelectorAll('.fix').forEach(b=>b.addEventListener('click',()=>{ mode='form'; pageIdx=keyPage(b.dataset.k); renderPage(); window.scrollTo(0,0); }));
  backBtn.disabled=false; nextBtn.textContent='送信する'; nextBtn.classList.add('send');
  document.getElementById('sendErr').classList.remove('show');
  setProgress();
}

function renderDone(){
  document.getElementById('nav').style.display='none';
  screen.innerHTML=`<div class="done"><div class="ico">✓</div><h2>送信しました</h2><p>おつかれさまでした。</p></div>`;
  setProgress();
}

function showTokenError(title,msg){
  document.getElementById('nav').style.display='none';
  screen.innerHTML=`<div style="text-align:center;padding:44px 16px;"><div style="font-size:50px;margin-bottom:16px;">🔒</div>
    <div style="font-size:20px;font-weight:800;color:#a82d24;margin-bottom:12px;">${title}</div>
    <div style="font-size:16px;color:#5c7066;line-height:1.8;">${msg}</div></div>`;
  document.getElementById('count').textContent=''; document.getElementById('pfill').style.width='0%';
  document.getElementById('ptitle').textContent='添乗員業務日報';
}

nextBtn.addEventListener('click', async ()=>{
  if(mode==='form'){
    if(!validatePage()) return;
    if(pageIdx < pages.length-1){ pageIdx++; renderPage(); window.scrollTo(0,0); }
    else { mode='confirm'; renderConfirm(); window.scrollTo(0,0); }
  } else if(mode==='confirm'){
    if(previewMode){ alert('プレビュー表示のため送信しません。\n実際の入力は、会社から届く本人専用リンクから行います。'); return; }
    nextBtn.disabled=true; nextBtn.textContent='送信中…';
    document.getElementById('sendErr').classList.remove('show');
    const rec={}; RECORD_KEYS.forEach(k=>{ rec[k]=(QMAP[k].when(answers)?(answers[k]||''):''); });
    rec['送信日時']=new Date().toLocaleString('ja-JP');
    try{
      const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/nippo_submit`,{method:'POST',
        headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({p_token:accessToken,p_data:rec})});
      if(!res.ok){ const t=await res.text(); if(t.includes('expired')){ showTokenError('リンクの有効期限が切れています','お手数ですが管理者に連絡し、新しいリンクを発行してもらってください。'); return; } throw new Error('送信エラー '+res.status); }
      mode='done'; renderDone();
    }catch(e){ console.error(e); document.getElementById('sendErr').classList.add('show'); nextBtn.disabled=false; nextBtn.textContent='送信する'; }
  }
});
backBtn.addEventListener('click',()=>{
  if(mode==='confirm'){ mode='form'; pageIdx=pages.length-1; renderPage(); window.scrollTo(0,0); return; }
  if(pageIdx>0){ pageIdx--; renderPage(); window.scrollTo(0,0); }
});

function startForm(){ buildPages(); pageIdx=0; mode='form'; renderPage(); window.scrollTo(0,0); }

/* ---- 起動 ---- */
(async function init(){
  if(previewMode){
    answers={'勤務日':today,'氏名':'（見本）山田 太郎','勤務種別':'登校・下校 両方',
      '登校_学校':'八王子特別支援学校','登校_コース':'小宮コース','登校_出勤指示時刻':'06:30','登校_出勤場所':'会社指示場所','登校_出勤手段':'公共交通機関','登校_出勤経路':'電車 八王子→高尾 / バス 高尾駅北口→みなみ野','登校_出勤交通費':'420',
      '下校_学校':'八王子特別支援学校','下校_コース':'小宮コース'};
    routes={'登校':{'出勤':{'区間':[{'手段':'電車','乗車':'八王子','下車':'高尾','運賃':320},{'手段':'バス','乗車':'高尾駅北口','下車':'みなみ野','運賃':100}]}}};
    prefilledKeys=Object.keys(answers);
    startForm(); return;
  }
  if(!accessToken){
    showTokenError('このページは直接開けません','日報の入力は、会社から届いた本人専用リンクからのみ行えます。<br>リンクが見当たらない場合は管理者にお問い合わせください。<br><br><span style="font-size:13px;color:#8a9a92;">管理者の方へ：確認は <a href="nippo.html#preview" style="color:#4d7a5e;font-weight:700;">プレビュー</a> をご利用ください。</span>');
    return;
  }
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/nippo_open`,{method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_token:accessToken})});
    if(!res.ok){ const t=await res.text();
      if(t.includes('expired')) showTokenError('リンクの有効期限が切れています','このリンクは使用できなくなりました。<br>管理者に新しいリンクの発行を依頼してください。');
      else if(t.includes('too many')) showTokenError('アクセスが一時制限されています','しばらく時間をおいてから、もう一度リンクを開いてください。');
      else showTokenError('リンクが無効です','メールに記載されたリンクをそのまま開いてください。');
      return; }
    const info=await res.json();
    if(info.work_date){ answers['勤務日']=info.work_date; prefilledKeys.push('勤務日'); }
    if(info.staff_name){ answers['氏名']=info.staff_name; prefilledKeys.push('氏名'); }
    if(info.prefill && typeof info.prefill==='object'){
      Object.entries(info.prefill).forEach(([k,v])=>{
        if(k==='_routes'){ if(v && typeof v==='object') routes=v; return; }
        if(k.startsWith('_')) return;
        if(v!==null && v!==undefined && String(v)!==''){ answers[k]=String(v); if(!prefilledKeys.includes(k)) prefilledKeys.push(k); }
      });
    }
    if(info.previous && typeof info.previous==='object'){
      Object.entries(info.previous).forEach(([k,v])=>{ if(v!==null && v!==undefined && String(v)!=='') answers[k]=String(v); });
    }
    startForm();
  }catch(e){ console.error(e); showTokenError('通信エラー','ネットワークの状態を確認して、もう一度リンクを開いてください。'); }
})();
</script>
</body>
