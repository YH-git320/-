<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運行ボタン</title>
<style>
  :root{
    --ink:#2d3b35;--ink-soft:#5c7066;--line:#c8d8cc;--bg:#f5f8f4;--card:#ffffff;
    --brand:#6b9e7e;--brand-dark:#4d7a5e;--brand-tint:#e4f0e8;
    --amber:#9a5f12;--amber-tint:#fbf0db;--danger:#a82d24;--ok:#2e7d52;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);font-size:19px;line-height:1.7;
    display:flex;flex-direction:column;min-height:100dvh;-webkit-text-size-adjust:100%;overflow-x:hidden;}
  .pbar-wrap{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:10;}
  .pbar-title{font-size:22px;font-weight:800;color:var(--brand-dark);line-height:1.35;}
  .pbar-sub{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .geomark{margin-left:7px;font-size:12px;white-space:nowrap;}
  main{flex:1;padding:14px 16px 28px;max-width:680px;margin:0 auto;width:100%;}
  .sec-h{font-size:16px;font-weight:800;color:#fff;background:var(--brand);border-radius:10px;
    padding:9px 14px;margin:20px 0 12px;}

  /* ── 手順の並び ── */
  .step{background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;}
  .step.done{background:#f4faf6;border-color:#bcdcc7;}
  .step.now{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint);}
  .step.next{opacity:.62;}
  .step .head{display:flex;align-items:center;gap:10px;}
  .step .mark{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:15px;font-weight:800;background:#eef3ef;color:var(--ink-soft);}
  .step.done .mark{background:var(--ok);color:#fff;}
  .step.now  .mark{background:var(--brand);color:#fff;}
  .step .name{flex:1;min-width:0;font-size:20px;font-weight:800;}
  .step .time{flex:0 0 auto;font-size:20px;font-weight:800;color:var(--ok);font-variant-numeric:tabular-nums;}

  .warn{background:var(--amber-tint);border:1px solid #e6d3a8;border-radius:10px;
    padding:9px 12px;margin-top:9px;font-size:15px;line-height:1.65;color:var(--amber);font-weight:700;}

  .bigbtn{width:100%;font-family:inherit;font-size:23px;font-weight:800;background:var(--brand);
    color:#fff;border:none;border-radius:14px;padding:19px;margin-top:11px;cursor:pointer;}
  .bigbtn:active{background:var(--brand-dark);}
  .bigbtn[disabled]{opacity:.5;}
  .mapbtn{width:100%;font-family:inherit;font-size:17px;font-weight:700;background:#fff;
    border:2px solid var(--brand);color:var(--brand-dark);border-radius:12px;padding:13px;
    margin-top:9px;cursor:pointer;text-decoration:none;display:block;text-align:center;}
  /* サブルート＝渋滞・事故のときの別の道。メインと見分けがつくよう色を変える */
  .mapbtn.subbtn{border-color:#d8a24a;color:var(--amber);font-size:15px;padding:11px;}
  .undo{font-family:inherit;font-size:13px;font-weight:700;background:none;border:none;
    color:var(--ink-soft);text-decoration:underline;padding:6px 2px;margin-top:4px;cursor:pointer;}

  /* ── 「着いた」／人数／「出発」を横に並べる ── */
  .actrow{display:flex;gap:8px;align-items:stretch;margin-top:11px;}
  .actrow .bigbtn{flex:1 1 0;min-width:0;margin-top:0;font-size:20px;padding:17px 6px;}
  .pspacer{flex:1 1 0;min-width:0;}
  .pbox{flex:0 0 auto;width:92px;background:#fff;border:2px solid var(--line);border-radius:14px;
    padding:5px 6px 7px;text-align:center;}
  .pbox .plab{font-size:11px;font-weight:700;color:var(--ink-soft);line-height:1.2;margin-bottom:1px;}
  .pbox input{width:100%;font-size:24px;font-family:inherit;font-weight:800;text-align:center;
    color:var(--ink);border:none;background:transparent;padding:1px 0;
    -webkit-appearance:none;appearance:none;}
  .pbox input:focus{outline:none;}
  .pbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint);}

  /* 押し終わったボタン（時刻を表示。もう一度タップで取り消しに入る） */
  .donebtn{flex:1 1 0;min-width:0;font-family:inherit;font-size:19px;font-weight:800;
    background:#eaf5ee;color:var(--ok);border:2px solid #bcdcc7;border-radius:14px;padding:15px 6px;cursor:pointer;}
  .donebtn.arm{background:#fbe9e7;border-color:#e8b4ae;color:var(--danger);font-size:14px;line-height:1.35;}

  /* 通過（乗降なし）：少し離して小さく */
  .passrow{display:flex;justify-content:flex-end;margin-top:8px;}
  .passbtn{font-family:inherit;font-size:14px;font-weight:700;background:#fff;
    border:2px solid var(--line);color:var(--ink-soft);border-radius:10px;padding:9px 16px;cursor:pointer;}

  /* ── 人数の集計（置き去り防止の確認） ── */
  .segnote{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
    margin-bottom:11px;font-size:14px;line-height:1.7;color:var(--ink-soft);}
  .remain{margin-top:7px;font-size:15px;font-weight:800;color:var(--ink-soft);text-align:right;}
  .remain.bad{color:var(--danger);}
  .allrow{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap;}
  .allinfo{flex:1 1 130px;min-width:0;font-size:16px;font-weight:800;color:var(--ink-soft);}
  .allinfo .bad{color:var(--danger);}
  .allrow .bigbtn,.allrow .donebtn{flex:1 1 150px;margin-top:0;font-size:19px;padding:15px 6px;}
  .passbtn.arm{background:#fbe9e7;border-color:#e8b4ae;color:var(--danger);}

  /* 画面が狭いとき（分割表示など）も、着いた／人数／出発は横一列を保つ */
  @media (max-width:480px){
    .actrow{gap:6px;}
    .actrow .bigbtn{font-size:17px;padding:15px 2px;}
    .donebtn{font-size:17px;padding:14px 2px;}
    .donebtn.arm{font-size:12px;}
    .pbox{width:74px;padding:4px 3px 6px;}
    .pbox input{font-size:21px;}
    .pbox .plab{font-size:10px;}
  }

  .hint{font-size:14px;color:var(--ink-soft);line-height:1.7;margin:8px 2px 0;}
  .msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2d3b35;color:#fff;
    font-size:16px;font-weight:700;padding:12px 20px;border-radius:12px;opacity:0;transition:opacity .2s;
    pointer-events:none;z-index:50;max-width:90%;text-align:center;}
  .msg.show{opacity:.94;}
  .err{background:#fbe9e7;border:2px solid #e8b4ae;color:var(--danger);border-radius:12px;
    padding:14px 16px;font-size:16px;font-weight:700;margin-bottom:14px;}
  .prev{background:var(--amber-tint);border:2px solid #e6d3a8;color:var(--amber);border-radius:12px;
    padding:12px 15px;font-size:15px;font-weight:700;margin-bottom:14px;}
  .segbtns{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .segbtns button{font-family:inherit;font-size:16px;font-weight:700;border-radius:10px;padding:10px 16px;
    border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;}
  .segbtns button.on{background:var(--brand);border-color:var(--brand);color:#fff;}
</style>
</head>
<body>

<div class="pbar-wrap">
  <div class="pbar-title" id="barTitle">運行ボタン</div>
  <div class="pbar-sub"><span id="barSub">読み込んでいます…</span><span id="geoMark" class="geomark"></span></div>
</div>

<main id="app"></main>
<div class="msg" id="msg"></div>

<script>
const SUPABASE_URL = 'https://wxdyqkyqtizhtkwtpvru.supabase.co';
const REST_URL = SUPABASE_URL + '/rest/v1';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4ZHlxa3lxdGl6aHRrd3RwdnJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NzYxODEsImV4cCI6MjA5OTQ1MjE4MX0.yVbClXBk2JVeglevsBLY5sH2_m2ybCf71u4i_YYWyHE';

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let PREVIEW = false;      // #preview なら見本モード（DBへ書かない）
let TOKEN = '';
let INFO = null;          // { 日付, 運転手, コース, 便ごとの手順 }
let SEG = '登校';         // いま表示している便
let EVENTS = {};          // 'segment|kind|seq' -> { pressed_at, id }
let COUNTS = {};          // 'segment|seq' -> 乗車人数

function toast(t){ const el=document.getElementById('msg'); el.textContent=t; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'), 2200); }
function hm(iso){ if(!iso) return ''; const d=new Date(iso);
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function todayStr(){ const d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function dateJp(s){ if(!s) return ''; const d=new Date(s+'T00:00:00');
  return (d.getMonth()+1)+'月'+d.getDate()+'日('+['日','月','火','水','木','金','土'][d.getDay()]+')'; }

/* ===== Googleマップの道案内（unkou.html と同じ作り） =====
   ・地点を「/」で並べる形式。経由地は44か所まで通ることを確認済み
   ・data=!4m5!4m4!2m2!1b1!2b1!3e0 は「高速を使わない・有料を使わない・車」 */
const MARU = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];

/** その手順に出す道案内リンク。
 *  target を名前付きにして、押すたびに新しいタブが増えないようにする
 *  （_blank だと10回押せば10タブになり、運転中に戻るのが大変になる）。
 *  区切のある区間は案内が2つ以上になる。上から順に押していけばよい */
function legLinks(s){
  const legs = s.legs || [];
  let h = '';
  legs.forEach((g,k)=>{
    const u = mapUrl(g.pts);
    if(!u) return;
    const label = (legs.length===1)
      ? (s.type==='stop' ? '🗺 ここまでの道案内'
                         : '🗺 ' + (s.mapTo || '次の地点') + 'までの道案内')
      : '🗺 道案内' + (MARU[k]||(k+1)) + '　'
        + (g.label ? g.label + 'まで'
           : g.cut ? (g.toName||'区切りの地点') + 'まで'
                   : 'その先 〜 ' + (s.mapTo || s.label));
    h += `<a class="mapbtn" href="${u}" target="unkoumap" rel="noopener">${esc(label)}</a>`;
  });
  // 渋滞や事故でメインが使えないときの、会社が用意した別の道
  (s.subs || []).forEach(sb=>{
    const u = mapUrl(sb.pts);
    if(!u) return;
    h += `<a class="mapbtn subbtn" href="${u}" target="unkoumap" rel="noopener">🚧 サブ：${esc(sb.name)}</a>`;
  });
  return h;
}

function mapUrl(pts){
  const c = pts.filter(p=>p.lat!=null&&p.lng!=null).map(p=>Number(p.lat)+','+Number(p.lng));
  if(c.length<2) return null;
  return 'https://www.google.com/maps/dir/'+c.join('/')+'/data=!4m5!4m4!2m2!1b1!2b1!3e0';
}

/* ===== ボタンの見た目 =====
   運行中に確認の文章を読む余裕はないため、取り消しはダイアログを出さず
   「もう一度タップ」で意思を確かめる（2026-08-20 八重樫さんの指摘）。
   1回目のタップでボタンが赤くなり「もう一度タップで取消」に変わる。 */
let ARM = null;                 // いま取り消し待ちのボタン 'i|kind'
let _armTimer = null;
function armKey(i,kind){ return i+'|'+kind; }
function arm(i,kind){
  ARM = armKey(i,kind);
  clearTimeout(_armTimer);
  _armTimer = setTimeout(()=>{ ARM=null; render(); }, 6000);   // 6秒で自動解除
  render();
}
function disarm(){ ARM=null; clearTimeout(_armTimer); }

/** 押す前は緑の大ボタン、押した後は時刻を出す。押した後をタップすると取り消しに入る */
function actBtn(i, kind, label, e, small, doneLabel){
  const k = armKey(i,kind);
  if(!e){
    return `<button class="bigbtn" onclick="onAct(${i},'${kind}')">${esc(label)}</button>`;
  }
  if(ARM===k){
    return `<button class="${small?'passbtn arm':'donebtn arm'}" onclick="onAct(${i},'${kind}')">
      もう一度タップで<br>取り消し</button>`;
  }
  return `<button class="${small?'passbtn':'donebtn'}" onclick="onAct(${i},'${kind}')">${
    small ? '↩ '+esc(kindLabel(kind))+' '+hm(e.pressed_at)+' を取り消す'
          : (doneLabel ? esc(doneLabel)+' '+hm(e.pressed_at) : hm(e.pressed_at))}</button>`;
}
function kindLabel(k){ return k==='到着'?'着':k==='出発'?'発':k==='全員降車確認'?'全員降車':k; }

/** 通過（乗降なし）。こちらも押した後はもう一度タップで取り消し */
function passBtn(i){
  const s=_step(i), e=evOf('通過', s.seq), k=armKey(i,'通過');
  if(e && ARM===k) return `<button class="passbtn arm" onclick="onAct(${i},'通過')">もう一度タップで取り消し</button>`;
  if(e)            return `<button class="passbtn" onclick="onAct(${i},'通過')">↩ 通過 ${hm(e.pressed_at)} を取り消す</button>`;
  return `<button class="passbtn" onclick="onAct(${i},'通過')">乗降なし・通過</button>`;
}

/** ボタンが押されたとき：未記録なら記録、記録済みなら1回目で身構え・2回目で取り消し */
async function onAct(i, kind){
  const s=_step(i);
  const e = evOf(kind, s.seq);
  const k = armKey(i,kind);
  if(!e){ disarm(); await _record(kind, s.seq, s.label); return; }
  if(ARM!==k){ arm(i,kind); return; }        // 1回目：もう一度タップを促す
  disarm();                                   // 2回目：取り消す
  await _erase(kind, s.seq, s.label);
}

/* ===== 画面 ===== */
function render(){
  const app=document.getElementById('app');
  if(!INFO){ app.innerHTML=''; return; }

  // 上部の固定表示は「次にすること」を大きく。
  // マップから戻ってきたとき、どこまで進んだか一目で分かるようにする
  const _t = document.getElementById('barTitle'), _s = document.getElementById('barSub');

  // 登校便を先に、次に下校便①②③の順に並べる
  const order = { '登校':0, '下校①':1, '下校②':2, '下校③':3 };
  const segs = INFO.segments.filter(s=>s.points.length)
                            .slice().sort((a,b)=>(order[a.segment]??9)-(order[b.segment]??9));
  if(!segs.length){ app.innerHTML='<div class="err">このコースの経路がまだ登録されていません。事務所にご連絡ください。</div>'; return; }
  if(!segs.some(s=>s.segment===SEG)) SEG = segs[0].segment;
  const cur = segs.find(s=>s.segment===SEG);

  let h = '';
  if(PREVIEW) h += '<div class="prev">これは<b>見本</b>です。押しても記録されません。</div>';

  if(segs.length>1){
    h += '<div class="segbtns">' + segs.map(s=>
      `<button class="${s.segment===SEG?'on':''}" onclick="setSeg('${esc(s.segment)}')">${esc(s.label)}</button>`).join('') + '</div>';
  }

  // ── 手順（出庫 → 各バス停 → 帰庫）
  h += '<div class="sec-h">運行の記録</div>';
  const steps = buildSteps(cur);
  let nowIdx = steps.findIndex(s=>!stepDone(s));               // いま進めるべき手順
  if(nowIdx<0) nowIdx = steps.length;                           // すべて済み

  // 上部の固定表示：「次にすること」を大きく出す
  const CI = countInfo(steps);
  const ns = steps[nowIdx];
  if(ns){
    let act = '着いた';
    if(ns.type==='one') act = ns.btn;
    else if(ns.last && (evOf('出発', ns.seq)||evOf('通過', ns.seq)) && !evOf('全員降車確認', ns.seq)) act = '全員降りた';
    else if(evOf('到着', ns.seq)) act = '出発';
    _t.textContent = '▶ ' + ns.label + '　' + act;
  } else {
    _t.textContent = '✓ ' + cur.label + ' は終わりました';
  }
  _s.textContent = (INFO.course_label||'') + '　' + cur.label + '　'
                 + dateJp(INFO.work_date) + (PREVIEW?'　【見本】':'');

  // 便によって人数の意味が入れ替わるので、最初に書いておく
  h += `<div class="segnote">${ CI.mode==='登校'
    ? '各バス停で<b>乗った人数</b>を入れます。最後の学校では、<b>全員降りたこと</b>を確認して押してください。'
    : '最初の学校で<b>乗せた人数</b>、各バス停で<b>降りた人数</b>を入れます。最後のバス停で<b>残り0人</b>になるはずです。'
  }</div>`;

  steps.forEach((s,i)=>{
    const done  = stepDone(s);
    const state = done ? 'done' : (i===nowIdx ? 'now' : 'next');
    const mark  = done ? '✓' : (i===nowIdx ? '▶' : (i+1));
    const cnt   = (s.seq!=null) ? COUNTS[SEG+'|'+s.seq] : null;
    const arr   = (s.type==='stop') ? evOf('到着', s.seq) : null;
    const dep   = (s.type==='stop') ? evOf('出発', s.seq) : null;
    const one   = (s.type==='one')  ? evOf(s.kind, s.seq) : null;

    // 時刻の表示：バス停は「着 8:50 / 発 8:52」
    const pas = (s.type==='stop') ? evOf('通過', s.seq) : null;
    let tm = '';
    if(s.type==='stop'){
      if(pas) tm = '通過 '+hm(pas.pressed_at);
      else {
        if(arr) tm += '着 '+hm(arr.pressed_at);
        if(dep) tm += (tm?' / ':'')+'発 '+hm(dep.pressed_at);
      }
    } else if(one) tm = hm(one.pressed_at);

    h += `<div class="step ${state}" id="step${i}">
      <div class="head">
        <div class="mark">${mark}</div>
        <div class="name">${esc(s.label)}</div>
        <div class="time">${tm}</div>
      </div>`;
    if(s.note) h += `<div class="warn">⚠ ${esc(s.note).replace(/／/g,'<br>⚠ ')}</div>`;

    // 登校便の最後（学校）は全員が降りるだけなので、人数の入力欄は出さない。
    // かわりに「乗せた○人 → 全員降りた」の確認を出す（下の allOffRow）
    const noBox = (CI.mode==='登校') && s.last;
    const plab  = (CI.mode==='登校' || s.first) ? '乗車' : '降車';
    const pbox = (s.seq!=null && !noBox) ? `<div class="pbox"><div class="plab">${plab}</div>
        <input type="number" inputmode="numeric" min="0" max="99" value="${cnt!=null?cnt:''}"
          onchange="setCount(${s.seq}, this.value)" placeholder="—"></div>` : '';
    // 下校便は、降ろすたびに車内に何人残るかを出す
    const rleft = (CI.mode==='下校' && s.type==='stop' && !s.first) ? CI.remain[s.seq] : null;
    // 途中で人が残っているのは当たり前。赤くするのは「最後なのに残っている」「数が合わない」ときだけ
    const rbad  = (rleft!=null) && (rleft < 0 || (s.last && rleft !== 0));
    const rrow  = (rleft==null) ? ''
      : `<div class="remain${rbad?' bad':''}">車内に残り ${rleft}人</div>`;

    if(i===nowIdx && s.type==='stop'){
      // 「着いた」／人数／「出発」を横に並べる。押したボタンは時刻に変わり、
      // もう一度タップで取り消しに入る（運行中に確認文を読む余裕がないため）
      h += `<div class="actrow">
        ${actBtn(i,'到着','着いた',arr)}${pbox}${actBtn(i,'出発','出発',dep)}
      </div>
      <div class="passrow">${passBtn(i)}</div>`;
      h += legLinks(s);
    } else if(i===nowIdx && s.type==='one'){
      h += `<div class="actrow">${actBtn(i,s.kind,s.btn,one)}</div>`;
      h += legLinks(s);              // 帰庫のときは「車庫までの道案内」が出る
    } else if(pbox){
      // 済んだ分・これからの分も、人数はいつでも入れられる
      h += `<div class="actrow"><div class="pspacer"></div>${pbox}</div>`;
    }
    h += rrow;
    // 最後のバス停は「全員降りた」を押して完了。押し忘れると次へ進まない
    if(s.type==='stop' && s.last) h += allOffRow(i, s, CI);
    // 済んだ手順は、もう一度タップで取り消せるボタンを出す
    if(done && i===nowIdx-1){
      h += `<div class="passrow">${
        s.type==='stop'
          ? actBtn(i, evOf('通過',s.seq)?'通過':'出発', '', evOf('通過',s.seq)||dep, true)
          : actBtn(i, s.kind, '', one, true)
      }</div>`;
    }
    h += '</div>';
  });
  h += '<p class="hint">人数は、運行が一区切りついてから入れても構いません。あとから直せます。</p>';

  app.innerHTML = h;
  scrollToNow(nowIdx);
}

/** 手順を組み立てる：出庫 → 各バス停（着いた→出発） → 帰庫
 *  バス停は「着いた」と「出発」の2段。着いてから出発までの間に乗降と人数入力を行う。
 *  この間は画面を動かさず、**出発を押したときだけ次へ進む**（2026-08-20 八重樫さんの要望）。
 *  曲がり角の目印はボタンにしないが、注意書きがあれば次のバス停にまとめて出す（見落とし防止） */
function buildSteps(seg){
  const pts = seg.points;
  const gar = garagePoint();                    // そのコースの車庫（座標が入っていれば）
  const steps = [];
  // 送迎が選ばれている便は、出社・出庫が通常より早い。その予定を出庫に添える
  const tm = (INFO && INFO.scenario_times && INFO.scenario_times[seg.segment]) || null;
  const plan = tm ? ['出社 ' + (tm.shussha ? String(tm.shussha).slice(0,5) : '—'),
                     '出庫 ' + (tm.shukko  ? String(tm.shukko ).slice(0,5) : '—')].join('　') : null;
  steps.push({ type:'one', kind:'出庫', seq:null, label:'出庫', btn:'出庫した',
               note: plan ? ('この便は添乗員の送迎があります　予定 ' + plan) : null });
  let carry = [];                               // 手前の目印に付いていた注意書き
  let firstStopDone = false;                    // 最初のバス停＝車庫から来る区間
  pts.forEach((p,idx)=>{
    const n = (p.note||'').trim();
    if(!p.is_stop){ if(n) carry.push(n); return; }
    const notes = carry.concat(n?[n]:[]);
    carry = [];
    steps.push({ type:'stop', seq:p.seq, label:p.name||('地点'+p.seq),
                 note: notes.length ? notes.join('／') : null,
                 legs: legsTo(pts, idx, gar, seg.segment),
                 // 渋滞・事故のときに選べるサブルート（会社が用意した道）
                 subs: firstStopDone ? null : kaisouSubs(seg.segment, '出庫', null, pts.slice(0, idx+1)) });
    firstStopDone = true;
  });
  // 最初と最後のバス停に印をつける。
  // 登校便＝最後が学校（全員降りる）／下校便＝最初が学校（全員乗る）
  const stops = steps.filter(s=>s.type==='stop');
  if(stops.length){ stops[0].first = true; stops[stops.length-1].last = true; }
  // 便が終わったあとの回送。行き先は車庫とは限らない（登校の後は「他所移動」もある）。
  // ④で道が決まっていれば、その道の**最後の地点が行き先**になる
  const kaiEnd = kaisouPoints(seg.segment, '帰庫');
  const endPt  = kaiEnd.length ? kaiEnd[kaiEnd.length-1] : gar;
  steps.push({ type:'one', kind:'帰庫', seq:null, label:'帰庫', btn:'帰庫した',
               note: carry.length ? carry.join('／') : null,
               mapTo: endPt ? (endPt.name || '車庫') : null,
               legs: (pts.length && (kaiEnd.length || gar))
                 ? chainLegs(dedupePts([pts[pts.length-1]].concat(
                     kaiEnd.length ? kaiEnd
                                   : transferPoints(seg.segment,'後').concat([gar]))))
                 : null,
               subs: (pts.length && gar)
                 ? kaisouSubs(seg.segment, '帰庫', null, [pts[pts.length-1]]) : null });
  return steps;
}

/** 「35°44'10.0"N 139°43'58.5"E」と「35.544222, 139.704389」の両方を受ける。
 *  ⚠️ unkou.html の dmsToDecimal と同じもの。直すときは両方直すこと */
function parseCoord(s){
  const t = String(s||'').trim();
  const m = t.match(/(\d+)°(\d+)'([\d.]+)"([NS])\s*[, ]\s*(\d+)°(\d+)'([\d.]+)"([EW])/);
  if(m){
    const lat=(Number(m[1])+Number(m[2])/60+Number(m[3])/3600)*(m[4]==='S'?-1:1);
    const lng=(Number(m[5])+Number(m[6])/60+Number(m[7])/3600)*(m[8]==='W'?-1:1);
    return { lat:+lat.toFixed(6), lng:+lng.toFixed(6) };
  }
  const d = t.match(/^(-?\d+\.\d+)\s*[, ]\s*(-?\d+\.\d+)$/);
  if(d) return { lat:+Number(d[1]).toFixed(6), lng:+Number(d[2]).toFixed(6) };
  return null;
}

/** そのコースが所属する車庫を、道案内の地点として返す。座標が未登録なら null */
function garagePoint(){
  const g = INFO && INFO.garage;
  if(!g || !g.coord) return null;
  const c = parseCoord(g.coord);
  return c ? { lat:c.lat, lng:c.lng, name:g.name || '車庫', is_stop:true, split_here:false } : null;
}

/** その手順が済んだか。バス停は「出発」まで押して完了。
 *  乗降がなく停まらなかった場合は「通過」だけで完了とする。
 *  最後のバス停だけは「全員降りた」の確認まで済んで完了（置き去り防止） */
function stepDone(s){
  if(s.type==='stop'){
    const moved = !!(evOf('出発', s.seq) || evOf('通過', s.seq));
    return s.last ? (moved && !!evOf('全員降車確認', s.seq)) : moved;
  }
  return !!evOf(s.kind, s.seq);
}

/** 人数の意味と集計。法令（運輸規則25条）は人数の記録を求めていないが、
 *  乗せた数と降ろした数が合うかは置き去り防止の要になるため、その場で見えるようにする。
 *
 *  登校便：各バス停で「乗った人数」。最後のバス停（学校）で全員降りる
 *  下校便：最初のバス停（学校）で「乗った人数」。以降の各バス停で「降りた人数」 */
function countInfo(steps){
  const stops = steps.filter(s=>s.type==='stop');
  const num = s => {
    const v = COUNTS[SEG+'|'+s.seq];
    return (v==null || v==='') ? null : Number(v);
  };
  if(SEG === '登校'){
    const boarding = stops.slice(0, -1);          // 最後（学校）は降りるだけなので数えない
    const filled = boarding.filter(s=>num(s)!=null);
    return { mode:'登校', total: filled.reduce((a,s)=>a+num(s), 0),
             known: filled.length>0 && filled.length===boarding.length, remain:{} };
  }
  const total = stops.length ? num(stops[0]) : null;
  const remain = {}; let left = total;
  stops.forEach((s,i)=>{
    if(i===0) return;
    const n = num(s);
    if(left!=null && n!=null) left = left - n;
    remain[s.seq] = (total==null) ? null : left;
  });
  return { mode:'下校', total, known: total!=null, remain };
}

/** 最後のバス停に出す「全員降りた」の確認。ここが置き去り防止の最終チェックになる */
function allOffRow(i, s, CI){
  const ev = evOf('全員降車確認', s.seq);
  let info;
  if(CI.mode === '登校'){
    info = CI.known ? `乗せた <b>${CI.total}</b>人` : '乗せた人数は未入力';
  }else{
    const left = CI.remain[s.seq];
    info = (left==null) ? '人数は未入力'
         : (left===0 ? '残り <b>0</b>人'
                     : `<span class="bad">残り ${left}人</span>`);
  }
  return `<div class="allrow"><div class="allinfo">${info}</div>${
    actBtn(i, '全員降車確認', '全員降りた', ev, false, '✓ 確認')}</div>`;
}

/** 一つ前のバス停（または先頭）から、このバス停までの道案内。
 *  途中に「区切」があれば、そこで切って**複数の案内に分ける**。
 *  区切の地点は手前の区間の「終点」にし、次の区間は**その次の地点から**始める
 *  （Uターンのように区切の前後をナビに任せられないため。unkou.html の rptLegs と同じ考え方）
 *
 *  ⚠️ 2026-08-20 まではここで `is_stop || split_here` の手前まで遡っていたため、
 *  区切のある区間は**前半が丸ごと抜け落ち**、しかも案内の出発点が区切の地点になっていた。
 *  Googleはそこから回り道を組み立てるので、ルートが壊れて見えた（八重樫さんが実車で発見）。 */
function legsTo(pts, toIdx, gar, segName){
  let from = -1;
  for(let i=toIdx-1;i>=0;i--){ if(pts[i].is_stop){ from=i; break; } }   // 遡るのはバス停まで
  if(from >= 0) return chainLegs(pts.slice(from, toIdx+1));
  // 手前にバス停が無い＝この便の最初のバス停。ここは**車庫から**の案内になる。
  // ・④で「出庫回送」の道が入っていれば、それを使う（通る道を会社が決めている）
  // ・入っていなければ、送迎の乗降地点だけを通す（道はナビ任せ）
  // ④で回送の道が決まっていれば、**その道が起点（車庫や他所）を持っている**ので車庫を足さない。
  // 決まっていなければ、車庫から送迎の乗降地点を通す（道はナビ任せ）
  const kai = kaisouPoints(segName, '出庫');
  const head = kai.length ? kai : (gar ? [gar] : []).concat(transferPoints(segName, '前'));
  return chainLegs(dedupePts(head.concat(pts.slice(0, toIdx+1))));
}

/** 続けて同じ場所が並んだら1つにまとめる。
 *  回送の道は**車庫と第1バス停を含んでいる**ので、そのまま前後に足すと重複する
 *  （2026-08-21 実データで「都筑営業所車庫 → 都筑営業所車庫」が出て発覚） */
function dedupePts(list){
  const key = p => Number(p.lat).toFixed(6) + ',' + Number(p.lng).toFixed(6);
  const out = [];
  list.forEach(p=>{
    const q = out[out.length-1];
    if(q && key(q) === key(p)){
      q.is_stop = q.is_stop || p.is_stop;
      q.split_here = q.split_here || p.split_here;
      q.brk = q.brk || p.brk;
      q.transfer = q.transfer || p.transfer;
      if(!q.name && p.name) q.name = p.name;
      if(!q.kind && p.kind) q.kind = p.kind;
      if(!q.bus_time && p.bus_time) q.bus_time = p.bus_time;
      return;
    }
    out.push(Object.assign({}, p));
  });
  return out;
}

/** 地点の並びを、複数の道案内に分ける。
 *  ・区切（split_here）… その地点で終わり、**次の地点から**やり直す（Uターンなど）
 *  ・送迎地点（brk）  … その地点で区切り、**同じ地点から**続ける（停まって乗り降りするため） */
function chainLegs(seg){
  const mk = (a,b) => {
    const e = seg[b];
    // 「添乗員 乗車 06:30」と書けるのは送迎シナリオの地点だけ。
    // 回送の途中に置いたバス停の印は、名前をそのまま出す
    let label = null;
    if(e.transfer) label = (e.name||'送迎地点') + '（添乗員 ' + (e.kind||'乗降')
                         + (e.bus_time ? ' ' + String(e.bus_time).slice(0,5) : '') + '）';
    else if(e.brk) label = e.name || null;
    return { pts: seg.slice(a,b+1), toName: e.name||'', cut: !!e.split_here, label };
  };
  const out = []; let start = 0;
  for(let i=1;i<seg.length-1;i++){
    if(seg[i].split_here){ if(i>start) out.push(mk(start,i)); start = i+1; }
    else if(seg[i].brk)  { if(i>start) out.push(mk(start,i)); start = i;   }
  }
  if(seg.length-1 >= start) out.push(mk(start, seg.length-1));
  return out.filter(g => g.pts.filter(p=>p.lat!=null&&p.lng!=null).length >= 2);
}

/** その便の回送のルート一覧（運行時程マスタ④で決めた道）。
 *  先頭がメイン、以降がサブルート（渋滞・事故のときに運転手が選ぶ）。
 *  which は '出庫' か '帰庫'。入っていなければ空の配列 */
function kaisouRoutes(segName, which){
  const o = (INFO && INFO.kaisou && INFO.kaisou[segName]) || null;
  return ((o && o[which]) || []).map(r => ({
    name: r.name || '',
    pts: (r.points || [])
      .filter(p => p && p.lat != null && p.lng != null)
      .map(p => ({ lat:Number(p.lat), lng:Number(p.lng), name:p.name || '',
                   is_stop:!!p.is_stop, split_here:!!p.split_here, brk:!!p.is_stop }))
  })).filter(r => r.pts.length);
}
/** メインの道の地点（無ければ空） */
function kaisouPoints(segName, which){
  const rs = kaisouRoutes(segName, which);
  return rs.length ? rs[0].pts : [];
}
/** サブルート（メイン以外）を、案内リンクにできる形で返す。
 *  ⚠️ 会社が用意した道の中から運転手が選ぶ。Googleに自由に選ばせるのとは違う
 *     （バス進入禁止・狭路・隘路に入り込むため。2026-08-21 八重樫さんの指摘） */
function kaisouSubs(segName, which, gar, tail){
  return kaisouRoutes(segName, which).slice(1).map(r => ({
    name: r.name,
    pts: dedupePts((which === '出庫') ? (gar ? [gar] : []).concat(r.pts, tail || [])
                                      : (tail || []).concat(r.pts, gar ? [gar] : []))
  }));
}

/** その便の添乗員の乗降地点。配置（duties.scenario_id）で選ばれたシナリオのもの。
 *  '前' は車庫と第1バス停の間、'後' は最終地点と帰庫の間に入る */
function transferPoints(segName, when){
  const list = (INFO && INFO.transfers && INFO.transfers[segName]) || [];
  return list
    .filter(p => String(p.phase || '').endsWith(when))
    .map(p => {
      const c = parseCoord(p.coord);
      return c ? { lat:c.lat, lng:c.lng, name:p.name || '送迎地点', kind:p.kind,
                   bus_time:p.bus_time, is_stop:true, split_here:false, brk:true, transfer:true } : null;
    })
    .filter(Boolean);
}

function evOf(kind, seq){ return EVENTS[SEG+'|'+kind+'|'+(seq==null?'':seq)] || null; }
function setSeg(s){ SEG=s; _lastNow=-1; render(); }

/** 次に押す手順を画面の中ほどへ寄せる。
 *  **手順が進んだときだけ**動かす。「着いた」を押しても同じ手順の中なので画面は動かない
 *  （着いた→乗降・人数入力→出発、の間に画面が飛ぶと操作しにくい・2026-08-20 八重樫さんの指摘） */
let _firstDraw = true, _lastNow = -1;
function scrollToNow(nowIdx){
  if(nowIdx === _lastNow) return;          // 同じ手順の中なら動かさない
  const a=document.activeElement;
  if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA')) return;   // 入力中は動かさない
  // ※ここで _lastNow を更新してしまうと、入力中に中断した回が「進んだ」扱いになり
  //   次の描画でもスクロールしなくなる。実際に動かせたときだけ更新する
  const wasFirst = _firstDraw;
  // 描画直後は位置がまだ確定していないので、少し待ってから動かす。
  // （requestAnimationFrame は画面を描いていないと発火しないため使わない）
  setTimeout(()=>{
    const el=document.querySelector('.step.now');
    if(!el) return;
    const b=document.activeElement;
    if(b && (b.tagName==='INPUT'||b.tagName==='TEXTAREA')) return;
    const before = window.scrollY;
    // 初回はすぐ表示したいので一瞬で、それ以降は「動いたこと」が分かるようゆっくり
    el.scrollIntoView({ behavior: wasFirst ? 'auto' : 'smooth', block:'center' });
    _lastNow = nowIdx; _firstDraw = false;
    if(wasFirst) return;
    // 保険：なめらか移動が効かない状況（画面を描いていないときなど）でも
    // 置いていかれないよう、少し待って動いていなければ一瞬で移動させる
    setTimeout(()=>{
      const now=document.querySelector('.step.now');
      if(!now) return;
      const t=now.getBoundingClientRect().top;
      const stuck = Math.abs(window.scrollY - before) < 4;
      const off   = (t < 0 || t > window.innerHeight - 80);
      if(stuck && off) now.scrollIntoView({ block:'center' });
    }, 450);
  }, 0);
}

/* ===== 押す・取り消す・人数 ===== */
function _step(i){ return buildSteps(INFO.segments.find(x=>x.segment===SEG))[i]; }

async function _record(kind, seq, label){
  const now = new Date().toISOString();
  const key = SEG+'|'+kind+'|'+(seq==null?'':seq);
  EVENTS[key] = { pressed_at: now };
  render();
  if(PREVIEW){ toast('見本のため記録していません'); return; }
  const r = await call('unkoubtn_press', { p_token:TOKEN, p_segment:SEG, p_kind:kind,
                                           p_seq:seq, p_label:label, p_pressed_at:now });
  if(!r.ok){ delete EVENTS[key]; render(); toast('記録できませんでした。もう一度押してください'); return; }
  toast(label+' '+(kind==='到着'?'着':kind==='出発'?'発':'')+' '+hm(now));
  startGeo();                 // まだ許可を聞いていなければ、押した操作をきっかけに聞く
  _saveGeo(kind, seq);        // 位置はあとから付ける（await しない＝ボタンを待たせない）
}

/* ===== 押した場所の記録 =====
   この構想の出発点は「デジタコの実車/空車の切替を、高齢の運転手が的確に押せていない」
   という問題（2026-08-17 八重樫さん指摘）。押した場所が残れば、
   **本当にそのバス停で押したか**を後から確かめられる。

   ・走行中ずっと位置を追い続けることはできない（画面が消える・別アプリに移ると止まる）
   ・画面を見て押す瞬間はアプリが前面にあるので、そこは確実に取れる
   → 画面が見えている間だけ位置を温めておき、押した瞬間の値を使う */
let GEO = null;            // { lat, lng, acc, at }
let _geoWatch = null;

function geoFresh(ms){ return (GEO && (Date.now() - GEO.at) <= ms) ? GEO : null; }
function geoMark(){
  const el = document.getElementById('geoMark');
  if(!el) return;
  const g = geoFresh(120000);
  el.textContent = g ? '📍' : '';
  el.title = g ? ('位置の精度 約' + Math.round(g.acc) + 'm') : '';
}
function startGeo(){
  if(_geoWatch != null || !navigator.geolocation) return;
  try{
    _geoWatch = navigator.geolocation.watchPosition(
      p => { GEO = { lat:p.coords.latitude, lng:p.coords.longitude,
                     acc:p.coords.accuracy, at:Date.now() }; geoMark(); },
      () => { geoMark(); },          // 断られても運行の邪魔はしない（記録は時刻だけになる）
      { enableHighAccuracy:true, maximumAge:10000, timeout:20000 });
  }catch(e){}
}
function stopGeo(){
  if(_geoWatch == null) return;
  try{ navigator.geolocation.clearWatch(_geoWatch); }catch(e){}
  _geoWatch = null;
}
document.addEventListener('visibilitychange', ()=>{ document.hidden ? stopGeo() : startGeo(); });

/** 押した瞬間の位置。温めた値が新しければそれを使い、無ければその場で1回だけ取りにいく */
function geoNow(){
  const warm = geoFresh(20000);
  if(warm) return Promise.resolve(warm);
  if(!navigator.geolocation) return Promise.resolve(null);
  return new Promise(res=>{
    let done = false;
    const fin = v => { if(!done){ done = true; res(v); } };
    try{
      navigator.geolocation.getCurrentPosition(
        p => fin({ lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, at:Date.now() }),
        () => fin(null),
        { enableHighAccuracy:true, maximumAge:10000, timeout:12000 });
    }catch(e){ fin(null); }
    setTimeout(()=>fin(null), 13000);            // 端末が黙っても必ず終わらせる
  });
}

/** 位置は「押した記録」と別に付ける。位置が取れなくても運行の記録は残る */
async function _saveGeo(kind, seq){
  if(PREVIEW) return;
  const g = await geoNow();
  if(!g) return;
  GEO = g; geoMark();
  await call('unkoubtn_locate', { p_token:TOKEN, p_segment:SEG, p_kind:kind, p_seq:seq,
                                  p_lat:g.lat, p_lng:g.lng, p_accuracy:Math.round(g.acc) });
}
async function _erase(kind, seq, label){
  const key = SEG+'|'+kind+'|'+(seq==null?'':seq);
  const bk = EVENTS[key]; delete EVENTS[key]; render();
  if(PREVIEW){ toast('見本のため記録していません'); return; }
  const r = await call('unkoubtn_undo', { p_token:TOKEN, p_segment:SEG, p_kind:kind, p_seq:seq });
  if(!r.ok){ EVENTS[key]=bk; render(); toast('取り消せませんでした'); return; }
  toast('取り消しました');
}

/* 押す・取り消すは onAct にまとめた（もう一度タップ方式）。
   確認ダイアログは運行中に読めないため使わない */
async function setCount(seq, val){
  const n = (val==='' ? null : Math.max(0, parseInt(val,10)||0));
  COUNTS[SEG+'|'+seq] = n;
  if(PREVIEW){ toast('見本のため記録していません'); return; }
  const r = await call('unkoubtn_count', { p_token:TOKEN, p_segment:SEG, p_seq:seq, p_passengers:n });
  toast(r.ok ? '人数を記録しました' : '記録できませんでした');
}

async function call(fn, body){
  try{
    const res = await fetch(`${REST_URL}/rpc/${fn}`, { method:'POST',
      headers:{ 'apikey':ANON_KEY, 'Authorization':'Bearer '+ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify(body) });
    const j = await res.json().catch(()=>null);
    return { ok: res.ok && j && j.ok!==false, data: j };
  }catch(e){ return { ok:false }; }
}

/* ===== 起動 ===== */
async function start(){
  const hash = location.hash || '';
  PREVIEW = /(^|#|&)preview/.test(hash);
  const m = hash.match(/[#&]t=([0-9a-f]{64})/i);
  TOKEN = m ? m[1] : '';

  if(PREVIEW){ INFO = await previewInfo(); render(); return; }
  if(!TOKEN){
    document.getElementById('barSub').textContent = '';
    document.getElementById('app').innerHTML =
      '<div class="err">リンクが正しくありません。<br>事務所から届いたリンクを、そのまま開いてください。</div>';
    return;
  }
  const r = await call('unkoubtn_open', { p_token: TOKEN });
  if(!r.ok || !r.data){
    document.getElementById('barSub').textContent = '';
    document.getElementById('app').innerHTML =
      '<div class="err">リンクの有効期限が切れているか、正しくありません。<br>事務所にご連絡ください。</div>';
    return;
  }
  INFO = r.data;
  (INFO.events||[]).forEach(e=>{ EVENTS[e.segment+'|'+e.kind+'|'+(e.seq==null?'':e.seq)] =
    { pressed_at:e.pressed_at, id:e.id }; if(e.passengers!=null) COUNTS[e.segment+'|'+e.seq]=e.passengers; });
  render();
  startGeo();   // 位置の許可をここで聞く。断られてもボタンはそのまま使える
}

/** 見本モード：ログインなしで中身を見せる（公開されている経路データを読むだけ） */
async function previewInfo(){
  const h = { 'apikey':ANON_KEY, 'Authorization':'Bearer '+ANON_KEY };
  let course=null, pts=[];
  try{
    const rc = await fetch(`${REST_URL}/courses?select=id,school_name,course_name&limit=1&order=id`, {headers:h});
    const cs = rc.ok ? await rc.json() : [];
    course = cs[0] || null;
    if(course){
      const rp = await fetch(`${REST_URL}/course_route_points?course_id=eq.${course.id}&select=segment,seq,name,lat,lng,is_stop,split_here,note&order=segment,seq`, {headers:h});
      pts = rp.ok ? await rp.json() : [];
    }
  }catch(e){}
  if(!pts.length) return sampleInfo();
  const byseg = {};
  pts.forEach(p=>{ (byseg[p.segment]=byseg[p.segment]||[]).push(p); });
  const label = { '登校':'登校便','下校①':'下校便①','下校②':'下校便②','下校③':'下校便③' };
  return {
    work_date: todayStr(),
    driver_name: '（見本）',
    course_label: (course.school_name||'')+'／'+(course.course_name||''),
    segments: Object.keys(byseg).sort().map(s=>({ segment:s, label:label[s]||s, points:byseg[s] })),
    events: []
  };
}
function sampleInfo(){
  return { work_date: todayStr(), driver_name:'（見本）', course_label:'見本コース',
    segments:[{ segment:'登校', label:'登校便', points:[
      {seq:1,name:'○○バス停',lat:35.5,lng:139.7,is_stop:true,split_here:false,note:null},
      {seq:2,name:'△△小学校',lat:35.6,lng:139.7,is_stop:true,split_here:false,note:'正門前で乗降'},
      {seq:3,name:'□□支援学校',lat:35.7,lng:139.7,is_stop:true,split_here:false,note:'8:30まで進入禁止'}
    ]}], events:[] };
}

document.addEventListener('DOMContentLoaded', start);
</script>
