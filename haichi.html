<script>
// ===== 高尾輸送サービス 管理システム 共通認証モジュール =====
// initAuth(['admin', 'staff'])  → 管理者・事務員どちらも可
// initAuth(['admin'])           → 管理者のみ

const AUTH_URL  = 'https://wxdyqkyqtizhtkwtpvru.supabase.co/auth/v1';
const REST_URL  = 'https://wxdyqkyqtizhtkwtpvru.supabase.co/rest/v1';
const ANON_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4ZHlxa3lxdGl6aHRrd3RwdnJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NzYxODEsImV4cCI6MjA5OTQ1MjE4MX0.yVbClXBk2JVeglevsBLY5sH2_m2ybCf71u4i_YYWyHE';

const ROLE_LABEL = { super_admin: '権限付与者', admin: 'システム管理者', operator: '担当者', staff: '事務員' };

/* ===================== セッション管理 ===================== */

function _saveSession(data) {
  const session = {
    access_token:  data.access_token,
    refresh_token: data.refresh_token,
    expires_at:    data.expires_at || (Math.floor(Date.now() / 1000) + (data.expires_in || 3600)),
    user_id:       data.user?.id || data.user_id,
    email:         data.user?.email || data.email,
  };
  sessionStorage.setItem('takao_session', JSON.stringify(session));
  return session;
}

function _getSession() {
  try { return JSON.parse(sessionStorage.getItem('takao_session')); }
  catch { return null; }
}

function _clearSession() {
  sessionStorage.removeItem('takao_session');
  sessionStorage.removeItem('takao_role');
  sessionStorage.removeItem('takao_name');
  sessionStorage.removeItem('takao_permissions');
  sessionStorage.removeItem('takao_mfa_enforced');
}

// refresh_token でアクセストークンを更新する（成功=true）。長時間開いても保存が切れないように使う
async function refreshSession() {
  const s = _getSession();
  if (!s || !s.refresh_token) return false;
  try {
    const res = await fetch(`${AUTH_URL}/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    });
    if (!res.ok) return false;
    const data = await res.json();
    if (!data || !data.access_token) return false;
    _saveSession(data);
    return true;
  } catch { return false; }
}
// 期限が近い/切れていれば先に更新
async function ensureFreshToken() {
  const s = _getSession();
  if (s && s.expires_at && (s.expires_at - 60) < Math.floor(Date.now() / 1000)) {
    await refreshSession();
  }
}

function getPermissions() {
  try { return JSON.parse(sessionStorage.getItem('takao_permissions')) || {}; }
  catch { return {}; }
}

function isMfaEnforced() {
  return sessionStorage.getItem('takao_mfa_enforced') === 'true';
}

function _isExpired(session) {
  if (!session?.expires_at) return true;
  return Math.floor(Date.now() / 1000) > session.expires_at - 60;
}

function _authHeaders(token) {
  return {
    'Content-Type': 'application/json',
    'apikey': ANON_KEY,
    'Authorization': `Bearer ${token || ANON_KEY}`
  };
}

/* ===================== Supabase Auth API ===================== */

async function _refresh(session) {
  try {
    const res = await fetch(`${AUTH_URL}/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    if (!res.ok) return null;
    return _saveSession(await res.json());
  } catch { return null; }
}

async function _getRole(accessToken) {
  const cached = sessionStorage.getItem('takao_role');
  if (cached) return cached;
  try {
    const res = await fetch(`${REST_URL}/user_roles?select=role,display_name,permissions,mfa_enforced`, {
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${accessToken}` },
    });
    if (!res.ok) return null;
    const data = await res.json();
    const row = data[0];
    if (!row) return null;
    sessionStorage.setItem('takao_role', row.role);
    if (row.display_name) sessionStorage.setItem('takao_name', row.display_name);
    if (row.permissions) sessionStorage.setItem('takao_permissions', JSON.stringify(row.permissions));
    if (row.mfa_enforced != null) sessionStorage.setItem('takao_mfa_enforced', String(row.mfa_enforced));
    return row.role;
  } catch { return null; }
}

/* ===================== 公開 API ===================== */

/**
 * ログイン（パスワード認証 → MFA確認）
 * 戻り値:
 *   { ok: false, error }
 *   { ok: true, role }              ← MFAなし or MFA未設定
 *   { ok: true, mfaRequired: true, factorId, tempToken } ← MFA必要
 */
async function signIn(email, password) {
  try {
    const res = await fetch(`${AUTH_URL}/token?grant_type=password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) return { ok: false, error: data.error_description || 'ログインに失敗しました' };

    const session = _saveSession(data);

    // MFA登録チェック（/auth/v1/user と /auth/v1/factors の両方を試す）
    try {
      let totpFactor = null;

      // 方法1: /auth/v1/user のfactorsフィールドで確認
      const uRes = await fetch(`${AUTH_URL}/user`, {
        headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${session.access_token}` }
      });
      if (uRes.ok) {
        const userData = await uRes.json();
        const uf = Array.isArray(userData.factors) ? userData.factors : [];
        totpFactor = uf.find(f => f.factor_type === 'totp' && f.status === 'verified') || null;
      }

      // 方法2: /auth/v1/factors でも確認（方法1で見つからない場合のフォールバック）
      if (!totpFactor) {
        const fRes = await fetch(`${AUTH_URL}/factors`, {
          headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${session.access_token}` }
        });
        if (fRes.ok) {
          const fData = await fRes.json();
          const ff = Array.isArray(fData) ? fData
                   : Array.isArray(fData?.factors) ? fData.factors : [];
          totpFactor = ff.find(f => f.factor_type === 'totp' && f.status === 'verified') || null;
        }
      }

      if (totpFactor) {
        // MFA必要 → セッションを一旦クリアし、仮トークンだけ返す
        _clearSession();
        return { ok: true, mfaRequired: true, factorId: totpFactor.id, tempToken: session.access_token };
      }
    } catch (_) {}

    // MFA不要
    const role = await _getRole(session.access_token);
    // ロール取得に失敗してもセッションは有効なので消去しない
    return { ok: true, role: role || null };
  } catch (e) {
    return { ok: false, error: 'ネットワークエラー: ' + e.message };
  }
}

/**
 * MFA（TOTP）認証 — パスワード認証の続き
 */
async function signInMfa(factorId, code, tempToken) {
  try {
    const chRes = await fetch(`${AUTH_URL}/factors/${factorId}/challenge`, {
      method: 'POST',
      headers: _authHeaders(tempToken),
      body: JSON.stringify({})
    });
    if (!chRes.ok) return { ok: false, error: '認証チャレンジの作成に失敗しました' };
    const { id: challengeId } = await chRes.json();

    const vRes = await fetch(`${AUTH_URL}/factors/${factorId}/verify`, {
      method: 'POST',
      headers: _authHeaders(tempToken),
      body: JSON.stringify({ challenge_id: challengeId, code })
    });
    if (!vRes.ok) return { ok: false, error: 'コードが正しくありません。認証アプリを確認してください。' };

    const session = _saveSession(await vRes.json());
    const role = await _getRole(session.access_token);
    // ロール取得に失敗してもセッションは有効なので消去しない
    return { ok: true, role: role || null };
  } catch (e) {
    return { ok: false, error: 'ネットワークエラー: ' + e.message };
  }
}

/**
 * ログアウト
 */
async function signOut() {
  const session = _getSession();
  if (session?.access_token) {
    fetch(`${AUTH_URL}/logout`, {
      method: 'POST',
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${session.access_token}` },
    }).catch(() => {});
  }
  _clearSession();
  window.location.href = 'login.html';
}

/**
 * パスワード変更（ログイン中のユーザー自身）
 */
async function changePassword(newPassword) {
  const session = _getSession();
  if (!session?.access_token) return { ok: false, error: 'セッションが無効です' };
  try {
    const res = await fetch(`${AUTH_URL}/user`, {
      method: 'PUT',
      headers: _authHeaders(session.access_token),
      body: JSON.stringify({ password: newPassword })
    });
    if (res.ok) return { ok: true };
    const d = await res.json();
    return { ok: false, error: d.msg || d.message || 'パスワード変更に失敗しました' };
  } catch (e) {
    return { ok: false, error: 'ネットワークエラー: ' + e.message };
  }
}

/**
 * TOTP登録開始（QRコードURIを返す）
 */
async function enrollTotp() {
  let session = _getSession();
  if (!session?.access_token) return { ok: false, error: 'セッションが無効です' };

  // セッションの有効期限が近い場合はリフレッシュ
  if (_isExpired(session)) {
    session = await _refresh(session);
    if (!session) return { ok: false, error: 'セッションの更新に失敗しました。再ログインしてください。' };
  }

  try {
    // 未確認（unverified）のTOTPファクターのみ削除（確認済みのものは絶対に削除しない）
    const listRes = await fetch(`${AUTH_URL}/factors`, {
      headers: _authHeaders(session.access_token)
    });
    if (listRes.ok) {
      const factors = await listRes.json();
      if (Array.isArray(factors)) {
        // 確認済みファクターが既にある場合はエラーを返す
        const verified = factors.find(f => f.factor_type === 'totp' && f.status === 'verified');
        if (verified) {
          return { ok: false, error: '二段階認証はすでに設定済みです。一度「解除する」してから再設定してください。' };
        }
        // 未確認ファクターのみ削除
        for (const f of factors) {
          if (f.factor_type === 'totp' && f.status === 'unverified') {
            await fetch(`${AUTH_URL}/factors/${f.id}`, {
              method: 'DELETE',
              headers: _authHeaders(session.access_token)
            });
          }
        }
      }
    }

    const res = await fetch(`${AUTH_URL}/factors`, {
      method: 'POST',
      headers: _authHeaders(session.access_token),
      body: JSON.stringify({ factor_type: 'totp', friendly_name: '高尾輸送サービス', issuer: '高尾輸送サービス' })
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      const msg = errData.msg || errData.message || errData.error_description || errData.code || `エラー(${res.status})`;
      return { ok: false, error: 'QRコードの生成に失敗しました: ' + msg };
    }
    const d = await res.json();
    return { ok: true, factorId: d.id, totpUri: d.totp?.uri, secret: d.totp?.secret };
  } catch (e) {
    return { ok: false, error: 'ネットワークエラー: ' + e.message };
  }
}

/**
 * TOTP登録確認（初回コード検証）
 */
async function verifyTotpEnrollment(factorId, code) {
  const session = _getSession();
  if (!session?.access_token) return { ok: false, error: 'セッションが無効です' };
  try {
    const chRes = await fetch(`${AUTH_URL}/factors/${factorId}/challenge`, {
      method: 'POST', headers: _authHeaders(session.access_token), body: JSON.stringify({})
    });
    if (!chRes.ok) return { ok: false, error: 'チャレンジ作成に失敗しました' };
    const { id: challengeId } = await chRes.json();

    const vRes = await fetch(`${AUTH_URL}/factors/${factorId}/verify`, {
      method: 'POST',
      headers: _authHeaders(session.access_token),
      body: JSON.stringify({ challenge_id: challengeId, code })
    });
    if (!vRes.ok) return { ok: false, error: 'コードが正しくありません。もう一度お試しください。' };
    _saveSession(await vRes.json());
    return { ok: true };
  } catch (e) {
    return { ok: false, error: 'ネットワークエラー: ' + e.message };
  }
}

/**
 * 登録済みTOTPファクター一覧
 */
async function getEnrolledFactors() {
  const session = _getSession();
  if (!session?.access_token) return [];
  try {
    const res = await fetch(`${AUTH_URL}/factors`, {
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${session.access_token}` }
    });
    if (!res.ok) return [];
    const factors = await res.json();
    return Array.isArray(factors) ? factors.filter(f => f.factor_type === 'totp' && f.status === 'verified') : [];
  } catch { return []; }
}

/**
 * TOTP解除
 */
async function unenrollTotp(factorId) {
  const session = _getSession();
  if (!session?.access_token) return { ok: false };
  try {
    const res = await fetch(`${AUTH_URL}/factors/${factorId}`, {
      method: 'DELETE',
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${session.access_token}` }
    });
    return { ok: res.ok };
  } catch { return { ok: false }; }
}

/**
 * 認証チェック（各ページのDOMContentLoaded前に呼ぶ）
 */
async function initAuth(allowedRoles) {
  document.documentElement.style.visibility = 'hidden';
  try {
    let session = _getSession();
    if (!session) { _redirectLogin(); return false; }
    if (_isExpired(session)) {
      session = await _refresh(session);
      if (!session) { _clearSession(); _redirectLogin(); return false; }
    }
    const role = await _getRole(session.access_token);
    if (!role || !allowedRoles.includes(role)) {
      _showDenied(role);
      document.documentElement.style.visibility = 'visible';
      return false;
    }
    _injectUserInfo(session.email, role);
    _injectModals();
    document.documentElement.style.visibility = 'visible';
    return true;
  } catch (err) {
    console.error('[auth.js] initAuth error:', err);
    document.documentElement.style.visibility = 'visible';
    return false;
  }
}

/* ===================== 内部ヘルパー ===================== */

function _redirectLogin() {
  document.documentElement.style.visibility = 'visible';
  window.location.href = 'login.html?redirect=' + encodeURIComponent(location.href);
}

function _showDenied(role) {

}

async function _doChangePassword() {
  const np   = document.getElementById('_tm_pw_new').value;
  const conf = document.getElementById('_tm_pw_conf').value;
  const err  = document.getElementById('_tm_pw_err');
  const ok   = document.getElementById('_tm_pw_ok');
  const btn  = document.getElementById('_tm_pw_btn');
  err.style.display = 'none';
  ok.style.display = 'none';
  if (np.length < 8) { err.textContent = 'パスワードは8文字以上で設定してください'; err.style.display = 'block'; return; }
  if (np !== conf)   { err.textContent = 'パスワードが一致しません'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = '変更中…';
  const result = await changePassword(np);
  btn.disabled = false; btn.textContent = '変更する';
  if (result.ok) {
    ok.style.display = 'block';
    document.getElementById('_tm_pw_new').value = '';
    document.getElementById('_tm_pw_conf').value = '';
    setTimeout(() => closePasswordChangeModal(), 2000);
  } else {
    err.textContent = result.error; err.style.display = 'block';
  }
}

  } else {
    status.textContent = '二段階認証は現在無効です。設定するとログイン時にアプリのコード入力が必要になります。';

async function _startTotpSetup() {
  const startBtn = document.getElementById('_tm_totp_start_btn');
  const err = document.getElementById('_tm_totp_err');
  err.style.display = 'none';
  startBtn.disabled = true; startBtn.textContent = 'QRコード生成中…';

  const result = await enrollTotp();
  startBtn.disabled = false; startBtn.textContent = 'QRコードを表示して設定開始';
  if (!result.ok) { err.textContent = result.error; err.style.display = 'block'; return; }

  _totpFactorId = result.factorId;
  document.getElementById('_tm_totp_secret').textContent = result.secret || '';

  // QRコード描画
  const canvas = document.getElementById('_tm_qr_canvas');
  canvas.innerHTML = '';
  _loadQRLib(() => {
    new QRCode(canvas, { text: result.totpUri, width: 200, height: 200,
      colorDark: '#2d4a36', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  });

  _showTotpStep1();
}

async function _verifyTotpSetup() {
  const code = document.getElementById('_tm_totp_code').value.replace(/\D/g, '');
  const err  = document.getElementById('_tm_totp_err');
  const ok   = document.getElementById('_tm_totp_ok');
  const btn  = document.getElementById('_tm_totp_verify_btn');
  err.style.display = 'none';
  if (code.length !== 6) { err.textContent = '6桁のコードを入力してください'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = '確認中…';
  const result = await verifyTotpEnrollment(_totpFactorId, code);
  btn.disabled = false; btn.textContent = '設定を完了する';
  if (result.ok) {
    ok.textContent = '✅ 二段階認証の設定が完了しました！次回ログインからコード入力が必要になります。';
    ok.style.display = 'block';
    _showTotpStep0();
    document.getElementById('_tm_totp_status').textContent = '✅ 二段階認証は有効です。認証アプリが設定されています。';
    document.getElementById('_tm_totp_start_btn').style.display = 'none';
    document.getElementById('_tm_totp_disable_btn').style.display = 'block';
  } else {
    err.textContent = result.error; err.style.display = 'block';
  }
}

async function _disableTotp() {
  const role = sessionStorage.getItem('takao_role');
  if (isMfaEnforced() && role !== 'super_admin') {
    alert('組織のポリシーにより二段階認証は解除できません。');
    return;
  }
  if (!confirm('二段階認証を解除しますか？\nログイン時のコード入力が不要になります。')) return;
  const result = await unenrollTotp(_totpFactorId);
  const err = document.getElementById('_tm_totp_err');
  const ok  = document.getElementById('_tm_totp_ok');
  if (result.ok) {
    ok.textContent = '二段階認証を解除しました。';
    ok.style.display = 'block';
    document.getElementById('_tm_totp_status').textContent = '二段階認証は現在無効です。';
    document.getElementById('_tm_totp_start_btn').style.display = 'block';
    document.getElementById('_tm_totp_disable_btn').style.display = 'none';
  } else {
    err.textContent = '解除に失敗しました。'; err.style.display = 'block';
  }
}

  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload = cb;
  document.head.appendChild(s);
}

// PostgREST は1回1000行までのため、1000件ずつ全件取得する
async function _fetchAll(pathWithQuery){
  const out=[]; let from=0; const step=1000;
  for(;;){
    const sep = pathWithQuery.indexOf('?')>=0?'&':'?';
    const r = await fetch(`${REST_URL}/${pathWithQuery}${sep}limit=${step}&offset=${from}`, {headers:getH()});
    if(!r.ok) break;
    const rows = await r.json();
    out.push(...rows);
    if(rows.length<step) break;
    from += step;
  }
  return out;
}

// 日本の国民の祝日（固定日・ハッピーマンデー・春分/秋分・振替休日・国民の休日）
function _jpHolidays(year){
  const H={}; const set=(mm,dd,name)=>{ if(dd>=1&&dd<=31) H[`${year}-${_p2(mm)}-${_p2(dd)}`]=name; };
  const nthMon=(mo,n)=>{ const first=new Date(year,mo-1,1).getDay(); return 1+((8-first)%7)+(n-1)*7; };
  set(1,1,'元日'); set(1,nthMon(1,2),'成人の日'); set(2,11,'建国記念の日');
  if(year>=2020) set(2,23,'天皇誕生日');
  set(3, Math.floor(20.8431+0.242194*(year-1980)-Math.floor((year-1980)/4)),'春分の日');
  set(4,29,'昭和の日'); set(5,3,'憲法記念日'); set(5,4,'みどりの日'); set(5,5,'こどもの日');
  set(7, nthMon(7,3),'海の日');
  if(year>=2016) set(8,11,'山の日');
  set(9, nthMon(9,3),'敬老の日');
  set(9, Math.floor(23.2488+0.242194*(year-1980)-Math.floor((year-1980)/4)),'秋分の日');
  set(10, nthMon(10,2), year>=2020?'スポーツの日':'体育の日');
  set(11,3,'文化の日'); set(11,23,'勤労感謝の日');
  const base=Object.assign({},H); const DAY=86400000;
  const kf=dt=>`${dt.getFullYear()}-${_p2(dt.getMonth()+1)}-${_p2(dt.getDate())}`;
  for(let dt=new Date(year,0,1); dt.getFullYear()===year; dt=new Date(dt.getTime()+DAY)){
    const k=kf(dt); if(base[k]) continue;
    if(base[kf(new Date(dt.getTime()-DAY))] && base[kf(new Date(dt.getTime()+DAY))]) H[k]='国民の休日';
  }
  Object.keys(base).forEach(k=>{ const a=k.split('-').map(Number); const dt=new Date(a[0],a[1]-1,a[2]);
    if(dt.getDay()===0){ let n=new Date(dt.getTime()+DAY); while(H[kf(n)]) n=new Date(n.getTime()+DAY); H[kf(n)]='振替休日'; } });
  return H;
}

/* ---------- 読み込み ---------- */
async function hLoadBase(){
  CRS = await _fetchAll('courses?select=id,prefecture,school_name,course_name,active,driver_count,attendant_count&order=prefecture,school_name,course_name');
  // 従業員（業務種別で添乗員／運転手を振り分け）
  const staff = await _fetchAll('staff?select=id,name,active&active=eq.true&order=name');
  const jt    = await _fetchAll('job_types?select=id,name');
  const ejt   = await _fetchAll('employee_job_types?select=employee_id,job_type_id');
  const attId = new Set(jt.filter(j=>String(j.name).indexOf('添乗員')>=0).map(j=>j.id));
  const drvId = new Set(jt.filter(j=>String(j.name).indexOf('運転手')>=0).map(j=>j.id));
  const byId  = {}; staff.forEach(s=>byId[s.id]=s);
  const att=new Set(), drv=new Set();
  ejt.forEach(e=>{ if(attId.has(e.job_type_id)) att.add(e.employee_id); if(drvId.has(e.job_type_id)) drv.add(e.employee_id); });
  PEOPLE['添乗員'] = staff.filter(s=>att.has(s.id));
  PEOPLE['運転手'] = staff.filter(s=>drv.has(s.id));
  await hLoadHist();
}

// コースごとの乗務実績（誰が何回乗ったか）。候補の並び順に使う
async function hLoadHist(){
  HIST={};
  try{
    const r = await fetch(`${REST_URL}/rpc/get_crew_history`, { method:'POST', headers:getH(), body:JSON.stringify({}) });
    if(!r.ok) return;
    (await r.json()).forEach(x=>{
      const k = x.course_id+'|'+x.role+'|'+(x.seg_group||'');
      (HIST[k]=HIST[k]||[]).push({ staff_id:x.staff_id, cnt:x.cnt, last_date:x.last_date });
    });
  }catch(e){ /* 履歴が取れなくても配置はできる */ }
}

// 便区分（下校①②はまとめて「下校」）
function _segGroup(seg){
  if(seg==='登校') return '登校';
  if(seg && seg.indexOf('下校')===0) return '下校';
  return seg||'';
}

// 選択肢：このコースの「その便」で過去に乗った人を先頭に、その後ろに全員（名前順）
function _optsFor(cid, segment){
  const sg = _segGroup(segment);
  const all = PEOPLE[TAB] || [];
  const byId = {}; all.forEach(p=>byId[p.id]=p);
  const hist = (HIST[cid+'|'+TAB+'|'+sg]||[]).filter(x=>byId[x.staff_id]);
  let h = '<option value="">（未割り当て）</option>';
  if(hist.length){
    h += `<optgroup label="このコースの${sg}便で過去に乗った人">`;
    hist.forEach(x=>{
      const p = byId[x.staff_id];
      const d = x.last_date ? String(x.last_date).slice(5).replace('-','/') : '';
      h += `<option value="${p.id}">${escHtml(p.name)}　（${x.cnt}回${d?'・直近'+d:''}）</option>`;
    });
    h += '</optgroup>';
  }
  h += '<optgroup label="すべて（名前順）">'
     + all.map(p=>`<option value="${p.id}">${escHtml(p.name)}</option>`).join('')
     + '</optgroup>';
  return h;
}

async function hLoadMonth(){
  const ym=_ym(); if(!ym) return;
  const start=ym+'-01', end=ym+'-'+_p2(_dim(ym));
  DUTIES={}; CREW={}; DIRTY={};
  // 乗務は埋め込みで一緒に取る（IDをURLに並べると長さ上限を超えるため）
  const ds = await _fetchAll(`duties?work_date=gte.${start}&work_date=lte.${end}&select=id,work_date,course_id,segment,seq,start_time,driver_need,attendant_need,duty_crew(id,staff_id,role)&order=course_id,work_date,seq`);
  ds.forEach(d=>{
    (DUTIES[_key(d.course_id,d.work_date)] = DUTIES[_key(d.course_id,d.work_date)]||[]).push(d);
    const cw = Array.isArray(d.duty_crew) ? d.duty_crew : [];
    if(cw.length) CREW[d.id] = cw.map(c=>({ id:c.id, duty_id:d.id, staff_id:c.staff_id, role:c.role }));
  });
  _dirtyView();
}

/* ---------- 集計 ---------- */
function _needOf(d){ return TAB==='添乗員' ? (d.attendant_need||0) : (d.driver_need||0); }
function _crewOf(d){ return (CREW[d.id]||[]).filter(c=>c.role===TAB); }
function _dayTotals(list, date){
  let need=0, got=0; const persons=new Set();
  list.forEach(c=>{
    (DUTIES[_key(c.id,date)]||[]).forEach(d=>{
      need += _needOf(d);
      const cw=_crewOf(d); got += cw.length;
      cw.forEach(x=>persons.add(x.staff_id));
    });
  });
  return { need, got, lack: need-got, persons: persons.size };
}

/* ---------- 表示 ---------- */
function _nameOf(sid){
  const p = PEOPLE[TAB].find(x=>x.id===sid);
  if(p) return p.name;
  const q = PEOPLE[TAB==='添乗員'?'運転手':'添乗員'].find(x=>x.id===sid);
  return q ? q.name : ('ID'+sid);
}
function _segShort(seg){
  if(seg==='登校') return '登';
  if(seg && seg.indexOf('下校')===0) return seg.replace('下校','');
  return seg||'';
}
function _cellHtml(cid,date){
  const ds = DUTIES[_key(cid,date)]||[];
  if(!ds.length) return '<span style="color:#c3cec7;">—</span>';
  const parts = ds.filter(d=>_needOf(d)>0).map(d=>{
    const need=_needOf(d), cw=_crewOf(d);
    const names = cw.length ? cw.map(c=>escHtml(_nameOf(c.staff_id))).join('・') : '—';
    const col = cw.length ? (cw.length<need ? '#e0821a' : '#2d4a38') : '#c0392b';
    return `<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${col};">`
         + `<b style="font-size:10px;color:#5a7a65;">${escHtml(_segShort(d.segment))}</b> ${names}</div>`;
  });
  // 運行はあるがこの役割は不要（例：神奈川の登校専用マイクロは添乗員0名）
  if(!parts.length) return '<span style="color:#c3cec7;font-size:10px;">不要</span>';
  return parts.join('');
}

function hRender(){
  const ym=_ym(); if(!ym) return;
  const [y,m]=ym.split('-').map(Number); const dim=_dim(ym); const HOL=_jpHolidays(y);
  const q=(document.getElementById('hFilter').value||'').trim();
  const pref=document.getElementById('hPref').value;
  const list=CRS.filter(c=>c.active&&(!pref||c.prefecture===pref)&&(!q||((c.school_name||'')+(c.course_name||'')).indexOf(q)!==-1));

  const hcell=(txt,bg,col,extra)=>`<th style="position:sticky;top:0;z-index:3;background:${bg};border:1px solid #d7e2da;padding:2px 3px;font-size:11px;color:${col};min-width:76px;${extra||''}">${txt}</th>`;
  let head=`<tr><th style="position:sticky;left:0;top:0;z-index:5;background:#eef4ef;border:1px solid #d7e2da;padding:4px 8px;font-size:12px;min-width:190px;text-align:left;">学校 ／ コース</th>`;
  for(let d=1; d<=dim; d++){
    const date=`${ym}-${_p2(d)}`; const wd=new Date(y,m-1,d).getDay(); const hol=HOL[date];
    const col=(wd===0||hol)?'#c0392b': wd===6?'#2673c0':'#2d4a38';
    const bg=(wd===0||wd===6||hol)?'#f0f3f0':'#eef4ef';
    head+=hcell(`${d}<br>${WD[wd]}${hol?'<br><span style="font-size:8px;font-weight:700;">祝</span>':''}`, bg, col);
  }
  head+='</tr>';

  // サマリー3行（必要／配置／不足）
  const sumRow=(label,fn,base)=>{
    let r=`<td style="position:sticky;left:0;z-index:2;background:${base};border:1px solid #d7e2da;padding:3px 8px;font-size:12px;font-weight:700;color:#2d4a38;">${label}</td>`;
    for(let d=1; d<=dim; d++){
      const date=`${ym}-${_p2(d)}`; const t=_dayTotals(list,date);
      r+=fn(t,date);
    }
    return `<tr>${r}</tr>`;
  };
  const rowNeed = sumRow('必要人数', t=>`<td style="border:1px solid #d7e2da;background:#f7faf8;text-align:center;font-size:12px;padding:2px;">${t.need||''}</td>`, '#f7faf8');
  const rowGot  = sumRow('配置済',   t=>`<td style="border:1px solid #d7e2da;background:#f7faf8;text-align:center;font-size:12px;padding:2px;">${t.need?t.got:''}</td>`, '#f7faf8');
  const rowLack = sumRow('不足',     t=>{
      if(!t.need) return `<td style="border:1px solid #d7e2da;background:#f7faf8;padding:2px;"></td>`;
      const v=t.lack;
      const st = v>0 ? 'background:#fdeceb;color:#c0392b;font-weight:700;' : 'background:#eef7ef;color:#2f7d32;';
      return `<td style="border:1px solid #d7e2da;text-align:center;font-size:12px;padding:2px;${st}">${v>0?('▲'+v):'0'}</td>`;
    }, '#f7faf8');

  const rows=list.map(c=>{
    let tds=`<td style="position:sticky;left:0;z-index:2;background:#fff;border:1px solid #e2ede6;padding:4px 8px;font-size:12px;min-width:190px;">${escHtml((c.school_name||'')+' ／ '+(c.course_name||''))}</td>`;
    for(let d=1; d<=dim; d++){
      const date=`${ym}-${_p2(d)}`; const wd=new Date(y,m-1,d).getDay(); const isHol=!!HOL[date];
      const has=(DUTIES[_key(c.id,date)]||[]).length>0;
      tds+=`<td onclick="${has?`hOpenAsg(${c.id},'${date}')`:''}" style="border:1px solid #e2ede6;padding:2px 3px;min-width:76px;vertical-align:top;font-size:11px;`
         + `background:${(wd===0||wd===6||isHol)?'#fafbfa':'#fff'};${has?'cursor:pointer;':''}">${_cellHtml(c.id,date)}</td>`;
    }
    return `<tr>${tds}</tr>`;
  }).join('');

  document.getElementById('hArea').innerHTML = list.length
    ? `<table style="border-collapse:separate;border-spacing:0;"><thead>${head}${rowNeed}${rowGot}${rowLack}</thead><tbody>${rows}</tbody></table>`
    : '<p class="muted" style="padding:16px;">該当コースなし</p>';
}

/* ---------- タブ ---------- */
function hSetTab(t){
  TAB=t;
  document.getElementById('tabA').className = 'tab'+(t==='添乗員'?' active':'');
  document.getElementById('tabD').className = 'tab'+(t==='運転手'?' active':'');
  hRender();
}

/* ---------- 割り当てモーダル ---------- */
function hOpenAsg(cid,date){
  const ds=(DUTIES[_key(cid,date)]||[]).filter(d=>_needOf(d)>0);
  if(!ds.length){ status('この日は'+TAB+'の必要がありません', true); return; }
  CUR={cid,date};
  const c=CRS.find(x=>x.id===cid)||{};
  const [y,m,dd]=date.split('-').map(Number);
  document.getElementById('asgTitle').textContent =
    `${m}月${dd}日(${WD[new Date(y,m-1,dd).getDay()]})　${c.school_name||''} ／ ${c.course_name||''}　［${TAB}］`;

  let h=`<div class="row" style="gap:6px;margin-bottom:10px;">`
      + `<button class="mini" onclick="hCopyPrev()">📋 前の運行日と同じにする</button>`
      + `<button class="mini" onclick="hClearAsg()">✖ この日をすべて空に</button>`
      + `<span class="muted" style="font-size:11px;">登校便で選ぶと、空いている下校便にも自動で入ります</span></div>`;
  ds.forEach(d=>{
    const need=_needOf(d); const cw=_crewOf(d);
    const opts=_optsFor(cid, d.segment);   // 便ごとに候補を組む（登校便／下校便で実績が違うため）
    h+=`<div class="duty"><div class="dh"><span class="seg">${escHtml(d.segment)}</span>`
      +`<span class="tm">${d.start_time?escHtml(_hm(d.start_time))+' 発':''}</span>`
      +`<span class="muted">必要 ${need}名</span></div>`;
    for(let i=0;i<need;i++){
      h+=`<div class="crewline"><span class="lb">${TAB}${need>1?(i+1):''}</span>`
        +`<select id="asg_${d.id}_${i}" data-duty="${d.id}" data-idx="${i}" onchange="hAutoFill(${d.id},${i})">`
        +`${opts}</select></div>`;
    }
    h+='</div>';
  });
  document.getElementById('asgBody').innerHTML=h;
  // 現在値を反映（optionを組んだ後に設定）
  ds.forEach(d=>{
    const cw=_crewOf(d); const need=_needOf(d);
    for(let i=0;i<need;i++){
      const el=document.getElementById(`asg_${d.id}_${i}`);
      if(!el) continue;
      if(cw[i]) el.value=String(cw[i].staff_id);
      el.dataset.prev=el.value;      // 連動判定のため、開いた時点の値を覚えておく
    }
  });
  document.getElementById('asgWrap').style.display='block';
}
function hCloseAsg(){ document.getElementById('asgWrap').style.display='none'; CUR=null; }

// 登校便で選んだ人を、空いている他の便の同じ枠へ自動で入れる（手数を減らす）
function hAutoFill(dutyId, idx){
  if(!CUR) return;
  const ds=(DUTIES[_key(CUR.cid,CUR.date)]||[]).filter(d=>_needOf(d)>0);
  const src=ds.find(d=>d.id===dutyId);
  if(!src || src.segment!=='登校') return;
  const el=document.getElementById(`asg_${dutyId}_${idx}`);
  if(!el) return;
  const v=el.value;
  const prev=el.dataset.prev||'';   // 選び直す前の登校便の担当者
  el.dataset.prev=v;
  if(!v) return;                    // 登校便を空に戻したときは他を触らない
  ds.forEach(d=>{
    if(d.id===dutyId) return;
    const t=document.getElementById(`asg_${d.id}_${idx}`);
    if(!t) return;
    // 空欄、または「さっきまで登校便と同じだった欄」だけ追従させる。
    // 個別に別の人へ変えてある下校便はそのまま残す。
    if(!t.value || (prev && t.value===prev)){ t.value=v; t.dataset.prev=v; }
  });
}

// モーダルの選択内容を { 便区分: [staff_id...] } で取り出す
function _collectFromModal(){
  const ds=(DUTIES[_key(CUR.cid,CUR.date)]||[]).filter(d=>_needOf(d)>0);
  const map={};
  ds.forEach(d=>{
    const arr=[];
    for(let i=0;i<_needOf(d);i++){
      const el=document.getElementById(`asg_${d.id}_${i}`);
      const v=el&&el.value?parseInt(el.value,10):null;
      if(v) arr.push(v);
    }
    map[d.segment]=[...new Set(arr)];   // 同じ人の重複は1人だけ
  });
  return map;
}

// 割り当てを1日ぶん適用（便区分でつき合わせるので、日課が違う日でも安全）
function _applyMapToDate(cid,date,map){
  const ds=(DUTIES[_key(cid,date)]||[]).filter(d=>_needOf(d)>0);
  ds.forEach(d=>{
    if(!(d.segment in map)) return;    // その日に無い便は触らない
    const sids=(map[d.segment]||[]).slice(0,_needOf(d));
    const before=_crewOf(d);
    const others=(CREW[d.id]||[]).filter(c=>c.role!==TAB);
    CREW[d.id]= others.concat(sids.map(sid=>{
      const old=before.find(o=>o.staff_id===sid);
      return { id: old?old.id:null, duty_id:d.id, staff_id:sid, role:TAB };
    }));
    DIRTY['d'+d.id+'|'+TAB] = { duty_id:d.id, role:TAB };
  });
}

// 反映先の日付一覧
function _targetDates(scope){
  const ym=_ym(); const dim=_dim(ym); const [y,m]=ym.split('-').map(Number);
  const curD=parseInt(CUR.date.slice(8),10);
  const curDow=new Date(y,m-1,curD).getDay();
  const out=[];
  for(let d=1; d<=dim; d++){
    const date=`${ym}-${_p2(d)}`;
    if(scope==='day'  && d!==curD) continue;
    if(scope==='dow'  && new Date(y,m-1,d).getDay()!==curDow) continue;
    if(scope==='rest' && d<curD) continue;
    if(!(DUTIES[_key(CUR.cid,date)]||[]).length) continue;   // 運行のない日は対象外
    out.push(date);
  }
  return out;
}

// モーダルの内容を画面上のデータへ反映（保存は「変更を保存」で）
function hApplyAsg(){
  if(!CUR) return;
  const scope=(document.getElementById('asgScope')||{}).value || 'day';
  const map=_collectFromModal();
  const dates=_targetDates(scope);
  dates.forEach(dt=>_applyMapToDate(CUR.cid,dt,map));
  const n=dates.length;
  hCloseAsg(); hRender(); _dirtyView();
  status(n>1 ? `${n}日ぶんに反映しました（まだ保存していません）` : '反映しました（まだ保存していません）', true);
}

// 前の運行日と同じ割り当てをモーダルに読み込む
function hCopyPrev(){
  if(!CUR) return;
  const ym=_ym(); const curD=parseInt(CUR.date.slice(8),10);
  let src=null;
  for(let d=curD-1; d>=1; d--){
    const date=`${ym}-${_p2(d)}`;
    const ds=(DUTIES[_key(CUR.cid,date)]||[]).filter(x=>_needOf(x)>0);
    if(ds.length && ds.some(x=>_crewOf(x).length)){ src=date; break; }
  }
  if(!src){ status('この月に、コピーできる前の運行日がありません', false); return; }
  const map={};
  (DUTIES[_key(CUR.cid,src)]||[]).forEach(d=>{ map[d.segment]=_crewOf(d).map(c=>c.staff_id); });
  const ds=(DUTIES[_key(CUR.cid,CUR.date)]||[]).filter(d=>_needOf(d)>0);
  ds.forEach(d=>{
    const sids=map[d.segment]||[];
    for(let i=0;i<_needOf(d);i++){
      const el=document.getElementById(`asg_${d.id}_${i}`);
      if(el){ el.value = sids[i]?String(sids[i]):''; el.dataset.prev=el.value; }
    }
  });
  status(src.slice(5)+' の割り当てを読み込みました。内容を確かめて「反映する」を押してください', true);
}

// この日の選択をすべて空にする（モーダル上のみ。反映するまで確定しない）
function hClearAsg(){
  if(!CUR) return;
  (DUTIES[_key(CUR.cid,CUR.date)]||[]).filter(d=>_needOf(d)>0).forEach(d=>{
    for(let i=0;i<_needOf(d);i++){
      const el=document.getElementById(`asg_${d.id}_${i}`);
      if(el){ el.value=''; el.dataset.prev=''; }
    }
  });
}
function _dirtyView(){
  const n=Object.keys(DIRTY).length;
  const el=document.getElementById('hDirty');
  if(el) el.textContent = n? `未保存 ${n}件`:'';
}

/* ---------- 保存 ---------- */
async function hSave(){
  const keys=Object.keys(DIRTY);
  if(!keys.length){ status('変更はありません', true); return; }
  try{
    for(const k of keys){
      const {duty_id, role} = DIRTY[k];
      // その便・その役割の行を入れ替える（削除→挿入）
      const del = await fetch(`${REST_URL}/duty_crew?duty_id=eq.${duty_id}&role=eq.${encodeURIComponent(role)}`, { method:'DELETE', headers:getH() });
      if(!del.ok){ status('保存に失敗しました：'+(await del.text()).slice(0,120), false); return; }
      const rows=(CREW[duty_id]||[]).filter(c=>c.role===role).map(c=>({duty_id:duty_id, staff_id:c.staff_id, role:role}));
      if(rows.length){
        const ins = await fetch(`${REST_URL}/duty_crew`, { method:'POST', headers:getH(), body:JSON.stringify(rows) });
        if(!ins.ok){ status('保存に失敗しました：'+(await ins.text()).slice(0,120), false); return; }
      }
    }
    DIRTY={}; _dirtyView();
    await hLoadMonth(); await hLoadHist(); hRender();
    status('保存しました', true);
  }catch(e){ status('保存に失敗しました：'+e.message, false); }
}

/* ---------- 便の生成 ---------- */
async function hGenerate(){
  const ym=_ym(); if(!ym){ status('対象月を選んでください', false); return; }
  const start=ym+'-01', end=ym+'-'+_p2(_dim(ym));
  if(!confirm(`${ym} の便を月間予定から作成します。\n既にある便はそのまま（担当者は消えません）。よろしいですか？`)) return;
  try{
    const r = await fetch(`${REST_URL}/rpc/generate_duties`, { method:'POST', headers:getH(), body:JSON.stringify({p_start:start, p_end:end}) });
    const t = await r.text();
    if(!r.ok){ status('作成に失敗しました：'+t.slice(0,150), false); return; }
    let j={}; try{ j=JSON.parse(t); }catch(e){}
    await hLoadMonth(); hRender();
    status(`便を作成しました（新規 ${j.created??'?'}件／この月の合計 ${j.total_now??'?'}件）`, true);
  }catch(e){ status('作成に失敗しました：'+e.message, false); }
}

/* ---------- 起動 ---------- */
document.addEventListener('DOMContentLoaded', async () => {
  const ok = await initAuth(['super_admin','admin','operator','staff']);
  if (!ok) return;
  const now=new Date();
  document.getElementById('hMonth').value = `${now.getFullYear()}-${_p2(now.getMonth()+1)}`;
  document.getElementById('hMonth').addEventListener('change', async ()=>{ await hLoadMonth(); hRender(); });
  document.getElementById('hFilter').addEventListener('input', hRender);
  document.getElementById('hPref').addEventListener('change', hRender);
  try{
    await hLoadBase();
    await hLoadMonth();
    hRender();
  }catch(e){ status('読み込みに失敗しました：'+e.message, false); }
});
</script>
